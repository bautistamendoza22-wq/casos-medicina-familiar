// Historias ampliadas y evolución progresiva (casos 0-24)
X(0,"Valentina tiene 6 semanas. Su madre, Daiana (24 años, primípara), consulta al CAPS porque llora \"todas las tardes\" desde hace 2 semanas: empieza a las 18 h y dura unas 3 h, 5 días por semana. Durante el llanto encoge las piernas, se pone colorada y parece que \"le duele la panza\"; después se calma y duerme bien. Nació a término por parto vaginal, 3.200 g. Recibe lactancia materna exclusiva a demanda, unas 9-10 tomas por día. Deposiciones amarillas, blandas, 4 por día. Sin vómitos, fiebre ni rechazo del pecho.\n\nExamen físico: peso 4.250 g (aumento de 35 g/día), afebril, activa, reactiva, fontanela normotensa, abdomen blando y depresible, sin masas ni hernias. Resto normal.\n\nDaiana está sola gran parte del día porque su pareja trabaja; duerme 4 h por noche. La abuela le aconsejó darle té de anís y pasarla a fórmula \"porque la leche no la llena\".",
{2:"Daiana te cuenta que ya le dio té de anís dos veces en mamadera la semana pasada \"y pareció que la calmaba\". Pregunta si puede seguir dándoselo.",
 3:"Le explicás el manejo general. Daiana pide alguna maniobra concreta para hacer en casa cuando empieza el llanto de la tarde.",
 4:"Al final de la consulta, Daiana se emociona: dice que a veces, de noche, siente que \"no da más\" y que tiene miedo de perder la paciencia.",
 5:"Antes de terminar, al revisar la boca notás placas blanquecinas que no se desprenden con el bajalenguas en la mucosa yugal. Valentina sigue mamando bien."});
X(1,"Tomás tiene 2 años y viene al control de salud con su madre. Vacunas completas, crecimiento en percentil 50 de peso y talla, desarrollo acorde. Va al jardín maternal.\n\nAl examen: hernia umbilical de 1,5 cm, reductible, indolora, sin cambios de coloración. Genitales: prepucio que no se retrae al intentar descubrir el glande, sin fisuras, secreción ni eritema; nunca tuvo balanopostitis ni ITU. Ambos testículos en bolsa, de tamaño normal. Sin hernias inguinales.\n\nLa madre te muestra que desde hace meses le pega una moneda con cinta sobre el ombligo \"para que se cierre\", como le enseñó su suegra. La piel periumbilical está enrojecida.",
{2:"La madre insiste: \"¿Entonces le saco la moneda? Mi suegra dice que así se le cerró a todos sus hijos\".",
 3:"Pasan a hablar del prepucio. La madre cuenta que en el baño intenta \"bajarle el cuerito\" con fuerza porque le dijeron que hay que limpiarlo así.",
 4:"La madre pregunta qué pasaría si a los 7 años siguiera igual.",
 5:"Ya cerrando, la madre comenta que su sobrino de 7 meses tiene \"un huevito que no bajó\": el pediatra lo controló a los 3 meses y sigue sin descender."});
X(2,"Marta tiene 68 años, es jubilada docente. Trae una densitometría que pidió su ginecóloga: T-score -2,8 en columna lumbar y -2,3 en cuello femoral. Hace un año se fracturó la muñeca derecha al caerse de su altura en la vereda.\n\nAntecedentes: menopausia a los 47 años, HTA tratada con enalapril. Fuma 10 cigarrillos/día desde los 20 años. Toma poca leche (\"me cae mal\") y casi no come quesos. Camina poco.\n\nExamen: peso 54 kg, talla 1,55 m (perdió 3 cm en 10 años), TA 128/78, sin cifosis marcada.\n\nLaboratorio: calcemia y fosfatemia normales, función renal normal, 25-OH vitamina D 26 ng/ml. Pregunta por \"la pastilla de los huesos\" que toma una amiga.",
{2:"Marta quiere empezar hoy mismo la pastilla. Revisás su laboratorio y su ingesta de calcio antes de indicarla.",
 3:"Su vitamina D es adecuada y acordás aumentar el calcio de la dieta. Ahora hay que elegir el bifosfonato y el esquema.",
 4:"Marta comenta que tiene que hacerse un implante dental en unos meses y que no va al odontólogo hace 3 años.",
 5:"Inicia el tratamiento. Pregunta cuándo tiene que repetir la densitometría para \"ver si funciona\"."});
X(3,"Rodolfo tiene 79 años; lo trae su hija Silvana. En el último año se cayó 3 veces dentro de casa, la última al levantarse de noche para ir al baño (sin pérdida de conocimiento). Además está \"cada vez más olvidadizo\": repite las preguntas, dejó de manejar sus cuentas y hace un mes se perdió volviendo del almacén de la esquina.\n\nAntecedentes: HTA, viudo hace 3 años, vive solo; Silvana pasa todas las tardes. Medicación: enalapril 10 mg c/12 h y clonazepam 2 mg a la noche \"desde que murió mi mamá\". Usa anteojos multifocales todo el día.\n\nExamen: TA 132/78 sentado y 128/76 de pie, marcha lenta con base algo amplia, sin foco neurológico. MMSE 19/30. Laboratorio con TSH, B12 y función renal normales. La evaluación orienta a demencia tipo Alzheimer leve-moderada.",
{2:"Silvana pregunta qué más pueden hacer para evitar que se vuelva a caer; leyó que la vitamina D sirve.",
 3:"Visitás el domicilio: hay alfombras sueltas en el pasillo, poca luz camino al baño y Rodolfo camina en pantuflas.",
 4:"Se acuerda iniciar un inhibidor de la acetilcolinesterasa después de explicar sus beneficios y su costo.",
 5:"Silvana está desbordada: dice que discute con su padre cuando él insiste en que tiene que ir a trabajar."});
X(4,"Camila tiene 26 años, cursa su primer embarazo de 14 semanas, controlado. Asintomática: niega disuria, polaquiuria, fiebre o dolor lumbar. Sin antecedentes de ITU ni alergias.\n\nExamen: TA 110/70, afebril, puñopercusión negativa, altura uterina acorde.\n\nEn los estudios del primer trimestre, el urocultivo informa > 100.000 UFC/ml de E. coli, sensible a nitrofurantoína, cefalexina y fosfomicina, resistente a ampicilina.",
{2:"Le explicás que hay que tratarlo. Camila pregunta qué antibiótico va a tomar y por cuánto tiempo.",
 3:"Termina el tratamiento sin efectos adversos.",
 4:"En la semana 22, una amiga le dice que \"el Bactrim es el mejor para la orina\" y te pregunta si puede usarlo la próxima vez.",
 5:"A las 34 semanas consulta por disuria y polaquiuria de 1 día, sin fiebre ni dolor lumbar; la puñopercusión es negativa."});
X(5,"Brenda tiene 19 años y llega a su primer control prenatal con 20 semanas por FUM. No planificó el embarazo. Su pareja, de 23 años, nunca se hizo estudios.\n\nNo recuerda úlceras genitales ni erupciones. Refiere \"alergia a la penicilina\" porque de chica, tomando amoxicilina por una angina, le salieron ronchas que se le fueron con un antialérgico; nunca tuvo edema de glotis ni dificultad respiratoria.\n\nExamen: TA 108/68, sin lesiones cutáneo-mucosas ni adenopatías. Laboratorio: VDRL reactiva 1/16; VIH y HBsAg no reactivos.",
{2:"Antes de indicar la primera dosis, Brenda insiste en su antecedente de alergia y pide \"otro antibiótico, en pastillas\".",
 3:"Se evalúa el antecedente y recibe la primera dosis sin reacción. Pregunta si con esto el bebé ya está protegido.",
 4:"No vuelve la semana siguiente porque se mudó. Regresa 10 días después de la fecha en que le tocaba la segunda dosis.",
 5:"Su pareja viene finalmente a la consulta con VDRL reactiva y prueba treponémica positiva."});
X(6,"Lucía tiene 32 años, es administrativa. Consulta por flujo vaginal amarillo-verdoso, abundante, espumoso, con mal olor, ardor vulvar y disuria de 5 días. Pareja estable desde hace 2 años; él \"está bien\". Usa ACO. FUM hace 2 semanas. No está embarazada ni amamantando. No tiene VIH.\n\nEspeculoscopia: flujo amarillo-verdoso espumoso, paredes vaginales eritematosas, cuello con puntillado rojo (\"aspecto de frutilla\"). Tacto: sin dolor a la movilización cervical ni anexos dolorosos. pH vaginal 6.",
{2:"Con el diagnóstico presuntivo, Lucía pregunta qué tiene que tomar.",
 3:"Le indicás metronidazol. Lucía comenta que este fin de semana es el casamiento de su hermana.",
 4:"Lucía dice que su pareja no tiene ningún síntoma y que \"no le va a querer tomar nada\".",
 5:"A los 3 meses vuelve por otro cuadro: flujo blanco grumoso, prurito intenso y vulva eritematosa y edematosa. Está muy molesta."});
X(7,"Agustina tiene 22 años, estudiante. Consulta por dolor pelviano bilateral de 3 días, flujo mucopurulento y dispareunia. Tuvo una pareja nueva hace 1 mes, sin preservativo. Usa DIU de cobre desde hace 2 años. FUM hace 10 días. Sin náuseas ni vómitos.\n\nExamen: T 38 °C, FC 92, TA 115/70. Abdomen con dolor a la palpación en hipogastrio, sin defensa ni reacción peritoneal. Especuloscopia: flujo mucopurulento por el orificio cervical; se ven los hilos del DIU. Tacto: dolor a la movilización cervical y anexial bilateral, sin masas palpables.\n\nTest de embarazo negativo. Tolera la vía oral y vive cerca del centro de salud.",
{2:"Decidís tratamiento ambulatorio. Hay que elegir el esquema.",
 3:"Agustina pregunta si tiene que sacarse el DIU, porque leyó que \"el DIU causa infecciones\".",
 4:"Le explicás los motivos por los que tendría que internarse si el cuadro cambia.",
 5:"Agustina se va con el tratamiento. Te pregunta qué hace con la pareja actual y con un chico con el que estuvo hace 6 semanas."});
X(8,"Florencia tiene 30 años y es puérpera de 3 semanas de su segundo hijo; amamanta a demanda. Desde hace 36 h tiene dolor en la mama derecha, con una zona roja y caliente, fiebre de 38,6 °C, escalofríos y malestar general \"como una gripe\". El bebé tiene una prendida superficial y le cuesta vaciar esa mama.\n\nExamen: T 38,6 °C, FC 98. Mama derecha con área eritematosa, caliente e indurada en el cuadrante superoexterno, de 6 cm, sin fluctuación. Pezón con una grieta pequeña. Mama izquierda normal.\n\nFlorencia pregunta si debe dejar de amamantar \"para no pasarle la infección al bebé\".",
{2:"Le explicás que siga amamantando. Por la evolución y el compromiso general, evaluás si agregar antibiótico.",
 3:"Florencia pregunta si le conviene ponerse una bolsa de agua caliente todo el día sobre la mama.",
 4:"Le das pautas de alarma. Pregunta qué pasaría si \"se le forma pus\".",
 5:"Se va con el tratamiento y las medidas. Hay que definir el seguimiento."});
X(9,"Silvia tiene 52 años, contadora. FUM hace 14 meses. Desde hace 8 meses tiene sofocos unas 10 veces por día, que la despiertan 3-4 veces por noche; está agotada y le cuesta concentrarse en el trabajo. También refiere sequedad vaginal y dispareunia.\n\nAntecedentes: útero presente, sin histerectomía. Sin cáncer de mama personal ni familiar, sin TVP/TEP, sin enfermedad coronaria ni ACV, sin hepatopatía. No fuma.\n\nExamen: TA 124/78, IMC 25. Mamas sin nódulos. Mucosa vaginal pálida y seca. Mamografía y PAP normales hace 6 meses.\n\nPregunta por \"las hormonas\" que toma su hermana.",
{2:"Por la intensidad de los síntomas y la ausencia de contraindicaciones, acuerdan probar THR.",
 3:"Silvia comenta que su hermana tuvo una trombosis venosa en la pierna hace 2 años y pregunta qué situaciones impiden usar hormonas.",
 4:"Los sofocos mejoran, pero la dispareunia persiste.",
 5:"Silvia pregunta qué controles necesita mientras use THR."});
X(10,"Rocío tiene 38 años, 2 hijos, no busca embarazo. Consulta por menstruación muy abundante desde hace 6 días, con coágulos y cambio de toallita cada hora. Sus ciclos eran regulares. Usa preservativo. No fuma, no tiene migraña con aura, HTA, trombosis ni enfermedad hepática.\n\nExamen: TA 118/76, FC 86, sin hipotensión ortostática. Mucosas algo pálidas. Especuloscopia: sangrado moderado por el orificio cervical, sin lesiones. Útero de tamaño normal.\n\nLaboratorio: Hb 9,5 g/dl, Hto 31 %, VCM 76, test de embarazo negativo. Ecografía transvaginal: útero homogéneo, sin miomas ni pólipos, endometrio de 9 mm.",
{2:"Rocío está estable. Te preguntás si necesita internación.",
 3:"Clasificás la anemia como moderada y elegís un ACO monofásico de 30 µg de etinilestradiol.",
 4:"Rocío cuenta que su hermana no puede tomar estrógenos y también sangra mucho; pregunta qué opciones tendría ella.",
 5:"El sangrado cede. Ahora hay que tratar la ferropenia."});
X(11,"Mateo tiene 8 años y pesa 26 kg. Desde ayer tiene fiebre de 39 °C, odinofagia intensa y dolor abdominal leve; no tiene tos, rinorrea ni conjuntivitis. Sin alergias. Sin antecedente de fiebre reumática.\n\nExamen: T 39 °C, FC 110. Amígdalas hipertróficas, eritematosas, con exudado blanquecino; petequias en el paladar. Adenopatías cervicales anteriores dolorosas. Sin hepatoesplenomegalia ni exantema.\n\nEl test rápido para estreptococo beta hemolítico del grupo A es positivo.",
{2:"Con el diagnóstico confirmado, elegís el antibiótico.",
 3:"La madre trabaja todo el día y lo cuida la abuela; teme que no cumpla 10 días de jarabe.",
 4:"La madre pregunta cuándo puede volver a la escuela, porque tiene una prueba.",
 5:"Su hermano menor, de 6 años, tuvo una reacción alérgica grave a la amoxicilina; la madre pregunta qué le darían a él si tuviera lo mismo."});
X(12,"Benjamín tiene 18 meses y pesa 11 kg. Hace 5 días tiene rinorrea y tos; desde ayer, fiebre de 38,8 °C, irritabilidad, llanto nocturno y se tironea ambas orejas. Come menos. Va a la guardería. Vacunas completas. Sin alergias. Es su primer episodio de otitis.\n\nExamen: T 38,8 °C, buen estado general, hidratado. Otoscopia: ambas membranas timpánicas abombadas, opacas, eritematosas, sin reflejo luminoso ni otorrea. Fauces congestivas. Auscultación pulmonar normal.",
{2:"Decidís tratar con antibiótico. Hay que calcular la dosis para sus 11 kg.",
 3:"A las 48 h está afebril, come mejor, pero todavía está algo molesto de noche. La madre pregunta si cambia el antibiótico.",
 4:"La madre pregunta qué hubiera pasado si \"le salía líquido del oído\".",
 5:"Su primo de 4 años tiene OMA unilateral, está en buen estado, con 38 °C y sin factores de riesgo."});
X(13,"Jorge tiene 70 años. Es julio. Consulta por fiebre de 39 °C, mialgias intensas, cefalea, odinofagia y tos seca de inicio brusco hace 30 h. Su nieta tuvo \"gripe\" la semana pasada.\n\nAntecedentes: EPOC (usa LABA + LAMA) y DBT2 con metformina. Recibió la vacuna antigripal en abril. No fuma desde hace 5 años.\n\nExamen: T 38,9 °C, FC 96, FR 18, SatO2 95 % aire ambiente, TA 130/80. Lúcido. Auscultación: murmullo vesicular disminuido en forma global, sin rales ni sibilancias. Glucemia capilar 180 mg/dl.",
{2:"Decidís iniciar el antiviral.",
 3:"Su nieta de 9 años sigue con fiebre y la madre le está dando \"una aspirina para chicos\".",
 4:"Jorge se va a su casa con el tratamiento y pautas de alarma.",
 5:"Jorge pregunta si, por haber esperado un día, el remedio ya no le sirve."});
X(14,"Paula tiene 34 años, docente. Hace 9 días tuvo un resfrío; mejoró, pero desde hace 4 días presenta congestión nasal, rinorrea purulenta y dolor facial maxilar derecho que empeora al agacharse. Afebril. Sin alergias. No tiene asma ni inmunocompromiso.\n\nExamen: T 36,8 °C, buen estado general. Rinoscopia: mucosa congestiva con secreción mucopurulenta. Dolor a la presión en región maxilar derecha. Sin edema periorbitario ni alteraciones visuales.\n\nVive cerca del centro de salud y puede volver si empeora.",
{2:"Vuelve a las 72 h: fiebre de 38,3 °C y más dolor facial.",
 3:"Tras 3 días de amoxicilina sigue igual.",
 4:"Paula usa oximetazolina nasal \"todo el día\" desde hace 10 días porque no puede respirar.",
 5:"Paula pregunta qué le darían a su hijo de 6 años si tuviera lo mismo."});
X(15,"Andrés tiene 45 años, chofer. Consulta por ojo rojo derecho de 2 días, con secreción amarillenta que le pega los párpados a la mañana. Siente arenilla, sin dolor intenso. No usa lentes de contacto. Su hijo tuvo algo parecido la semana pasada.\n\nExamen: agudeza visual conservada en ambos ojos. Ojo derecho: hiperemia conjuntival difusa, a predominio periférico, con secreción mucopurulenta. Córnea transparente, pupila normorreactiva, sin fotofobia. Ojo izquierdo normal. Sin adenopatía preauricular.",
{2:"Confirmás el diagnóstico y elegís el tratamiento.",
 3:"Le das pautas de alarma. Andrés pregunta cuándo un ojo rojo es una urgencia.",
 4:"Esa tarde atendés a una mujer de 68 años con ojo rojo doloroso, visión borrosa, halos, pupila midriática arreflexiva y vómitos.",
 5:"Andrés pregunta qué le hubieras dado si fuera \"un virus\" como el que tuvo su esposa: ojo rojo con lagrimeo, sin pus."});
X(16,"Martina tiene 15 años. Desde hace 2 años tiene estornudos en salva, rinorrea acuosa, prurito nasal y ocular y obstrucción nasal todo el año, peor a la mañana y al limpiar su cuarto. Duerme mal y ronca. Sin asma ni sibilancias. Usa a veces clorfeniramina, que le da sueño en la escuela.\n\nEn su cuarto hay alfombra, cortinas gruesas, muchos peluches y un ventilador de techo. Tiene un gato que duerme con ella.\n\nExamen: ojeras, pliegue nasal transversal, mucosa nasal pálida y edematosa con secreción acuosa. Auscultación normal.",
{2:"Le indicás corticoide nasal. La madre pregunta qué más pueden hacer en la casa.",
 3:"A las 6 semanas, con buena adherencia, Martina mejoró la obstrucción, pero sigue con estornudos y prurito ocular.",
 4:"La madre tiene miedo de que el spray \"le arruine la nariz\" a largo plazo.",
 5:"Martina pregunta por un spray que vio en la farmacia \"para que no gotee la nariz\"."});
X(17,"Sofía tiene 24 años, estudiante de enfermería. Tiene asma desde la adolescencia. Usa sólo salbutamol \"cuando se ahoga\": 3-4 veces por semana, y se despierta con tos 1 vez cada 15 días. En el último año compró 4 aerosoles de salbutamol. Nunca se internó ni recibió corticoides orales. No fuma. Tiene rinitis alérgica.\n\nExamen: SatO2 98 %, FR 14, auscultación con sibilancias espiratorias aisladas. Espirometría: VEF1 82 % del teórico, con respuesta significativa al broncodilatador.\n\nSofía dice que no quiere \"corticoides todos los días\".",
{2:"Revisando la historia de dispensación ves los 4 envases de salbutamol del último año.",
 3:"Clasificás sus síntomas: menos de 3-5 días por semana y función pulmonar levemente reducida. Hay que elegir el tratamiento inicial preferido.",
 4:"Sofía acepta un único inhalador de budesonida-formoterol 160/4,5. Te pide que le expliques cómo usarlo.",
 5:"Le entregás un plan de acción escrito y verificás la técnica inhalatoria."});
X(18,"Nicolás tiene 17 años. Asma desde los 10. Llega al centro de salud a las 11 h con disnea desde la mañana, tras 3 días de resfrío. Usa ICS-formoterol a demanda pero \"se olvida\". No tuvo internaciones; un ciclo de corticoide oral hace 1 año.\n\nExamen: habla en frases, FR 26, FC 112, usa músculos accesorios, sibilancias espiratorias difusas, SatO2 93 % aire ambiente. PEF 60 % de su mejor valor. Sin urticaria, edema ni hipotensión (no hay anafilaxia). Sin somnolencia ni cianosis.",
{2:"Clasificaste la exacerbación. Iniciás el tratamiento en el centro de salud mientras lo reevaluás.",
 3:"La madre pide \"una placa y análisis de sangre\" y pregunta si no hace falta antibiótico.",
 4:"A la 1 h mejora. A las 2 h de la última dosis de salbutamol: habla en oraciones, FR 18, SatO2 96 %, PEF 78 %. La familia tiene recursos y vive cerca.",
 5:"Preparás el alta con el corticoide oral y el plan de seguimiento."});
X(19,"Lautaro tiene 8 años y pesa 28 kg. Asma diagnosticada a los 5 años. Tiene síntomas 3-4 días por semana, tos nocturna 2 veces por semana y se agita jugando al fútbol. Usa salbutamol con aerocámara a demanda y tiene buena técnica. Sin exacerbaciones graves en el último año. Rinitis alérgica a ácaros.\n\nExamen: SatO2 98 %, auscultación normal en el momento de la consulta. Crecimiento normal.\n\nLos padres temen que los corticoides inhalados \"no lo dejen crecer\".",
{2:"Indicás fluticasona propionato inhalada a dosis baja. Hay que definir cuánto es \"dosis baja\" a su edad.",
 3:"Al año, pese a buena adherencia, sigue con síntomas casi diarios y una crisis reciente. El especialista propone MART con budesonida-formoterol 80/4,5 en paso 4.",
 4:"Con el nuevo esquema está controlado desde hace 3 meses. La madre pregunta si pueden \"bajar los remedios\".",
 5:"El padre leyó sobre montelukast \"en pastillas, que es más cómodo\" y pregunta por qué no lo usan."});
X(20,"Emma tiene 5 meses y pesa 7 kg. Es mayo. Hace 3 días empezó con rinorrea y tos; hoy tiene \"silbidos en el pecho\" y respira más rápido. Afebril. Toma bien el pecho, algo más espaciado. Nació a término con 3.300 g, sin internaciones. Vacunas al día. Vive con sus padres, que fuman dentro de la casa, y un hermano de 3 años que va al jardín.\n\nExamen: FR 48, FC 140, SatO2 95 % aire ambiente, tiraje subcostal leve, sibilancias espiratorias y rales difusos. Score de Tal 4. Hidratada, activa.",
{2:"La madre pide \"un antibiótico o unos corticoides para que se cure más rápido\", como le dieron a su sobrino.",
 3:"Le das las indicaciones para el cuidado en casa.",
 4:"Le explicás las pautas de alarma para volver de inmediato.",
 5:"Al 7° día la tos mejoraba, pero reaparece la fiebre de 38,5 °C y está más irritable."});
X(21,"Joaquín tiene 3 años y pesa 15 kg. Desde hace 2 días tiene fiebre de 39 °C, tos y \"respira rápido\". Come menos pero toma líquidos. Vacunas completas. Sin alergias. Sin internaciones previas. Familia continente, vive a 10 cuadras.\n\nExamen: T 39 °C, FC 130, FR 40, SatO2 95 %. Leve tiraje subcostal. Rales crepitantes y soplo tubario en base derecha. Sin sibilancias. Hidratado.\n\nRx de tórax: consolidación lobar en lóbulo inferior derecho, sin derrame.",
{2:"La madre cuenta que su otro hijo, de 2 meses, se internó el año pasado por neumonía y pregunta por qué a él no lo internan.",
 3:"La abuela recuerda que Joaquín tuvo ronchas con un antibiótico \"de los que terminan en -ina\" y pregunta qué otra opción hay.",
 4:"Joaquín se va con amoxicilina, antitérmicos y pautas de alarma.",
 5:"La madre pregunta en qué casos tendría que internarse."});
X(22,"Héctor tiene 72 años, jubilado, vive con su hija. Desde hace 3 días tiene fiebre de 38,5 °C, tos productiva con esputo herrumbroso y dolor punzante en hemitórax derecho que aumenta al respirar. Antecedentes: DBT2 bien controlada con metformina, ex tabaquista de 20 paquetes/año (dejó hace 15 años). Sin alergias. Vacuna antigripal al día; no recibió antineumocócica.\n\nExamen: lúcido y orientado, T 38,4 °C, FR 24, FC 100, TA 130/80, SatO2 94 %. Rales crepitantes y soplo tubario en base derecha.\n\nLaboratorio: urea 38 mg/dl, glucemia 160 mg/dl, leucocitos 15.000. Rx: consolidación en lóbulo inferior derecho.",
{2:"Decidís manejo ambulatorio y tenés que elegir el antibiótico.",
 3:"La hija pregunta cuántos días tiene que tomarlo.",
 4:"Le das pautas de alarma y citás para control.",
 5:"Héctor mejora. La hija pregunta si hay que \"sacar otra placa para ver si se fue\"."});
X(23,"Raúl tiene 64 años, ex pintor de obra. Ex tabaquista de 40 paquetes/año, dejó hace 2 años. Diagnóstico de EPOC con espirometría: VEF1/CVF posbroncodilatador 0,58, VEF1 62 %. Tiene disnea al caminar en llano a su paso (mMRC 2) y tos matinal. El año pasado tuvo 1 exacerbación tratada en forma ambulatoria. Usa salbutamol a demanda.\n\nExamen: IMC 26, SatO2 93 %, FR 18, murmullo vesicular disminuido, espiración prolongada. Sin edemas.\n\nLaboratorio: eosinófilos 150/µl, Hto 45 %.",
{2:"Raúl leyó que \"los corticoides inhalados ayudan\" y pregunta si los necesita.",
 3:"Su esposa pregunta si en algún momento va a necesitar \"un tubo de oxígeno en casa\".",
 4:"En invierno consulta por más disnea y esputo amarillo-verdoso de 3 días. Lúcido, SatO2 92 %, FR 22, sin edemas, buena red familiar.",
 5:"Al recuperarse, revisás su calendario de vacunación."});
X(24,"Diego tiene 35 años, albañil, pesa 62 kg. Consulta por tos con expectoración de 6 semanas, sudoración nocturna, fiebre vespertina y pérdida de 5 kg. Fuma 15 cigarrillos/día. Vive con su pareja y su hija de 4 años en una casa de 2 ambientes.\n\nExamen: T 37,8 °C, SatO2 96 %, rales en vértice derecho. Rx: infiltrado con cavitación en lóbulo superior derecho.\n\nBaciloscopia de esputo positiva (++). VIH negativo. Hepatograma y función renal normales. Nunca recibió tratamiento antituberculoso.",
{2:"Calculás la dosis de la fase intensiva según su peso.",
 3:"Diego pregunta a qué hora y cómo tiene que tomar las pastillas, porque trabaja desde temprano.",
 4:"Su hija de 4 años está asintomática y con Rx normal, sin enfermedad activa.",
 5:"Diego está en el 2° mes de tratamiento y pregunta cuándo le van a repetir \"el análisis del esputo\"."});
// Historias ampliadas y evolución progresiva (casos 25-49)
X(25,"Milagros tiene 10 años. Desde hace 2 semanas tiene picazón intensa que empeora de noche y no la deja dormir. Su hermano de 3 años y su madre también se rascan. Viven 5 personas en 2 ambientes y comparten camas. Una prima que se quedó a dormir hace un mes \"tenía granitos\".\n\nExamen: pápulas eritematosas excoriadas y surcos finos en espacios interdigitales de las manos, cara anterior de muñecas, axilas y cintura. Sin pústulas ni costras melicéricas. Cuero cabelludo y cara respetados. Afebril.",
{2:"Indicás permetrina 5 % a toda la familia. La madre pregunta cómo se pone la crema en los adultos.",
 3:"La madre pregunta si tiene que tirar los colchones o fumigar la casa.",
 4:"El padre leyó que \"hay una pastilla\" y pregunta si pueden dársela a todos, incluido el de 3 años; además su madre amamanta a un bebé.",
 5:"A los 10 días Milagros sigue con algo de picazón, aunque no aparecieron lesiones nuevas."});
X(26,"Abril tiene 7 años. La maestra mandó una nota: tiene piojos y hay varios casos en el grado. Se rasca la cabeza desde hace 2 semanas. Tiene el pelo largo hasta la cintura.\n\nExamen: liendres adheridas al tallo piloso a menos de 1 cm del cuero cabelludo, en nuca y detrás de las orejas; se ve un piojo vivo. Pápulas de rascado en la nuca, sin costras melicéricas, pus ni adenopatías dolorosas.\n\nLa madre ya le pasó vinagre puro y un champú \"natural\" sin resultado.",
{2:"Indicás permetrina 2,5 %. La madre pregunta qué más tiene que hacer en casa.",
 3:"La escuela pide que no vuelva \"hasta que no tenga ninguna liendre\".",
 4:"La madre pregunta si no hay una pastilla \"para no tener que pasarle tantos productos\".",
 5:"Dos semanas después, su prima consulta con piojos, costras melicéricas en el cuero cabelludo y adenopatías occipitales dolorosas."});
X(27,"Norma tiene 58 años, empleada doméstica, obesa, con insuficiencia venosa crónica. Desde hace 2 días tiene la pierna izquierda roja, caliente y dolorosa, sin fiebre ni escalofríos. Hace meses tiene \"pie de atleta\" con fisuras entre los dedos. Sin alergias. Sin DBT.\n\nExamen: T 37,2 °C, FC 84, TA 125/80. Placa eritematosa, brillante, caliente, de bordes netos y sobreelevados en el tercio inferior de la pierna izquierda, de 12 × 8 cm. Sin ampollas, necrosis, crepitación ni fluctuación. Dolor proporcional al cuadro. Maceración y fisuras interdigitales con descamación. Pulsos presentes.",
{2:"Confirmás el diagnóstico y elegís el antibiótico.",
 3:"Norma tiene que seguir trabajando de pie y pregunta qué más puede hacer.",
 4:"Le das pautas de alarma para volver de inmediato.",
 5:"Su vecina, con un cuadro similar, tuvo anafilaxia con penicilina."});
X(28,"Alberto tiene 70 años, jubilado. Desde hace 3 días siente ardor y dolor punzante en el hemitórax derecho, \"como una quemadura\", y desde ayer le aparecieron ampollitas. Antecedentes: HTA controlada. No es inmunocomprometido. Función renal normal. Tuvo varicela en la infancia.\n\nExamen: vesículas agrupadas sobre base eritematosa, en banda, siguiendo el dermatoma T5 derecho, sin pasar la línea media. Algunas costras. Sin compromiso ocular. Dolor 5/10.",
{2:"Decidís indicar aciclovir.",
 3:"Alberto pregunta qué toma para el dolor, que no lo deja dormir.",
 4:"Su hijo médico le comentó que \"a veces se agregan corticoides\".",
 5:"Su esposa tiene fuegos labiales a repetición y pregunta qué le sirve a ella, que siente el hormigueo antes de que aparezcan."});
X(29,"Julieta tiene 16 años. Desde hace 1 año tiene granitos en la frente, nariz y mejillas que la avergüenzan; dejó de ir a una fiesta de 15. Evita el chocolate y los lácteos por consejo de amigas. Usa una base de maquillaje grasa. Menarca a los 12, ciclos regulares, sin hirsutismo. No toma medicación. No tiene relaciones sexuales.\n\nExamen: comedones abiertos y cerrados abundantes en zona T, con unas 10 pápulas y 6 pústulas en mejillas. Sin nódulos, quistes ni cicatrices. Tronco respetado.",
{2:"Julieta pregunta si tiene que seguir sin comer chocolate.",
 3:"Le indicás ácido retinoico a la noche. Su madre pregunta qué cuidados tiene que tener.",
 4:"Julieta pregunta cuándo va a ver resultados, porque quiere estar bien para el viaje de egresados.",
 5:"Su hermano de 19 años tiene acné con nódulos y quistes dolorosos y cicatrices en la cara."});
X(30,"Carlos tiene 52 años, diabético tipo 2 con metformina, HbA1c 7,4 %. Trabaja en un frigorífico con botas de goma todo el día. Consulta porque tiene las uñas de ambos pies engrosadas, amarillentas y que se rompen, y picazón entre los dedos. El año pasado tuvo 2 celulitis en la pierna derecha que requirieron antibiótico.\n\nExamen: onicodistrofia con hiperqueratosis subungueal en varias uñas de ambos pies. Descamación, maceración y fisuras en el 4° espacio interdigital. Pulsos pedios presentes, sensibilidad conservada con monofilamento.\n\nHepatograma normal. Toma atorvastatina 20 mg.",
{2:"El micológico directo y el cultivo confirman dermatofitos. Hay que elegir el esquema.",
 3:"Carlos pregunta si necesita \"algún análisis\" durante el tratamiento.",
 4:"Para la descamación interdigital, ¿qué le indicás además?",
 5:"Un colega propone itraconazol en lugar de terbinafina. Carlos toma atorvastatina y omeprazol."});
X(31,"Thiago tiene 4 años y dermatitis atópica desde los 6 meses; también tiene rinitis alérgica. Desde hace 1 semana tiene un brote con placas rojas, secas, con costras de rascado en pliegues de codos y rodillas. Se rasca de noche y duerme mal. La madre lo baña todos los días con agua muy caliente y jabón perfumado \"para sacarle la mugre\". Usa ropa de lana.\n\nExamen: placas eccematosas liquenificadas y excoriadas en pliegues antecubitales y poplíteos, xerosis generalizada. Sin pústulas, costras melicéricas ni vesículas umbilicadas. Afebril.",
{2:"Indicás el tratamiento del brote. La madre pregunta qué cambios hacer en el baño y en la ropa.",
 3:"Pasado el brote, en los meses siguientes tiene brotes frecuentes pese a emolientes y uso correcto de corticoide tópico.",
 4:"La madre cuenta que el prurito nocturno es lo que más los desvela.",
 5:"Una vecina le recomendó \"una inyección de corticoide para cortar el brote de una vez\"."});
X(32,"Miguel tiene 48 años, taxista. En tres consultas en distintos días tuvo TA de 158/96, 154/98 y 156/94 (promedio 156/96). Sin síntomas. Sin DBT, ERC ni ECV. Estudios de daño de órgano blanco normales (ECG, creatinina con FGe y relación albúmina/creatinina en orina). Colesterol total 210, HDL 42. No fuma. RCV 12 %.\n\nHábitos: come mucho pan y fiambre, agrega sal sin probar, toma 4 vasos de vino por día y es sedentario. IMC 29, cintura 102 cm.",
{2:"Indicás losartán 25 mg + amlodipina 2,5 mg en una toma diaria y cambios de hábitos. Miguel pregunta cuánta sal puede comer.",
 3:"Miguel dice que \"el vino es bueno para el corazón\" y que no piensa dejarlo.",
 4:"A la semana llama porque la TA \"todavía no bajó\" y quiere aumentar la dosis por su cuenta.",
 5:"Al mes toma la medicación todos los días, sin efectos adversos, y bajó 1 kg. TA 146/92."});
X(33,"Elena tiene 62 años, jubilada. HTA diagnosticada en varias tomas: 168/98, 166/100, 170/96. No tiene DBT, enfermedad renal ni coronaria. Creatinina normal, sin proteinuria, ECG normal. Toma ibuprofeno 400 mg algunos días por artrosis de rodilla. No fuma. Vive sola y es muy independiente.\n\nExamen: IMC 27, TA 168/98 en ambos brazos, FC 72, sin edemas, sin soplos.",
{2:"Indicás losartán + amlodipina y le pedís que deje el ibuprofeno.",
 3:"A las 3 semanas consulta por hinchazón en los tobillos desde que empezó las pastillas. TA 148/88.",
 4:"Pasás a losartán + hidroclorotiazida. Al mes la TA sigue en 146/90.",
 5:"Elena pregunta \"a cuánto tengo que llegar\" de presión."});
X(34,"Graciela tiene 56 años, cocinera en un comedor. En un control tuvo glucemias en ayunas de 148 y 156 mg/dl y HbA1c 7,8 %. No tiene poliuria, polidipsia ni pérdida de peso. Madre diabética. Sedentaria.\n\nExamen: IMC 32, cintura 104 cm, TA 128/80, pulsos periféricos presentes, sensibilidad conservada en pies.\n\nLaboratorio: creatinina 0,8 mg/dl, FGe > 90, albuminuria negativa, LDL 132 mg/dl, TG 190. Sin antecedentes cardiovasculares. Fondo de ojo normal.",
{2:"Graciela tuvo diarrea con metformina cuando se la indicaron a su hermana y tiene miedo.",
 3:"Graciela pregunta \"a qué número tiene que llegar\".",
 4:"Pasás a la prevención cardiovascular: no tiene ECV y tiene 56 años.",
 5:"A los 3 meses, con buena adherencia a metformina 1000 mg c/12 h y dieta, la HbA1c es 7,6 %. Imaginá que tuviera un IAM previo o ERC estadio 3."});
X(35,"Oscar tiene 63 años, pesa 80 kg. DBT2 de 12 años de evolución. Desde hace más de 6 meses toma metformina 1000 mg c/12 h y gliclazida 160 mg/día con buena adherencia. HbA1c 9,4 %, glucemia en ayunas 190 mg/dl. Sin cetosis, sin pérdida de peso brusca.\n\nAntecedentes: HTA con losartán, retinopatía leve. FGe 70. Vive con su esposa, que lo ayuda. Tiene glucómetro.\n\nOscar dice que \"la insulina es para los que se van a morir\".",
{2:"Después de conversar, Oscar acepta empezar con insulina basal.",
 3:"Oscar pregunta cómo sabe si la dosis está bien y cómo la cambia.",
 4:"Le indicaron glargina. Oscar quiere saber cuándo hace efecto y cuánto dura.",
 5:"Su esposa le aplicará la insulina y pregunta cómo hacerlo bien."});
X(36,"Pablo tiene 52 años, comerciante. Fuma 15 cigarrillos/día. HTA tratada con enalapril, TA 132/84. Sin DBT ni ECV conocida. Su padre tuvo un IAM a los 60 años.\n\nLaboratorio: colesterol total 236, LDL 160, HDL 38, TG 180 mg/dl, glucemia 96, creatinina normal, transaminasas normales. RCV a 10 años 22 %.\n\nPablo pregunta si debe tomar una aspirina por día \"para el corazón\", como su cuñado.",
{2:"Pablo vuelve a preguntar por la aspirina.",
 3:"Decidís una estatina de intensidad moderada.",
 4:"Le das pautas de alarma sobre la estatina.",
 5:"Su hija de 28 años, que busca embarazo, tiene hipercolesterolemia familiar y le recetaron estatina."});
X(37,"Mariana tiene 39 años, docente. Fuma 20 cigarrillos/día desde los 18. El primero lo fuma apenas se despierta. Intentó dejar dos veces \"a fuerza de voluntad\" y recayó en 2 semanas. Ahora quiere dejar porque su hija tiene asma; propone una fecha dentro de 10 días, el día del cumpleaños de la hija.\n\nAntecedentes: sin epilepsia, sin trastornos de la conducta alimentaria, sin enfermedad hepática. No está embarazada. Toma 4 cafés diarios.\n\nExamen: TA 118/76, FC 80, auscultación normal.",
{2:"Mariana elige parches de nicotina.",
 3:"Lo piensa mejor y prefiere una pastilla; leyó sobre bupropión.",
 4:"Al revisar los antecedentes, preguntás por convulsiones y otras contraindicaciones.",
 5:"Mariana pregunta qué hacer cuando le den \"unas ganas terribles\" de fumar."});
X(38,"Laura tiene 41 años, administrativa. IMC 34, cintura 98 cm. Tiene prediabetes (glucemia 112) e HTA con enalapril. Dice que probó \"todas las dietas\" y siempre recupera el peso. Trabaja 10 h sentada, come en el escritorio, toma gaseosa. Duerme 6 h. No tiene síntomas depresivos ni atracones.\n\nExamen: TA 134/86, acantosis en cuello. Pide \"alguna pastilla o inyección\" para bajar de peso.",
{2:"Laura pregunta qué dieta tiene que hacer.",
 3:"Pregunta cuánto ejercicio necesita: \"no tengo tiempo\".",
 4:"Vuelve a preguntar por medicación.",
 5:"Su hermana tiene IMC 42 y ya hizo varios tratamientos sin éxito."});
X(39,"Roberto tiene 58 años, encargado de un depósito. Mientras cargaba bolsas presentó dolor opresivo retroesternal irradiado al brazo izquierdo y mandíbula, con sudoración fría y náuseas. Llega caminando al centro de salud a los 40 min del inicio; el dolor persiste. Fumador de 30 paquetes/año, HTA mal controlada. Sin alergias, sin úlcera ni sangrado digestivo. No tomó sildenafil.\n\nExamen: pálido, sudoroso, TA 140/90, FC 88, SatO2 96 %, auscultación normal, sin signos de IC.\n\nECG de 12 derivaciones: ver trazado.",
{2:"Mientras llega la ambulancia, la enfermera pregunta si le pone oxígeno.",
 3:"El dolor persiste. Pensás en darle nitroglicerina sublingual.",
 4:"Llamás al hospital de referencia, que tiene hemodinamia a 40 minutos.",
 5:"En el hospital le colocan un stent. Al alta le indican AAS y clopidogrel."});
X(40,"Ernesto tiene 74 años, jubilado. Desde hace 2 meses tiene disnea al caminar 1 cuadra, ortopnea de 2 almohadas y edemas en tobillos. Tuvo un IAM hace 5 años. Toma diclofenac 75 mg/día por dolor de rodilla y verapamilo 80 mg c/8 h \"para el corazón\" indicado hace años. No fuma.\n\nExamen: TA 128/76, FC 92 regular, SatO2 94 %, ingurgitación yugular, crepitantes bibasales, edemas maleolares ++. Peso 82 kg (pesaba 78).\n\nEcocardiograma: FEy 30 %, hipocinesia anterior. Creatinina 1,1, K 4,4.",
{2:"Suspendiste los fármacos que empeoran la IC. Hay sobrecarga de volumen.",
 3:"A la semana bajó 3 kg, sin edemas ni crepitantes. Es momento de iniciar el bloqueo neurohormonal.",
 4:"Ernesto pregunta si también necesita \"la pastilla para el pulso\" que toma su vecino.",
 5:"Ya con IECA y BB titulados, sigue en CF II."});
X(41,"Ana tiene 30 años. A los 25 le colocaron una prótesis valvular mitral mecánica por valvulopatía reumática; está anticoagulada con acenocumarol, RIN en rango. Consulta porque el odontólogo le va a extraer una muela con caries profunda la semana próxima. No tiene alergias.\n\nExamen: TA 112/70, FC 76 regular, clic protésico normal, sin soplos nuevos. Afebril.",
{2:"Confirmás que tiene indicación de profilaxis.",
 3:"Ana pregunta si su sobrina de 6 años, a quien le auscultaron \"un soplito\" en un control, necesita algo parecido. El pediatra lo consideró inocente.",
 4:"Su hermano de 19 años juega al fútbol y tiene un soplo sistólico; su padre murió súbitamente a los 40.",
 5:"Su madre tiene estenosis mitral severa y se le diagnosticó FA."});
X(42,"Ian tiene 2 años; hace 3 días pesaba 11 kg. Desde hace 2 días tiene diarrea acuosa, 6-7 deposiciones por día, sin sangre ni moco, y hoy vomitó 2 veces. Afebril. Orinó poco desde la mañana. Va al jardín, donde hay otros chicos con diarrea. Recibe leche y comida familiar.\n\nExamen: peso 10,5 kg, irritable, sediento (bebe con avidez), ojos hundidos, mucosas secas, llanto con pocas lágrimas, signo del pliegue que se recupera lentamente, relleno capilar 2 s, pulsos normales, FC 130. Sin letargo. Abdomen blando, no distendido.",
{2:"Lo dejás en observación en el centro de salud con SRO.",
 3:"Al dar la primera toma vomita todo.",
 4:"La madre pregunta por un antidiarreico \"que corte la diarrea\" y unos probióticos que le recomendaron.",
 5:"A las 4 h: tranquilo, orinó, mucosas húmedas, pliegue normal. Pesa 10,9 kg."});
X(43,"Gustavo tiene 40 años, cocinero. Desde hace 2 días tiene diarrea con sangre y moco, unas 10 deposiciones por día, cólicos y pujos. Fiebre de 38,8 °C. Comió pollo en un evento; otros invitados tienen síntomas parecidos. No viajó. No es inmunocomprometido.\n\nExamen: T 38,8 °C, FC 100, TA 120/78, sin ortostatismo, mucosas algo secas. Abdomen doloroso difuso, sin defensa. Tolera líquidos.",
{2:"Decidís indicar antibiótico.",
 3:"Gustavo quiere \"algo para cortar la diarrea\" porque tiene que trabajar.",
 4:"Le indicás hidratación oral.",
 5:"Le explicás cuándo debe volver."});
X(44,"Claudia tiene 45 años, docente. Desde hace 3 meses tiene dolor epigástrico urente que mejora con las comidas y la despierta de noche. Toma ibuprofeno 2-3 veces por semana por cefaleas. Sin pérdida de peso, vómitos, disfagia, melena ni anemia. Sin alergias. El año pasado recibió claritromicina por una sinusitis.\n\nExamen: dolor leve a la palpación epigástrica, sin masas. Hb 13 g/dl.\n\nVEDA: úlcera duodenal de 8 mm en cara anterior del bulbo, sin sangrado. Test de ureasa positivo para H. pylori.",
{2:"Indicás tratamiento erradicador.",
 3:"A las 6 semanas del tratamiento, el test de aire espirado sigue positivo.",
 4:"Claudia pregunta cómo tomar las pastillas: \"¿todo junto en ayunas?\".",
 5:"Termina el tratamiento y se siente bien."});
X(45,"Lorena tiene 28 años, analista de sistemas. Desde hace 1 año tiene dolor abdominal cólico en hemiabdomen inferior que alivia al defecar, distensión que empeora a la tarde y deposiciones blandas 3-4 veces por día, alternando con días normales. Empeora con el estrés laboral. Sin sangre, fiebre, pérdida de peso, síntomas nocturnos ni antecedentes familiares de cáncer de colon o EII.\n\nExamen normal. Laboratorio: hemograma, PCR, TSH y anti-transglutaminasa normales. Parasitológico negativo.",
{2:"La distensión es lo que más le molesta.",
 3:"Lorena tiene reuniones largas y le preocupa tener urgencia para ir al baño.",
 4:"El dolor cólico interfiere con su trabajo.",
 5:"Pese a todo, a los meses tiene síntomas severos con predominio diarreico y gran ansiedad."});
X(46,"Valentín tiene 6 años. Desde hace 2 semanas tiene picazón anal de noche, duerme mal, está irritable y se rasca. La madre vio \"gusanitos blancos, finitos, como hilos\" en la ropa interior a la mañana. Su hermana de 3 años también se rasca. Va a primer grado.\n\nExamen: buen estado, excoriaciones perianales leves, sin vulvovaginitis ni otras lesiones. Peso y talla normales.",
{2:"Confirmás el diagnóstico clínico.",
 3:"La madre pregunta si también tienen que tomar el remedio ella y el padre.",
 4:"La madre cuenta que está embarazada de 10 semanas.",
 5:"Meses después, su hermana tiene diarrea crónica, distensión y heces fétidas; el parasitológico muestra Giardia."});
X(47,"Beatriz tiene 70 años, jubilada. Constipación desde hace años: 2 deposiciones duras por semana con esfuerzo. Toma sen en té todas las noches \"desde siempre\". Come poca verdura y toma poca agua. Además, desde hace 2 meses tiene dolor anal intenso al defecar que dura un rato y sangre roja rutilante en el papel.\n\nExamen: abdomen blando, sin masas. Inspección anal: fisura en la línea media posterior con bordes indurados y papila centinela. Sin hemorroides trombosadas. Colonoscopia reciente normal. Hb 13 g/dl.",
{2:"Indicás un laxante de volumen.",
 3:"Beatriz pregunta si hay algún \"truco\" para ir al baño.",
 4:"Pasás a tratar la fisura, que ya es crónica.",
 5:"Beatriz pregunta qué efectos puede tener la pomada."});
X(48,"Micaela tiene 25 años. Desde hace 1 año tiene diarrea intermitente, distensión, cansancio y aftas bucales. Hb 10,2 g/dl, VCM 74, ferritina baja. La anti-transglutaminasa IgA es positiva con IgA total normal. Su madre tiene hipotiroidismo.\n\nExamen: IMC 19, palidez, sin otros hallazgos. Leyó en internet que debe dejar el gluten \"ya mismo\" y ya compró harinas sin TACC.",
{2:"La biopsia confirma la enfermedad celíaca.",
 3:"Micaela pregunta cómo van a saber si la dieta funciona.",
 4:"Hay que tratar la ferropenia.",
 5:"Su hermana de 20 años, asintomática, pregunta si tiene que estudiarse."});
X(49,"Romina tiene 29 años, empleada de comercio. Desde hace 2 días tiene ardor al orinar, va al baño cada media hora con poca orina y sensación de urgencia. Sin fiebre, escalofríos, dolor lumbar, náuseas ni flujo. Primer episodio en su vida. No está embarazada (FUM hace 10 días, usa ACO). Sin diabetes ni inmunocompromiso. Sin alergias.\n\nExamen: T 36,6 °C, dolor suprapúbico leve, puñopercusión negativa. Tira reactiva: leucocitos y nitritos positivos.",
{2:"Romina pide \"el antibiótico de 3 días\" que le dieron a una amiga.",
 3:"Romina cuenta que el TMS le dio ronchas en el pasado.",
 4:"Un compañero de rotación dice que \"toda ITU es complicada si la paciente tiene vida sexual activa\".",
 5:"Le das las pautas de alarma."});
// Historias ampliadas y evolución progresiva (casos 50-73)
X(50,"Mirta tiene 55 años, peluquera. Desde ayer tiene fiebre de 38,9 °C con escalofríos, dolor lumbar derecho, náuseas sin vómitos, y desde hace 3 días disuria y polaquiuria. Antecedentes: HTA con amlodipina. No recibió quinolonas en el último año. Hace 2 años tuvo una cistitis por E. coli sensible a todo. Sin alergias.\n\nExamen: lúcida, T 38,9 °C, TA 120/75, FC 98, FR 18, SatO2 97 %. Puñopercusión derecha positiva. Sin signos de deshidratación. Tolera la vía oral.\n\nLaboratorio: leucocitos 14.000, creatinina 0,9, lactato normal. Orina: piuria y nitritos positivos. Se envía urocultivo.",
{2:"El residente propone nitrofurantoína \"porque la orina es su especialidad\".",
 3:"Decidís tratamiento ambulatorio por vía oral.",
 4:"El urocultivo informa E. coli resistente a ciprofloxacina y sensible a TMS. Rotás a TMS, con buena evolución.",
 5:"Su vecina, con el mismo cuadro, quedó internada con ceftriaxona IV. Al 3er día está afebril, come y tolera la VO."});
X(51,"Catalina tiene 2 años y pesa 12 kg. Desde hace 2 días tiene fiebre de 39 °C sin otro foco, irritabilidad e hiporexia. Vomitó una vez ayer; hoy toma líquidos sin problemas. Sin antecedentes de ITU. Controla esfínteres de día. Vacunas completas. Familia confiable con teléfono.\n\nExamen: T 38,8 °C, FC 130, buen estado general, hidratada, relleno capilar normal. Sin foco ORL ni respiratorio. Abdomen blando, sin dolor a la palpación profunda.\n\nOrina por sonda: sedimento con piuria y bacterias; urocultivo en curso.",
{2:"Decidís tratamiento ambulatorio por vía oral.",
 3:"Por fiebre alta y compromiso sistémico lo considerás una ITU alta.",
 4:"Te llaman a las 48 h para contarte cómo sigue.",
 5:"A los 6 meses, Catalina tuvo 3 ITU febriles y la cistografía muestra RVU grado II."});
X(52,"Facundo tiene 24 años, repartidor. Desde hace 3 días tiene secreción purulenta por la uretra, abundante, amarillenta, y ardor al orinar. En el último mes tuvo relaciones sin preservativo con 2 parejas. Sin úlceras genitales, dolor testicular ni fiebre. Sin alergias. Nunca se hizo un test de VIH.\n\nExamen: secreción uretral purulenta espontánea, sin lesiones en pene, sin adenopatías inguinales, testículos y epidídimos indoloros.",
{2:"Facundo dice que \"seguro se olvida\" de tomar pastillas una semana.",
 3:"Facundo pregunta qué hace con las chicas con las que estuvo.",
 4:"Aprovechás la consulta para el resto de los estudios.",
 5:"El laboratorio confirma Neisseria gonorrhoeae."});
X(53,"Juan tiene 66 años, jubilado. Desde hace 1 año tiene chorro débil, tarda en empezar a orinar, goteo al terminar, sensación de no vaciar del todo y se levanta 3 veces de noche. Le molesta sobre todo no dormir bien. Toma 2 litros de mate por la tarde y una cerveza a la noche. Hipertenso con enalapril, TA bien controlada.\n\nExamen: globo vesical no palpable. Tacto rectal: próstata aumentada (~45 cc), lisa, elástica, con surco conservado, sin nódulos. PSA acorde a su edad, orina normal, creatinina normal. Residuo posmiccional 60 ml.",
{2:"Le indicás tamsulosina. Juan pregunta qué efectos puede notar.",
 3:"Juan pregunta si hay algo que \"achique la próstata\".",
 4:"Al año sigue muy sintomático; la próstata es grande.",
 5:"Juan pregunta qué puede cambiar en sus hábitos."});
X(54,"Benicio tiene 14 meses y pesa 10 kg. Sus padres consultan porque \"está pálido\". Desde el año toma leche de vaca entera, cerca de 1 litro por día en mamadera, y come poco: \"no le gusta la carne\". Nació a término, LME hasta los 4 meses. No recibió suplemento de hierro. Sin sangrados visibles ni diarrea crónica.\n\nExamen: palidez cutáneo-mucosa, FC 120, soplo sistólico funcional 1/6, sin hepatoesplenomegalia ni adenopatías. Desarrollo normal.\n\nLaboratorio: Hb 9 g/dl, VCM 66, ferritina 5 ng/ml, plaquetas y leucocitos normales.",
{2:"Indicás hierro. La madre pregunta si hay que cambiar algo más.",
 3:"Pide un laboratorio de control: \"¿cómo sabemos si el hierro funciona?\".",
 4:"Al mes, la Hb subió a 10,4 g/dl.",
 5:"La Hb se normalizó a los 3 meses de tratamiento."});
X(55,"Antonio tiene 70 años, con cáncer de próstata y metástasis óseas en columna lumbar y pelvis. En cuidados paliativos domiciliarios. Desde hace 2 semanas tiene dolor lumbar 8/10, continuo, que lo despierta. Toma paracetamol 1 g c/8 h e ibuprofeno 400 mg c/8 h sin alivio. Ya está constipado: 1 deposición cada 4 días. Función renal y hepática normales. Vive con su esposa y su hija, que lo cuidan.",
{2:"Decidís iniciar un opioide fuerte por vía oral.",
 3:"La hija pregunta qué más tiene que tener en cuenta al darle morfina.",
 4:"A los 2 días de iniciar morfina tiene náuseas; la familia quiere suspenderla.",
 5:"Con el dolor controlado, aparece un dolor quemante con hormigueo en la pierna derecha."});
X(56,"Gabriela tiene 34 años, profesora de yoga, vegana desde hace 6 años; no toma suplementos. Consulta por cansancio de meses, falta de aire al subir escaleras, hormigueos en manos y pies, y la lengua \"lisa y ardida\". No toma alcohol.\n\nExamen: palidez, glositis, disminución de la sensibilidad vibratoria en pies. Sin hepatoesplenomegalia.\n\nLaboratorio: Hb 10,5 g/dl, VCM 112 fl, plaquetas 140.000, vitamina B12 baja, folato normal, ferritina normal. TSH normal.",
{2:"Indicás tratamiento.",
 3:"Una amiga le dijo que \"con ácido fólico se arregla\".",
 4:"Gabriela no quiere dejar de ser vegana y pregunta qué alimentos aportan B12.",
 5:"Gabriela pregunta si va a necesitar una transfusión."});
X(57,"Sergio tiene 42 años, albañil. Hace 3 días, al levantar una bolsa de cemento con la espalda flexionada, sintió un dolor lumbar intenso que no irradia. Le duele al moverse y al agacharse. Sin fiebre, pérdida de peso, antecedentes oncológicos ni trauma mayor. Sin trastornos esfinterianos ni hormigueos.\n\nExamen: contractura paravertebral lumbar bilateral, Lasègue negativo, fuerza, reflejos y sensibilidad conservados en miembros inferiores.\n\nPide reposo en cama \"hasta que se le pase\" y una inyección.",
{2:"Acordás el plan analgésico.",
 3:"Le explicás cuándo debe consultar de urgencia.",
 4:"Sergio pregunta cuándo vuelve al control.",
 5:"Sergio pregunta si le corresponde licencia, porque se lastimó trabajando."});
X(58,"Ramón tiene 55 años, carnicero. Se despertó a la madrugada con dolor muy intenso en el dedo gordo del pie derecho, que no tolera ni la sábana. La noche anterior comió asado con achuras y tomó vino. Es su segundo ataque en 2 años; el primero cedió solo en una semana. Toma AAS 100 mg que se automedicó \"para el corazón\" e hidroclorotiazida por HTA. Sin úlcera péptica.\n\nExamen: T 37,6 °C. 1ª metatarsofalángica derecha tumefacta, roja, caliente, muy dolorosa. Sin tofos. IMC 31.\n\nLaboratorio: ácido úrico 8,9 mg/dl, creatinina 0,9.",
{2:"Elegís colchicina para el ataque.",
 3:"Revisás su medicación habitual.",
 4:"Ramón pregunta si tiene que tomar \"la pastilla del ácido úrico\" de por vida.",
 5:"Años después tiene ataques frecuentes e incapacitantes y aparecen tofos en el codo."});
X(59,"Teresa tiene 70 años, viuda, vive en un 2° piso por escalera. Desde hace años tiene dolor en ambas rodillas, peor la derecha, que empeora al subir escaleras y al final del día, con rigidez matinal de 15 minutos. Camina cada vez menos por el dolor y subió de peso. Toma ibuprofeno por su cuenta.\n\nExamen: IMC 31, crepitación y deformidad en varo de ambas rodillas, sin derrame, calor ni eritema. Marcha antiálgica.\n\nRx: disminución del espacio articular, osteofitos y esclerosis subcondral en ambas rodillas.",
{2:"Teresa pregunta si le sirve el bastón de su marido.",
 3:"Pese a las medidas no farmacológicas, sigue con dolor.",
 4:"Usa ojotas en casa y zapatos de taco bajo para salir.",
 5:"Le explicás cuándo tendría que verla el traumatólogo."});
X(60,"Patricia tiene 50 años, ama de casa. Hace 3 semanas pintó el techo de la cocina y desde entonces tiene dolor en el hombro derecho al levantar el brazo y al dormir sobre ese lado. Sin trauma. Diestra. Sin DBT.\n\nExamen: arco doloroso entre 60° y 120° de abducción, dolor con la maniobra de Jobe sin pérdida de fuerza, movilidad pasiva completa. Sin atrofia. Columna cervical normal.",
{2:"Patricia quiere \"tener el brazo quieto\" hasta que pase.",
 3:"Pregunta si se pone frío o calor.",
 4:"A las 6 semanas el dolor persiste y se decide una infiltración.",
 5:"Su hermana de 45 años tiene hormigueo nocturno en pulgar, índice y mayor, con Phalen positivo, sin atrofia."});
X(61,"Liliana tiene 45 años, costurera. Desde hace 4 meses tiene dolor e hinchazón en articulaciones de ambas manos (MCF e IFP) y muñecas, con rigidez matinal de 2 h. Le cuesta coser. Sin fiebre ni lesiones cutáneas.\n\nExamen: sinovitis simétrica en 2ª-3ª MCF, IFP y muñecas. Sin nódulos.\n\nLaboratorio: VSG 48, PCR elevada, FR y anti-CCP positivos. Hemograma, hepatograma y función renal normales. Rx: erosiones incipientes en 2ª MCF. Serologías para hepatitis negativas.",
{2:"Indicás metotrexato. La farmacia le entrega comprimidos de 2,5 mg.",
 3:"Mientras hace efecto el DMAR, tiene mucho dolor y rigidez.",
 4:"A los 5 meses, con metotrexato a dosis máxima combinado, sigue con artritis activa.",
 5:"Lleva meses con prednisona."});
X(62,"Carolina tiene 30 años, abogada. Desde los 18 tiene cefalea hemicraneana pulsátil, con náuseas, fotofobia y fonofobia, que dura de 6 a 24 h y empeora con la actividad. Ahora tiene 5-6 crisis por mes y faltó 4 días al trabajo el último mes. Toma ibuprofeno casi a diario \"para prevenir\". No fuma. Usa preservativo; no planea embarazo. No tiene asma.\n\nExamen neurológico y fondo de ojo normales. TA 116/74. Sin signos de alarma: inicio a los 18, sin cambios en el patrón, sin déficit focal.",
{2:"Acuerdan iniciar un preventivo.",
 3:"Le preguntás cuántos días por mes toma analgésicos: \"casi todos\".",
 4:"Algunas crisis son muy intensas y no ceden con AINE.",
 5:"Su padre, de 62 años, con HTA mal controlada y una angina, pide que le receten el mismo triptán."});
X(63,"Olga tiene 65 años. Desde hace 1 semana tiene vértigo rotatorio intenso que dura menos de 1 minuto, al acostarse, al darse vuelta en la cama y al mirar hacia arriba para colgar la ropa. Náuseas sin vómitos. Sin hipoacusia, acúfenos, cefalea ni síntomas neurológicos. HTA con losartán, DBT con metformina, hipotiroidismo y artrosis: toma 7 medicamentos.\n\nExamen: neurológico normal, marcha normal. Dix-Hallpike a derecha: nistagmo torsional con latencia de pocos segundos, que dura 20 segundos y se agota.",
{2:"Confirmás el diagnóstico.",
 3:"Olga pide \"una pastilla para el mareo\" que la cure.",
 4:"Le tienen miedo a la maniobra porque la última vez vomitó.",
 5:"Igual quiere algo para los síntomas mientras tanto, pero ya toma muchos remedios."});
X(64,"Hugo tiene 72 años, jubilado ferroviario. Desde hace 1 año tiene temblor en la mano derecha en reposo, que desaparece al agarrar algo, y lentitud: tarda en vestirse y \"arrastra los pies\". Su letra se volvió pequeña. Diagnóstico de enfermedad de Parkinson por neurología.\n\nExamen: temblor de reposo derecho, bradicinesia, rigidez en rueda dentada, hipomimia, marcha a pasos cortos sin caídas. Cognición conservada.\n\nAhora le cuesta abotonarse la camisa y cortar la comida.",
{2:"Los síntomas afectan su funcionalidad.",
 3:"Neurología indica carbidopa/levodopa.",
 4:"Su esposa pregunta qué pueden hacer además de los remedios.",
 5:"Al iniciar el tratamiento tiene náuseas; un médico de guardia le indicó metoclopramida."});
X(65,"Natalia tiene 40 años, pesa 65 kg. Desde hace 6 meses tiene cansancio, frío, constipación, piel seca y aumentó 4 kg. Menstruaciones más abundantes. Toma sulfato ferroso por anemia y omeprazol por gastritis, ambos en ayunas. Sin cardiopatía. Planea un embarazo en el próximo año.\n\nExamen: FC 60, piel seca, reflejos con relajación lenta, tiroides levemente aumentada, indolora.\n\nLaboratorio: TSH 18 mUI/l, T4L baja, anti-TPO positivos.",
{2:"Hay que definir la dosis inicial.",
 3:"Natalia quiere saber cuándo repetir el análisis.",
 4:"Al año, ya compensada con 100 µg, queda embarazada.",
 5:"Su madre, de 70 años, asintomática, tiene TSH 7 con T4L normal."});
X(66,"Celeste tiene 33 años, enfermera. Desde hace 3 meses tiene palpitaciones, temblor en las manos, calor, sudoración, pérdida de 5 kg pese a comer más, ansiedad y diarrea. Usa preservativo; no está embarazada.\n\nExamen: FC 112, TA 130/70, temblor fino, piel caliente y húmeda, bocio difuso con soplo, leve retracción palpebral sin proptosis.\n\nLaboratorio: TSH suprimida, T4L elevada, TRAb positivos. Hemograma y hepatograma basales normales.",
{2:"Las palpitaciones y el temblor le impiden trabajar.",
 3:"Le das pautas de alarma: fiebre, dolor de garganta o úlceras en la boca.",
 4:"Celeste pregunta cuándo repite los análisis tiroideos.",
 5:"Una compañera con Graves tiene compromiso ocular severo con proptosis y visión doble."});
X(67,"Verónica tiene 45 años, empleada administrativa, separada hace 1 año, 2 hijos adolescentes. Desde hace 2 meses está triste casi todo el día, perdió interés en todo (dejó el coro), duerme mal con despertar a las 4 h, comió menos y bajó 3 kg, se siente culpable \"por la separación\" y le cuesta concentrarse. Sigue trabajando con mucho esfuerzo.\n\nNiega ideación suicida, planes o intentos. Sin síntomas psicóticos ni episodios de euforia o gasto excesivo. No consume alcohol ni sustancias. Primer episodio. PHQ-9: 16 (moderado). TSH y hemograma normales.",
{2:"Acuerdan iniciar un antidepresivo, además de la psicoterapia.",
 3:"El insomnio la tiene agotada y pide \"algo para dormir ya\".",
 4:"A los 3 meses está mucho mejor y quiere dejar las pastillas.",
 5:"Imaginá que a las 8 semanas, con dosis adecuada, no hubiera respondido."});
X(68,"Matías tiene 27 años, programador. Llega a la guardia del CAPS con palpitaciones, sensación de ahogo, opresión torácica, hormigueos en manos y boca y miedo intenso a morirse, de 15 minutos de evolución. Es su cuarta crisis en 2 meses; vive con miedo a la próxima y dejó de viajar en colectivo y de ir al gimnasio. No consume drogas; toma 3 energizantes por día.\n\nExamen: FC 118, FR 26, SatO2 99 %, TA 130/80, sin otros hallazgos. ECG: taquicardia sinusal. Glucemia normal.",
{2:"La crisis cede. Matías pregunta qué tratamiento necesita a largo plazo.",
 3:"Acepta iniciar un antidepresivo.",
 4:"Matías pregunta si puede seguir con el clonazepam que le diste \"para siempre\".",
 5:"Le das un certificado y lo citás."});
X(69,"Susana tiene 60 años, jubilada hace 6 meses. Desde entonces le cuesta dormirse: tarda más de 1 hora, a veces 2. Se acuesta a horarios variables, mira el celular en la cama, toma mate hasta las 19 h y duerme 2 h de siesta. No ronca ni tiene apneas presenciadas. Sin tristeza ni anhedonia (PHQ-2 negativo). Pide \"una pastilla para dormir\" como la de su hermana.",
{2:"Le explicás la higiene del sueño.",
 3:"Dos semanas después, con buena higiene del sueño, sigue con dificultad para dormirse y acuerdan un hipnótico por poco tiempo.",
 4:"Susana pregunta si puede tomar valeriana \"que es natural\".",
 5:"Antes de entregarle la receta, le das las advertencias."});
X(70,"Kevin tiene 20 años, estudiante. Es febrero y hay brote de dengue en el barrio. Desde hace 3 días tiene fiebre de 39 °C, cefalea retroocular, dolor muscular y articular intenso y un exantema leve en el tronco. Tomó ibuprofeno por su cuenta. Sin dolor abdominal, vómitos, sangrados ni somnolencia.\n\nExamen: T 38,8 °C, TA 118/72 sin ortostatismo, FC 92, hidratado, prueba del lazo negativa, sin hepatomegalia ni derrames.\n\nLaboratorio: Hto 42 %, plaquetas 140.000, leucopenia leve. Vive con sus padres, accesible para control diario.",
{2:"Kevin pregunta cuánto líquido tiene que tomar.",
 3:"Al 4° día deja de tener fiebre y dice que ya se siente bien y quiere volver a la facultad.",
 4:"Le explicás qué síntomas lo harían volver de inmediato.",
 5:"Su madre pregunta qué pueden hacer en la casa."});
X(71,"Walter tiene 38 años. Durante 10 días trabajó limpiando casas después de una inundación, muchas veces descalzo o en ojotas, con heridas en los pies. Desde hace 3 días tiene fiebre de 39 °C, cefalea intensa, dolor muy fuerte en las pantorrillas y ojos rojos. Sin ictericia, oliguria, disnea ni sangrados. No es alérgico.\n\nExamen: T 38,9 °C, TA 120/80, sufusión conjuntival bilateral, dolor a la palpación de gemelos. Sin ictericia. Auscultación normal.\n\nLaboratorio: creatinina 0,9, bilirrubina normal, plaquetas 160.000. Serología para leptospira pendiente.",
{2:"Lo manejás en forma ambulatoria.",
 3:"Le explicás el seguimiento.",
 4:"Imaginá que hubiera tenido oliguria, ictericia leve y requiriera internación.",
 5:"Sus compañeros siguen trabajando en la limpieza de zonas anegadas."});
X(72,"Luciana tiene 12 años. Hace 2 horas la mordió en la mano derecha un perro de la calle que se escapó y no se pudo identificar. Tiene dos heridas punzantes en el dorso de la mano y una pequeña laceración. Sangró poco. Vacunas al día según calendario (dT a los 11 años). Sin alergias.\n\nExamen: dos heridas punzantes de 4 mm y una laceración de 1 cm en dorso de mano derecha, sin compromiso tendinoso ni articular aparente, movilidad y sensibilidad conservadas.",
{2:"La herida ya está lavada.",
 3:"Decidís indicar antibiótico.",
 4:"Llamás a Zoonosis: el perro no aparece.",
 5:"La madre pregunta cuántas vacunas son y cuándo."});
X(73,"La familia Pereyra está evacuada en un centro comunitario desde hace 4 días, tras la inundación de su barrio. Hay agua potable en bidones y baños químicos. Ana tiene 8 años y pesa 26 kg. Desde ayer tiene diarrea acuosa, 4 deposiciones, sin sangre ni moco, sin fiebre ni vómitos. Come y toma bien.\n\nExamen: alerta, mucosas húmedas, sin sed aumentada, pliegue normal, relleno capilar < 2 s. Abdomen blando.",
{2:"La madre pide \"un antibiótico para que no se contagien todos\".",
 3:"Dos días después, un primo de 6 años tiene diarrea con sangre y fiebre.",
 4:"Un voluntario reparte loperamida y bismuto entre los evacuados.",
 5:"Se notifican varios casos de diarrea acuosa profusa \"como agua de arroz\" en el centro y se sospecha cólera."});

C(0,"Lucas, 7 años",
"Lucas tiene 7 años y lo trae su madre porque \"se sigue haciendo pis en la cama\" casi todas las noches; nunca tuvo un período seco prolongado. De día controla bien, sin urgencia ni escapes. Deposiciones diarias, normales. El padre mojó la cama hasta los 9 años. La madre está cansada y a veces lo reta y lo deja sin tablet como castigo.\n\nToma jugo y agua después de la cena y mira la tele en la cama hasta dormirse. El baño está al fondo del pasillo, sin luz.\n\nExamen: peso y talla normales, TA normal, abdomen sin masas ni globo vesical, columna lumbosacra sin fositas ni mechones, examen neurológico de miembros inferiores normal. Orina completa normal.",
[
Q("T","¿Qué le explicás a la madre sobre la enuresis?","Que suele ser parte de una etapa evolutiva que mejora con el tiempo, y que hay que evitar los castigos","Que es un trastorno psiquiátrico que requiere medicación","Que es culpa de Lucas por no esforzarse","Que siempre indica una malformación urinaria","Explicar que suele ser parte de una etapa evolutiva y mejora con el tiempo; evitar castigos."),
Q("P","¿Qué medidas indicás?","No tomar líquidos antes de acostarse, vaciar la vejiga antes de dormir y facilitar el acceso al baño (luz)","Pañal hasta los 12 años","Despertarlo cada hora","Restringir el agua todo el día","Enseñar a reconocer y controlar la micción; no tomar líquidos antes de acostarse; vaciar la vejiga antes de dormir; facilitar el acceso al baño.","La madre pregunta qué cambios concretos puede hacer en la rutina de la noche."),
Q("T","¿Qué tipo de enuresis presenta?","Primaria: nunca tuvo un período seco prolongado","Secundaria","Diurna","No es enuresis a esta edad","Primaria: nunca logró continencia nocturna sostenida. Secundaria: reaparece tras un período seco.","Revisás la historia: nunca estuvo seco más de unas semanas."),
Q("P","Si apareciera enuresis después de un año seco, ¿qué estudiás?","Examen neurológico y abdominal, orina completa y urocultivo","Nada, es igual","Resonancia de cerebro","Cistoscopia","Secundaria: examen neurológico y abdominal, orina completa y urocultivo.","Su primo de 8 años, que estuvo seco un año, volvió a mojar la cama desde hace 1 mes."),
Q("T","¿Qué actitud familiar refuerza el tratamiento?","Acompañar sin castigos y reforzar los logros","Contarle a los compañeros para que le dé vergüenza","Castigarlo cada vez que moja","Ignorar el tema por completo","El cuadernillo indica evitar castigos; la enuresis mejora con el tiempo.","La madre reconoce que lo reta y lo deja sin tablet.")
]);

C(0,"Bruno, 6 años",
"Bruno tiene 6 años. La maestra mandó a llamar a la madre porque \"se hace caca encima\" en la escuela varias veces por semana y los compañeros se burlan. La madre cuenta que desde los 4 años evacúa cada 4-5 días, heces muy grandes y duras que \"tapan el inodoro\", con dolor; él se esconde para aguantarse. Come poca verdura y fruta, toma gaseosa. Últimamente está retraído.\n\nExamen: peso y talla normales. Abdomen con masa fecal palpable en hipogastrio y fosa ilíaca izquierda. Inspección perianal: fisura superficial y restos de materia fecal. Región lumbosacra normal. Examen neurológico de miembros inferiores normal.",
[
Q("T","¿Qué mecanismo explica la incontinencia fecal de Bruno?","Retención fecal crónica con escurrimiento alrededor del fecaloma","Un trastorno neurológico medular","Una diarrea infecciosa","Falta de interés en ir al baño","Constipación crónica con impactación y escurrimiento: por eso el manejo incluye desimpactación y hábito defecatorio. (Fisiopatología general.)"),
Q("P","¿Cuál es el primer paso del tratamiento?","Desimpactación y luego hábito defecatorio diario para evitar la reacumulación","Sólo terapia psicológica","Pañal","Dieta astringente","Información, hábitos regulares, desimpactación, tratar lesiones perianales y hábito defecatorio diario.","Le explicás a la madre por qué se \"escapa\" la materia fecal."),
Q("P","¿Qué medidas dietéticas y de hábito indicás?","Más fibra, frutas, verduras y líquidos, y unos 10 min diarios en el inodoro tras una comida","Restringir líquidos","Más lácteos y arroz","Evitar ir al baño en la escuela","Fibra y fluidos; no postergar la evacuación; ~10 min diarios en el inodoro tras una comida.","Al mes tiene menos episodios. La madre pregunta qué más hacer en casa."),
Q("P","Si las medidas no alcanzan, ¿qué laxante es de preferencia en niños?","Laxante osmótico o de volumen (lactulosa 1-2 ml/kg/día o psyllium)","Bisacodilo diario","Sen","Enemas diarios por meses","Fármacos sólo si fracasan las medidas; preferir volumen; lactulosa 1-2 ml/kg/día; evitar estimulantes.","Persiste la tendencia a heces duras pese a la dieta."),
Q("T","¿Qué otro abordaje incluye el cuadernillo?","Terapia conductual y tratamiento de lesiones perianales","Cirugía","Antibióticos","Ninguno","Terapia conductual; tratar lesiones perianales; aumentar la fibra.","Bruno está avergonzado y no quiere volver a la escuela.")
]);

C(0,"Sol, 4 años",
"Sol tiene 4 años. Sus padres consultan porque ronca todas las noches, duerme con la boca abierta y a veces \"parece que deja de respirar unos segundos\" y se despierta sobresaltada. De día está cansada y se duerme en el jardín. Respira por la boca y habla \"gangosa\". Tuvo 3 otitis en el año y una otitis con líquido que no se va, con hipoacusia en el control audiométrico.\n\nExamen: facies adenoidea, respiración bucal, amígdalas grado 2, sin fiebre. Otoscopia: otitis media con efusión bilateral. Peso y talla normales.",
[
Q("T","¿Qué conducta se sigue en la hipertrofia adenoidea sin complicaciones?","Conservadora: suele mejorar a partir de los 5-6 años","Cirugía siempre","Antibióticos prolongados","Corticoides orales","Sin complicaciones serias → conducta conservadora (mejora a partir de los 5-6 años)."),
Q("P","Con los datos de Sol, ¿qué corresponde?","Interconsulta con ORL: tiene apneas y otitis media con derrame con hipoacusia","Esperar a los 6 años","Sólo descongestivos","Nada","Interconsulta ORL si apnea, OMC con derrame e hipoacusia bilateral, cor pulmonale, trastornos del habla, etc.","Los padres filmaron a Sol durmiendo: hay pausas respiratorias de varios segundos."),
Q("T","¿Cuál de estos también es motivo de interconsulta ORL?","Trastornos del habla o de la deglución y maloclusión","Ronquido aislado con un resfrío","Una otitis por año","Rinorrea en invierno","Interconsulta: apnea, cor pulmonale, obstrucción alta, sinusitis reiterada, OMC con derrame e hipoacusia, trastornos del habla/deglución, maloclusión, halitosis, etc.","La madre pregunta si la voz \"gangosa\" también importa."),
Q("T","¿Qué tratamiento de la otitis con derrame queda en manos del especialista en este contexto?","La evaluación quirúrgica de las adenoides junto con el oído","Gotas óticas con antibiótico","Amoxicilina por 3 meses","Lavado de oídos","La OMC con derrame e hipoacusia bilateral es criterio de interconsulta ORL para evaluar cirugía.","La audiometría confirma hipoacusia de conducción bilateral."),
Q("P","Mientras espera el turno de ORL, ¿qué pauta das?","Consultar ante apneas prolongadas, cianosis o dificultad respiratoria","No hace falta pauta","Dormir boca abajo","Darle antihistamínicos de 1ª generación para que duerma","Pauta general de alarma respiratoria mientras se concreta la derivación. (Criterio clínico.)","El turno con ORL es en 6 semanas.")
]);

C(1,"Damián, 28 años",
"Damián tiene 28 años. Consulta por una úlcera en el pene de 10 días, indolora, de bordes indurados, que \"no se cura\", y un ganglio inguinal grande no doloroso. Tuvo relaciones sin preservativo con parejas ocasionales de ambos sexos. Hace 2 años tuvo herpes genital. No tiene alergias.\n\nExamen: úlcera única, limpia, de 1 cm, base indurada, indolora, en el surco balanoprepucial. Adenopatía inguinal derecha indolora. Sin exantema.\n\nLaboratorio: VDRL reactiva 1/32, prueba treponémica positiva. VIH no reactivo.",
[
Q("T","¿Qué estadio de sífilis presenta?","Sífilis primaria (chancro)","Secundaria","Latente tardía","Terciaria","Úlcera indolora indurada con adenopatía: sífilis primaria."),
Q("P","¿Qué tratamiento corresponde?","Penicilina G benzatínica 2,4 M UI IM dosis única","2,4 M UI semanal por 3 semanas","Azitromicina 1 g","Aciclovir","Primaria, secundaria y latente temprana: penicilina G benzatínica 2,4 M UI IM única.","Confirmás el diagnóstico."),
Q("P","¿Cómo sigue el control serológico?","VDRL a los 3-6 meses","Treponémica mensual","No hace falta","Sólo si reaparece la lesión","Notificar y tratar parejas; pesquisar otras ITS; VDRL a los 3-6 meses.","Recibe la dosis sin reacción."),
Q("T","Si fuera alérgico mayor sin posibilidad de desensibilizar ni IM, ¿qué alternativa?","Doxiciclina 100 mg c/12 h VO por 14 días","Ceftriaxona única","Amoxicilina VO","No tratar","Alternativa (alergia mayor sin desensibilización ni IM): doxiciclina 100 mg c/12 h por 14 días.","Damián comenta que su pareja anterior tuvo anafilaxia con penicilina."),
Q("P","Meses después tiene vesículas dolorosas agrupadas en el pene con pródromo de ardor. ¿Qué indicás?","Aciclovir 800 mg 3 veces/día por 2 días u 800 mg 2 veces/día por 5 días (recurrencia)","Penicilina benzatínica","Sólo antisépticos","Aciclovir tópico solo","Herpes genital recurrente: aciclovir 800 mg 3 veces/día por 2 días u 800 mg c/12 h por 5 días; los antivirales tópicos no tienen utilidad demostrada.","A los 8 meses vuelve con una recurrencia de herpes genital.")
]);

C(1,"Yanina, 24 años",
"Yanina cursa un embarazo de 9 semanas, el primero. Desde hace 3 semanas tiene náuseas todo el día y vómitos 4-5 veces por día; tolera algo de líquido y galletitas. Bajó 1,5 kg. Trabaja en una panadería y los olores la descomponen. Toma ácido fólico.\n\nExamen: TA 105/65, FC 92, mucosas algo secas, sin signos de deshidratación grave. Orina: cetonuria +. Ecografía: embarazo único intrauterino acorde.",
[
Q("T","¿Qué le explicás sobre las náuseas del embarazo?","Son benignas y suelen resolverse en el 2° trimestre","Indican un embarazo de riesgo","Son por una infección","Siempre requieren internación","Explicar benignidad (se resuelve en el 2° trimestre)."),
Q("P","¿Qué medidas generales indicás?","Porciones pequeñas y frecuentes, HC fáciles de digerir, evitar grasas y olores fuertes, hidratación en poca cantidad","Ayunar hasta que pasen","Comidas abundantes 2 veces/día","Acostarse inmediatamente después de comer","Porciones pequeñas y frecuentes, evitar grasas, olores fuertes y picantes; hidratación frecuente en poca cantidad; esperar 2 h para acostarse.","Yanina pregunta qué puede hacer con la comida."),
Q("P","Persisten vómitos frecuentes. ¿Qué fármaco de 1ª línea indica el cuadernillo?","Doxilamina 10 mg + piridoxina 10 mg (máx. 2 comp c/8 h)","Ondansetrón como 1ª línea","Metoclopramida por 1 mes","Omeprazol","Hiperemesis: doxilamina + piridoxina; máx. 2 comp c/8 h. 2ª línea: metoclopramida 10 mg c/8 h ≤ 5 días.","A la semana sigue vomitando varias veces al día pese a las medidas."),
Q("P","Si no responde, ¿qué 2ª línea y por cuánto tiempo?","Metoclopramida 10 mg c/8 h, no más de 5 días","Metoclopramida indefinida","Corticoides","Antibiótico","2ª línea: metoclopramida 10 mg c/8 h, no más de 5 días.","Mejora parcialmente con doxilamina-piridoxina."),
Q("T","¿Cuál es pauta de alarma para consultar?","Intolerancia oral, vómitos persistentes, boca seca, decaimiento u orina concentrada","Náuseas matinales","Antojos","Sueño","Pautas de alarma: intolerancia oral, vómitos persistentes, boca seca, decaimiento, orina concentrada.","Le das las indicaciones por escrito.")
]);

C(1,"Paola, 31 años",
"Paola cursa un embarazo de 33 semanas, único. Desde hace 10 días tiene picazón intensa en palmas y plantas, peor de noche, sin lesiones en la piel. No tiene fiebre, dolor abdominal ni ictericia. Embarazo controlado, sin HTA.\n\nExamen: excoriaciones leves por rascado, sin exantema. TA 112/72. Movimientos fetales presentes, latidos normales.\n\nLaboratorio: ácidos biliares 28 µmol/l, transaminasas levemente elevadas, bilirrubina normal.",
[
Q("T","¿Cuál es el diagnóstico más probable?","Colestasis gravídica","Escabiosis","Dermatitis atópica","Hepatitis A","Prurito palmoplantar del 3er trimestre con ácidos biliares elevados: colestasis gravídica."),
Q("P","Con ácidos biliares de 28, ¿dónde la manejás?","Ambulatorio: es leve (10-39)","Internación","UTI","Derivar a parto inmediato","Leve (AB 10-39) y moderada (40-99) → ambulatorio; severa (> 100) → internar; moderada con gemelar → internar.","Clasificás la gravedad."),
Q("P","¿Qué tratamiento indicás?","Ácido ursodesoxicólico 300 mg c/8 h hasta el parto","Corticoides","Colestiramina sola","Nada","Ácido ursodesoxicólico 300 mg c/8 h (máx. 2000 mg) hasta el parto o hasta que cedan síntomas y bajen los AB.","Iniciás tratamiento."),
Q("P","El prurito no la deja dormir. ¿Qué agregás?","Difenhidramina 50 mg c/8 h VO","Loratadina 40 mg","Benzodiacepina","Corticoide tópico potente","Difenhidramina 50 mg c/8 h VO (efecto sedante nocturno).","Sigue sin dormir por la picazón."),
Q("T","¿Cómo se hace el seguimiento?","Ácidos biliares semanales, control de movimientos fetales y recategorizar","Control mensual","Sólo ecografía","No hace falta","Seguimiento: AB semanales, control de movimientos fetales, recategorizar.","Le explicás el plan de control.")
]);

C(1,"Noelia, 27 años",
"Noelia cursa un embarazo de 28 semanas, su segunda gesta. Grupo y factor: 0 Rh negativo (D negativa). Su pareja es Rh positivo. En el primer embarazo, hace 3 años, recibió gammaglobulina anti-D después del parto. No tuvo sangrados en este embarazo.\n\nLaboratorio: Coombs indirecta negativa. Embarazo normoevolutivo.",
[
Q("T","¿Está sensibilizada?","No: Coombs indirecta negativa","Sí, por ser Rh negativa","Sí, por el embarazo previo","No se puede saber","Coombs indirecta negativa = no sensibilizada; si fuera positiva → derivar (alto riesgo)."),
Q("P","¿Qué indicás en esta semana?","Gammaglobulina anti-D 300 µg IM o IV","Nada hasta el parto","Coombs mensual sin profilaxis","Transfusión","Toda D negativa no sensibilizada: anti-D 300 µg IM o IV en la semana 28-32.","Confirmás que no está sensibilizada."),
Q("T","¿Cuándo vuelve a recibir anti-D después del parto?","Dentro de las 72 h si el RN es Rh positivo","A la semana","Sólo si el RN es Rh negativo","Nunca","Puerperio: dentro de las 72 h si el RN es positivo.","Te pregunta qué pasa cuando nazca el bebé."),
Q("P","A las 34 semanas tiene un trauma abdominal leve en un accidente de tránsito. ¿Qué hacés?","Considerar una nueva dosis de anti-D: es un evento sensibilizante","Nada, ya recibió","Coombs en 6 meses","Interrumpir el embarazo","Trauma abdominal es evento sensibilizante; si ya recibió profilaxis y tiene otro evento, generalmente se repite.","A las 34 semanas sufre un choque leve con golpe en el abdomen."),
Q("T","¿Cuál de estos también es evento sensibilizante?","Amniocentesis o versión externa","Ecografía","Control de TA","Vacuna antigripal","Eventos: amenaza de aborto, aborto, ectópico, enfermedad trofoblástica, placenta previa sangrante, versión externa, trauma abdominal, procedimientos invasivos, desprendimiento.","Repasás con ella las situaciones de riesgo.")
]);

C(1,"Antonella, 23 años",
"Antonella tiene 23 años. Consulta porque menstrúa cada 2-4 meses desde la menarca y tiene acné y vello en el mentón y la línea media abdominal. IMC 31. No busca embarazo por ahora; tiene pareja estable y usa preservativo a veces. No fuma. Sin migraña con aura, HTA ni trombosis.\n\nExamen: hirsutismo moderado, acné inflamatorio leve, acantosis en cuello. TA 118/76.\n\nLaboratorio: test de embarazo negativo, TSH y prolactina normales, testosterona levemente elevada. Ecografía: ovarios multifoliculares. Glucemia 98, LDL 145.",
[
Q("T","¿Cuál es el diagnóstico más probable?","Síndrome de ovario poliquístico","Hiperprolactinemia","Hipotiroidismo","Insuficiencia ovárica precoz","Oligomenorrea, hiperandrogenismo y ovarios multifoliculares, con TSH y prolactina normales: SOP."),
Q("P","¿Cuál es la base del tratamiento?","Dieta, actividad física 150 min/semana y descenso del 5-10 % del peso en 6 meses","Sólo cirugía","Corticoides","Reposo","SOP: dieta, actividad física 150 min/semana moderada-alta, descenso de 5-10 % del peso en 6 meses, cesación tabáquica.","Antonella quiere \"regularizarse\" y mejorar el acné."),
Q("P","¿Qué anticonceptivo hormonal indicás?","ACO con etinilestradiol + progestágeno antiandrogénico (drospirenona)","Progesterona inyectable trimestral","Sólo preservativo","Anillo sin estrógenos","ACO con EE + progestágeno antiandrogénico (drospirenona); si contraindicado → SIU o ACO sólo de progestágeno.","Necesita anticoncepción y tratar el hiperandrogenismo."),
Q("T","Si el hirsutismo fuera severo, ¿qué podría agregarse y con qué condición?","Espironolactona o flutamida, siempre con método anticonceptivo","Testosterona","Finasteride sin MAC","Nada","Acné/hirsutismo severo → espironolactona o flutamida (siempre con MAC).","A los 6 meses el vello sigue siendo muy molesto."),
Q("T","Si en el futuro busca embarazo, ¿qué figura en el cuadernillo?","Descenso de peso + citrato de clomifeno + relaciones programadas","FIV de entrada","Suspender todo y esperar","Corticoides","Deseo de embarazo → descenso de peso + citrato de clomifeno + RRSS programadas.","Dos años después quiere quedar embarazada.")
]);

C(2,"Franco, 19 años",
"Franco tiene 19 años, nadador federado. Desde hace 3 días tiene dolor intenso en el oído derecho, que empeora al masticar y al tocarse la oreja, con sensación de oído tapado. Sin fiebre ni antecedentes de perforación. Se limpia los oídos con hisopos después de entrenar.\n\nExamen: dolor a la tracción del pabellón y a la presión del trago. CAE derecho edematoso, eritematoso, con secreción blanquecina; tímpano íntegro, visible parcialmente. Sin adenopatías ni celulitis periauricular. Afebril.",
[
Q("T","¿Cuál es el diagnóstico?","Otitis externa aguda","Otitis media aguda","Mastoiditis","Cerumen impactado","Dolor a la tracción del pabellón con CAE edematoso: otitis externa aguda."),
