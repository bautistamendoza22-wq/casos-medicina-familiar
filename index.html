Q("P","Con esquema antitetánico desconocido, ¿qué corresponde?","dT + gammaglobulina antitetánica","Nada","Sólo dT si la herida es limpia","Sólo antibiótico","No vacunado o desconocido → dT + gammaglobulina antitetánica.","Revisás su carnet: no hay registros."),
Q("T","¿Cuál es bandera roja de gravedad?","Celulitis extensa y rápidamente progresiva, necrosis, ampollas sangrantes o shock","Eritema de 3 cm","Dolor local leve","Febrícula","Banderas rojas: celulitis extensa y rápidamente progresiva, linfangitis, fiebre > 39 °C persistente, dolor y edema intensos, necrosis, ampollas sangrantes, shock.","Le das pautas de alarma."),
Q("P","Si progresara a moderada/severa, ¿qué ATB IV?","Ceftriaxona EV, por el riesgo de gram negativos (Aeromonas) de una herida en agua","Cefalexina VO","Amoxicilina VO","Ninguno","Guía SADI de IPPB 2025: celulitis moderada → régimen EV con cefazolina; pero cuando hay riesgo de bacilos gram negativos, como una herida en contacto con agua (Aeromonas spp.), se recomienda ceftriaxona en lugar de cefazolina. Si hay riesgo de SAMR o no responde en 48-72 h, agregar vancomicina (o TMS). Graves: cubrir SAMR (vancomicina), BGN (piperacilina-tazobactam o cefalosporina de 3ª-4ª) y agregar clindamicina. (El cuadernillo: cefazolina 1 g EV c/8 h; alt. clindamicina o piperacilina-tazobactam.)","A las 48 h el eritema avanzó a 15 cm, con fiebre de 38,8 °C.")
]);

C(14,"Tobías, 9 años",
"Tobías tiene 9 años y vive en un barrio que se inundó hace 4 semanas. Desde hace 5 días tiene fiebre, cansancio, náuseas, dolor abdominal leve y ahora está \"amarillo\", con orina oscura. Su hermana de 3 años y su abuelo de 68, con cirrosis, viven con él. Tobías no tiene vacuna de hepatitis A completa.\n\nExamen: ictericia, hepatomegalia dolorosa leve, sin ascitis ni alteración del sensorio. Hidratado.\n\nLaboratorio: transaminasas > 1000, bilirrubina 6 mg/dl, tiempo de protrombina normal. IgM anti-VHA positiva.",
[
Q("T","¿Cuál es el tratamiento específico de la hepatitis A?","No hay tratamiento específico; remite en semanas a meses","Antivirales","Antibióticos","Corticoides","Sin tratamiento específico; evitar hepatotóxicos innecesarios; remite en semanas-meses."),
Q("P","¿Qué indicás sobre la alimentación y los fármacos?","Fraccionar comidas si hay hiporexia y evitar fármacos hepatotóxicos innecesarios (paracetamol)","Dieta sin grasas estricta y paracetamol c/4 h","Ayuno","Suplementos de hierbas","Alimentación fraccionada si hiporexia; evitar hepatotóxicos innecesarios (paracetamol).","La madre pregunta qué le da para la fiebre y qué come."),
Q("P","¿Qué medida de higiene das en la casa?","Lavandina en ambientes y materiales en contacto con heces; lavado de manos con agua, jabón y cepillo de uñas","Fumigar","Aislamiento respiratorio","Nada","Higiene: lavandina en ambientes/materiales con heces; lavado de manos con agua, jabón y cepillo de uñas.","Viven 5 personas en la casa."),
Q("P","¿Qué hacés con la hermana de 3 años (sin serie completa) expuesta en las últimas 2 semanas?","Vacuna post exposición","Inmunoglobulina a todos los niños","Nada","Antibiótico","Vacuna post exposición: > 12 meses expuestos en las últimas 2 semanas sin serie completa; no usar Twinrix como PEP.","La hermana está asintomática."),
Q("T","¿Qué considerarías para el abuelo con cirrosis?","Inmunoglobulina 0,1 ml/kg según factores de riesgo y disponibilidad","Nada","Antivirales","Corticoides","Inmunoglobulina 0,1 ml/kg en inmunodeprimidos, hepatopatía crónica o > 40 años según FR y disponibilidad.","El abuelo, cirrótico, nunca tuvo hepatitis A.")
]);

C(14,"Hilda, 50 años",
"Hilda tiene 50 años. Mientras ordenaba leña mojada tras la inundación, sintió una picadura en la mano. A la hora empezó con dolor intenso que se extendió a todo el brazo y el abdomen, contracturas, sudoración profusa, hipertensión y taquicardia. Vio una araña negra con una mancha roja en el abdomen.\n\nExamen: TA 170/100, FC 118, sudorosa, abdomen en tabla sin peritonismo, contracturas musculares. Lesión puntiforme en el dorso de la mano.",
[
Q("T","¿Qué cuadro sospechás?","Latrodectismo (araña viuda negra)","Loxoscelismo","Escorpionismo","Abdomen agudo quirúrgico","Araña negra con mancha roja, dolor que se extiende, contracturas, sudoración, HTA y taquicardia: latrodectismo."),
Q("P","¿Cuál es la conducta?","Derivar a hospital de referencia: monitoreo cardiológico, antisepsia, analgésicos y antiveneno específico rápido","Sólo antihistamínicos y alta","Cirugía abdominal","Antibióticos","Latrodectismo: derivar; monitoreo cardiológico continuo, antisepsia local, analgésicos, antiveneno específico rápido.","Organizás el traslado."),
Q("T","¿Por qué el monitoreo cardiológico?","Por las alteraciones cardiovasculares (HTA, taquicardia, arritmias) del envenenamiento","Por la fiebre","Por el dolor de la mano","No hace falta","El cuadernillo indica monitoreo cardiológico continuo en latrodectismo.","Durante el traslado la FC sube a 130."),
Q("T","Si la araña hubiera sido marrón (Loxosceles), ¿qué figura?","Retirar compresiones, antisepsia, analgésicos, evaluar corticoides en las primeras horas y antiveneno Loxosceles","Sólo hielo","Cirugía inmediata","Nada","Loxoscelismo: retirar compresiones que agraven el edema, antisepsia, analgésicos, evaluar corticoides en las primeras horas, ATB si sobreinfección, antiveneno Loxosceles.","Su vecina tiene una lesión violácea y dolorosa en el muslo tras sacar ropa de un placard."),
Q("T","¿Cuándo se usan antibióticos en el loxoscelismo?","Sólo si hay sobreinfección","Siempre","Nunca","Como profilaxis de rutina","ATB si sobreinfección.","La lesión de la vecina evoluciona con una placa necrótica.")
]);

C(14,"Emilio, 60 años",
"Emilio tiene 60 años, trasplantado renal hace 2 años, con inmunosupresores. Su casa se inundó y desde hace 2 semanas convive con paredes con moho. Desde hace 5 días tiene fiebre, tos, dolor pleurítico y hemoptisis leve. Disnea de moderados esfuerzos.\n\nExamen: T 38,6 °C, FR 24, SatO2 91 %, rales en base izquierda.\n\nTC de tórax: nódulos con signo del halo. Galactomanano positivo. Internado con sospecha de aspergilosis invasiva.",
[
Q("T","¿Qué factor de riesgo explica la infección por mohos?","Inmunosupresión + exposición a moho en la vivienda inundada","Edad de 60 años","Tos","Nada","Inmunocomprometido con exposición ambiental a mohos tras la inundación."),
Q("P","¿Qué fármaco indica el cuadernillo para aspergilosis?","Voriconazol EV/VO: 6 mg/kg c/12 h el 1er día, luego 4 mg/kg c/12 h","Fluconazol VO","Anfotericina tópica","Amoxicilina","Aspergilosis: voriconazol 6 mg/kg c/12 h el 1er día, luego 4 mg/kg c/12 h.","Se confirma la sospecha."),
Q("P","Tiene SatO2 91 %. ¿Qué medida de soporte corresponde?","O2 por insuficiencia respiratoria","Nada","Broncodilatador solo","Corticoides en dosis altas","O2 si insuficiencia respiratoria; control hemodinámico en infecciones diseminadas.","Está con disnea."),
Q("T","Si fuera mucormicosis con necrosis extensa, ¿qué se agrega?","Anfotericina B liposomal 5-10 mg/kg/día + cirugía","Voriconazol solo","Itraconazol VO","Nada","Mucormicosis: anfotericina B liposomal 5-10 mg/kg/día; cirugía en necrosis extensa.","Otro paciente diabético descompensado tiene necrosis del paladar."),
Q("P","¿Qué medida de prevención recomendás a la familia?","Barbijo N95 en zonas de alta exposición, eliminar materiales con moho y ventilar","Fumigar con insecticida","Antifúngico profiláctico a todos","Nada","Prevención: N95 en zonas de alta exposición, eliminar materiales con moho, ventilar, evaluación temprana de pacientes con FR.","La familia va a limpiar la casa.")
]);

Q("E","¿Qué buscás en el examen físico de un lactante que llora mucho?","Signos de causa orgánica: fiebre, fontanela abombada, hernias, otitis, torniquete de pelo, fracturas","Sólo el peso","Reflejo rotuliano","Fondo de ojo de rutina","El examen completo busca causas orgánicas (infección, hernia atascada, OMA, torniquete de pelo, lesiones) antes de diagnosticar cólico."),
Q("S","¿Qué estudios complementarios pedís?","Ninguno: con examen normal y buen crecimiento el diagnóstico es clínico","Ecografía abdominal","Hemograma y orina completa siempre","Rx de abdomen","El cólico del lactante es un diagnóstico clínico; los estudios se reservan para signos de alarma.")]);

Q("A","¿Qué antecedente preguntás sobre el prepucio para decidir tratamiento?","Episodios de balanopostitis o ITU","Si llora al orinar en el baño","Si usa pañal de tela","Si toma leche de vaca","Sólo se trata en los primeros años si hay balanopostitis reiteradas o ITU."),
Q("E","¿Cómo evaluás si la hernia umbilical está complicada?","Si es reductible, indolora y sin cambios de coloración de la piel","Midiendo el ombligo con una moneda","Transiluminando","Con ecografía siempre","Hernia reductible, indolora y sin cambios de piel = no complicada; dolor, irreductibilidad o cambio de color sugieren atascamiento."),
Q("S","¿Hacen falta estudios por imágenes para la hernia umbilical no complicada?","No: el diagnóstico es clínico","Ecografía obligatoria","TC de abdomen","Rx de abdomen","Diagnóstico clínico; se controla y se deriva hacia el 3er año si persiste.")]);
D(2,[
Q("A","¿Qué factores de riesgo de fractura relevás en la anamnesis?","Fractura previa por trauma leve, tabaquismo, baja ingesta de calcio, menopausia precoz y corticoides","Color de ojos","Número de hijos varones","Grupo sanguíneo","Fractura por fragilidad, tabaco, alcohol, baja ingesta de calcio, menopausia precoz, corticoides y caídas alimentan la estimación de riesgo (FRAX)."),
Q("E","¿Qué hallazgo del examen sugiere fracturas vertebrales silentes?","Pérdida de talla y aumento de la cifosis dorsal","Hipertensión","Soplo carotídeo","Edemas","La pérdida de talla (> 3 cm) y la cifosis orientan a fracturas vertebrales.")]);
D(3,[
Q("A","¿Qué preguntás sobre las caídas?","Circunstancias, pródromos, pérdida de conocimiento, medicación y lugar donde ocurrieron","Sólo cuántas veces se cayó","Si se cayó de chico","Qué zapatos usaba de joven","La anamnesis de caídas incluye circunstancias, síncope, fármacos (BZD), entorno y consecuencias."),
Q("E","¿Qué examen orienta el riesgo de caídas en la consulta?","TA acostado y de pie, marcha y equilibrio, visión y examen neurológico","Sólo el peso","Palpación tiroidea","Fondo de ojo","Hipotensión ortostática, marcha, equilibrio, visión y déficit neurológico son claves en el adulto mayor que se cae."),
Q("S","Ante deterioro cognitivo, ¿qué laboratorio pedís para causas reversibles?","TSH, vitamina B12, función renal, glucemia, hemograma (y VDRL según contexto)","Sólo PSA","Amilasa","Troponina","Se buscan causas tratables de deterioro cognitivo: hipotiroidismo, déficit de B12, alteraciones metabólicas, etc.")]);
D(4,[
Q("A","¿Qué síntomas preguntás para diferenciar bacteriuria asintomática de cistitis o pielonefritis?","Disuria, polaquiuria, fiebre y dolor lumbar","Náuseas matinales","Antojos","Movimientos fetales","Sin síntomas urinarios ni sistémicos = bacteriuria asintomática; con síntomas bajos = cistitis; fiebre y dolor lumbar = pielonefritis."),
Q("E","¿Qué maniobra del examen orienta a pielonefritis?","Puñopercusión lumbar","Signo de Murphy","Maniobra de Leopold","Signo de Blumberg","Puñopercusión positiva + fiebre orientan a pielonefritis.")]);
D(5,[
Q("A","¿Qué antecedente es clave para interpretar la VDRL?","Tratamientos previos para sífilis y lesiones genitales o exantemas","Si tuvo varicela","Si tiene alergia al polen","Su grupo sanguíneo","Tratamientos previos y clínica compatible permiten estadificar y evaluar reinfección."),
Q("E","¿Qué buscás en el examen físico de una embarazada con VDRL reactiva?","Chancro, exantema palmoplantar, condilomas planos y adenopatías","Soplos cardíacos","Hiperreflexia","Bocio","Lesiones de sífilis primaria o secundaria (chancro, roséola, exantema palmoplantar, condilomas planos, adenopatías)."),
Q("S","¿Qué estudios complementarios corresponden además de la VDRL?","Prueba treponémica, VIH y HBsAg, y estudio de la pareja","Sólo ecografía","PCR para HPV","Ninguno","Confirmar con treponémica (sin demorar el tratamiento), descartar otras ITS y estudiar a la pareja.")]);
D(6,[
Q("A","¿Qué dato de la anamnesis orienta entre vaginosis, cándida y tricomonas?","Características del flujo (color, olor, consistencia), prurito y síntomas de la pareja","Edad de la menarca","Número de embarazos","Grupo sanguíneo","Flujo grisáceo con olor a pescado (vaginosis), grumoso con prurito (cándida), amarillo-verdoso espumoso (tricomonas)."),
Q("E","¿Qué hallazgo al especuloscopio es típico de tricomoniasis?","Cuello con puntillado rojo (\"en frutilla\")","Ectropión","Pólipo cervical","Leucorrea grumosa adherida","El cuello \"en frutilla\" es característico de Trichomonas."),
Q("S","¿Qué resultado del pH vaginal esperás en la tricomoniasis?","pH > 4,5","pH < 4,5","pH 2","No se modifica","Tricomoniasis y vaginosis elevan el pH (> 4,5); la candidiasis lo mantiene normal. El examen en fresco puede mostrar los parásitos móviles.")]);
D(7,[
Q("A","¿Qué datos de la anamnesis aumentan la sospecha de EPI?","Pareja nueva sin preservativo, flujo anormal, dispareunia, dolor pelviano bajo","Constipación crónica","Cefalea","Lumbalgia mecánica","Factores de riesgo de ITS y síntomas de cervicitis apoyan la sospecha de EPI."),
Q("E","¿Qué hallazgo del tacto bimanual es criterio mínimo de EPI?","Dolor a la movilización cervical, uterino o anexial","Útero en retroversión","Ovarios no palpables","Cuello cerrado","Criterio mínimo: dolor a la movilización cervical, uterino o anexial."),
Q("S","¿Qué estudio es imprescindible antes de tratar?","Test de embarazo (descartar ectópico) y ecografía si se sospecha absceso","Colonoscopia","TC de cerebro","Espirometría","Siempre descartar embarazo; ecografía transvaginal ante sospecha de absceso tubo-ovárico.")]);
D(8,[
Q("A","¿Qué preguntás sobre la lactancia para detectar la causa de la mastitis?","Técnica de prendida, frecuencia de tomas y vaciado de la mama","Si toma mate","Si usó DIU","Si tuvo varicela","La mala técnica y el vaciado insuficiente favorecen estasis y mastitis."),
Q("E","¿Qué hallazgo del examen diferencia absceso de mastitis?","Masa fluctuante","Eritema","Calor local","Grieta en el pezón","La fluctuación sugiere absceso (requiere drenaje)."),
Q("S","Si sospechás absceso, ¿qué estudio pedís?","Ecografía mamaria","Mamografía","TC de tórax","Ninguno","La ecografía confirma la colección y guía el drenaje.")]);
D(9,[

Q("E","¿Qué examen corresponde antes de iniciar THR?","TA, IMC y examen mamario y ginecológico","Sólo pulso","Reflejos","Fondo de ojo","Antes de THR: TA, IMC, examen mamario y ginecológico."),
Q("S","¿Qué estudio de rastreo debe estar al día?","Mamografía (y PAP según edad)","Densitometría mensual","Ecocardiograma","TC de abdomen","Mamografía y PAP actualizados; luego mamografía anual durante la THR.")]);
D(10,[
Q("A","¿Qué preguntás para estimar la magnitud del sangrado?","Cantidad de toallitas o tampones por día, coágulos, duración y síntomas de anemia","Si le gusta el chocolate","Edad de la menarca únicamente","Si tiene várices","Cuantificar el sangrado y los síntomas de anemia orienta la gravedad."),
Q("E","¿Qué signos del examen definen inestabilidad?","Hipotensión, taquicardia y ortostatismo","Palidez leve aislada","Acné","Hirsutismo","Hipotensión y Hto ≤ 30 % obligan a evaluar internación."),
Q("S","¿Qué estudios iniciales pedís en un SUA agudo?","Test de embarazo, hemograma y ecografía transvaginal","Sólo TSH","Colonoscopia","Rx de pelvis","Descartar embarazo, evaluar anemia y causas estructurales (PALM).")]);

FAM("Familia Ledesma","Darío (48), Analía (45), Brisa (15), Ciro (8), Pilar (3) y la abuela Elba (72)","US barrio Noroeste");
C(15,"Brisa, 15 años",
"Ud. trabaja en la Unidad Sanitaria del barrio Noroeste. Forma parte de un equipo con una enfermera y un promotor de salud de lunes a viernes; la trabajadora social y la odontóloga van 3 veces por semana y la psicóloga, 2. Hay turnos programados de 8 a 10 h, demanda espontánea de 10 a 12 h y reunión de equipo los viernes. Cuentan con botiquín de Remediar, vacunatorio, oxígeno y saturómetro. En las próximas consultas atenderá a la familia Ledesma.\n\nBrisa, de 15 años, consulta por primera vez porque le piden un certificado de aptitud física para el club de vóley. No se controla desde los 6 años. Viene con su madre, Analía. Decide comenzar el interrogatorio y el examen con la madre presente y luego continuar a solas con Brisa.",
[
Q("A","¿Qué datos recabás con la madre presente (y de la libreta sanitaria)?","Vivienda y servicios, convivientes, escolaridad, alimentación, sueño, actividad física, antecedentes personales y familiares, perinatales y estado de vacunación","Vivienda, convivientes, escolaridad, alimentación, antecedentes familiares e inicio de relaciones sexuales y consumo de sustancias","Antecedentes perinatales, vacunas, orientación sexual, vínculos de pareja y uso de anticonceptivos","Sólo antecedentes de lesiones deportivas","Con el acompañante se relevan datos generales, familiares, perinatales y la libreta; los temas íntimos (sexualidad, consumos, ánimo) se abordan a solas, con confidencialidad."),
Q("E","¿Qué incluye el examen físico de una adolescente en control de salud?","Peso, talla e IMC con percentiles, TA con percentil, estadios de Tanner, maniobra de Adams, agudeza visual, examen bucal y auscultación","Peso, talla, IMC, TA, Tanner, agudeza visual y especuloscopia con toma de PAP","Peso, talla, TA, auscultación y ECG de reposo para el certificado deportivo","ECG y ergometría para el certificado","Antropometría, TA, Tanner, Adams (escoliosis), agudeza visual, examen bucal y cardiopulmonar son el núcleo del control del adolescente.","Brisa vive con sus padres, Darío (48) y Analía (45), y sus hermanos Ciro (8) y Pilar (3). También vive la abuela, Elba (72). La casa es de material, con 3 habitaciones; se calefaccionan con una estufa a garrafa sin salida al exterior. Darío fuma dentro de la casa. Brisa va a 3er año, le va bien. Come salteado: no desayuna. Juega vóley 3 veces por semana. Libreta: vacunas completas hasta el ingreso escolar; no recibió las de los 11 años."),
Q("A","Ya a solas, ¿cómo encarás el interrogatorio?","Explicar la confidencialidad y sus límites (riesgo para su vida o la de terceros) y preguntar por sexualidad, MAC, consumos, ánimo, vínculos y violencia","Explicar que todo lo que diga será confidencial sin excepciones y preguntar por sexualidad, consumos y ánimo","Preguntar por sexualidad, consumos y ánimo, aclarando que al final le vas a resumir todo a la madre","Preguntar sólo por el deporte","Espacio confidencial: sexualidad y anticoncepción, consumos (tabaco, alcohol, marihuana), ánimo e ideación suicida, vínculos, violencia y proyectos (HEADSSS).","Peso 52 kg, talla 1,60 m, TA 112/70, Tanner 4, Adams simétrico, agudeza visual 6/10 en ambos ojos, caries en 2 piezas. Auscultación normal. Analía se retira del consultorio."),
Q("PR","¿Cuál es la problematización más completa?","Adolescente sana en control; vacunas de los 11 años pendientes; agudeza visual disminuida; caries; salteo del desayuno; tabaquismo pasivo; riesgo de intoxicación por CO; inicio de relaciones sin método","Adolescente sana; vacunas de los 11 años pendientes; caries; agudeza visual disminuida; salteo del desayuno","Adolescente con escoliosis; vacunas pendientes; caries; agudeza visual disminuida; tabaquismo pasivo; inicio de relaciones sin método","Riesgo cardiovascular alto","La problematización (E del SOEP) incluye lo biomédico, lo preventivo y los riesgos del entorno (CO, humo de tabaco).","A solas, Brisa cuenta que tiene novio desde hace 4 meses y tuvieron relaciones \"a veces con preservativo\". No fuma; tomó alcohol en 2 fiestas. Buen ánimo, sin ideación suicida. Pregunta por \"la pastilla\"."),
Q("PL","¿Cómo finalizás la entrevista?","Vacunas HPV, dTpa y meningococo; consejería en MAC y doble protección (ofrecer método y preservativos); oftalmología y odontología; pautas sobre calefacción segura y humo de tabaco; certificado; ofrecer volver sola","Vacunas de los 11 años, ACO como único método, oftalmología, odontología, certificado y citar con la madre para contarle","Certificado, vacunas de los 11 años, odontología y oftalmología; anticoncepción cuando venga con un adulto","Derivar a ginecología sin intervenir","Plan integral: completar calendario de los 11 años, anticoncepción con doble protección, interconsultas, prevención de CO y tabaquismo pasivo, y un espacio confidencial abierto.","Brisa quiere empezar un método anticonceptivo y no quiere que su madre se entere por ahora.")
]);

C(15,"Darío, 48 años",
"Darío, padre de Brisa, consulta para un control de salud: no ve a un médico desde los 25 años. Es albañil por cuenta propia (monotributista) y trabaja de 7 a 18 h.",
[
Q("A","¿Qué pregunta de la anamnesis es clave para definir su rastreo de cáncer?","Antecedentes familiares de cáncer de colon (edad de diagnóstico de cada familiar)","Si tuvo varicela","Su grupo sanguíneo","Si usa anteojos de sol","Los antecedentes familiares de CCR en 1er grado adelantan y cambian el método de rastreo."),
Q("A","Fuma 20 cigarrillos/día y \"no piensa dejar en los próximos 6 meses\". ¿En qué etapa de Prochaska está?","Precontemplación","Contemplación","Preparación","Acción","Sin intención de dejar en 6 meses = precontemplación; corresponde consejo breve e información.","Su padre y su hermano tuvieron cáncer de colon (el hermano a los 46 años). Toma 1 litro de cerveza los días de semana y \"bastante más\" los sábados; hace un año le retuvieron el auto en un control de alcoholemia, pero dice que \"maneja bien\". Fuma 20 cig/día. Come pan y fiambre en la obra. Sedentario fuera del trabajo. Última dT en la colimba."),
Q("E","¿Qué examen físico corresponde?","TA, peso, talla, IMC, cintura, agudeza visual, examen bucal y examen cardiopulmonar","Tacto rectal y PSA de rutina","Sólo TA","Espirometría","Control de salud del adulto: TA, antropometría con cintura, agudeza visual (presbicia), examen bucal y general.","Para el alcohol aplicás el AUDIT: 19 puntos."),
Q("PR","¿Cuál es la problematización más completa?","Consumo de riesgo de alcohol (con conducción alcoholizada); tabaquismo en precontemplación; TA elevada a confirmar; obesidad abdominal; presbicia; alto riesgo de CCR por antecedentes; vacunas desactualizadas; tabaquismo pasivo de sus hijos","HTA confirmada; obesidad; tabaquismo en contemplación; consumo de riesgo de alcohol; presbicia; riesgo de CCR","Consumo de riesgo de alcohol; tabaquismo en precontemplación; TA elevada a confirmar; obesidad; presbicia; vacunas desactualizadas","Sano","Problemas biomédicos, de hábitos, preventivos y familiares. La TA queda elevada a confirmar: según el cuadernillo, el diagnóstico de HTA en consultorio requiere ≥ 140 y/o ≥ 90 mmHg en al menos dos consultas en días distintos, promediando al menos 2 mediciones en cada una. Las dos tomas de hoy corresponden a una sola consulta.","Peso 92 kg, talla 1,74 m (IMC 30), cintura 108 cm, TA 148/92 (promedio de dos tomas en esta consulta; es la primera vez que se la miden), agudeza visual 9/10 pero aleja el papel para leer. Dentadura con faltantes."),
Q("PL","¿Qué plan de rastreo y prevención corresponde?","Colonoscopia ya (antecedente de 1er grado < 60 años: desde los 40 o 10 años antes del caso más joven), laboratorio (glucemia, lípidos, creatinina), VIH y VHC, nuevas tomas de TA, dT y HB, consejo breve antitabaco y antialcohol, oftalmología/óptica y odontología","Sangre oculta en materia fecal a los 50 años, laboratorio, VIH y VHC, dT y HB, consejo breve antitabaco y antialcohol","Colonoscopia ya, PSA, TC de tórax de baja dosis, laboratorio, enalapril desde hoy y vacunas","Sólo indicar enalapril","Rastreo dirigido por riesgo, confirmación de HTA, vacunación del adulto e intervenciones breves sobre tabaco y alcohol (incluido no manejar tras beber).","Darío dice que \"para qué tantos estudios si se siente bien\".")
]);

C(15,"Ciro, 8 años",

[
Q("A","¿Qué información buscás en la libreta sanitaria y el interrogatorio?","Antecedentes perinatales, controles y curvas de crecimiento, vacunas, desempeño escolar, alimentación, actividad física, pantallas, sueño, higiene bucal, seguridad vial y crianza (límites)","Vacunas, crecimiento, escolaridad, antecedentes de enfermedades y alimentación (sin indagar crianza ni seguridad)","Antecedentes perinatales, vacunas, curvas de crecimiento, Tanner y antecedentes sexuales","Sólo enfermedades previas","Control del niño en edad escolar: crecimiento, desarrollo y escolaridad, hábitos, prevención de accidentes y vínculos."),
Q("T","¿Qué vacunas del ingreso escolar esperás encontrar?","Triple viral (2ª dosis), triple bacteriana celular y refuerzo de polio","Triple viral sola de los 12 meses","HPV y dTpa","Ninguna: ya no corresponden","Ingreso escolar: 2ª dosis de triple viral, triple bacteriana celular y polio (refuerzo). HPV, dTpa y meningococo son a los 11 años.","Analía cuenta que Ciro come mucho pan y gaseosa, mira 4 horas de pantalla por día y no hace deporte. Se cepilla los dientes \"a veces\". En la escuela le va bien. Para ponerle límites \"a veces le da un chirlo\". Va solo a la escuela, cruzando una avenida."),
Q("E","¿Qué incluye el examen físico?","Peso, talla, IMC con percentil, TA con percentil, agudeza visual, examen bucal, cuero cabelludo, piel y examen general","Sólo peso","Tanner y examen genital exhaustivo","Fondo de ojo y ECG","Antropometría con percentiles, TA, visión, dientes, piel y cuero cabelludo (pediculosis)."),
Q("PR","¿Cuál es la problematización más completa?","Obesidad; alimentación inadecuada; sedentarismo y exceso de pantallas; caries; pediculosis; castigo físico como límite; riesgo de accidentes en la vía pública; tabaquismo pasivo y riesgo de CO","Obesidad; caries; pediculosis; sedentarismo; hipertensión arterial; tabaquismo pasivo","Sobrepeso; caries; pediculosis; exceso de pantallas; agudeza visual disminuida; riesgo de CO","Sólo obesidad","Se integran problemas biomédicos, de hábitos, de crianza y del entorno.","Peso 38 kg, talla 1,28 m (IMC > percentil 97), TA percentil 75, agudeza visual 10/10, caries en 3 piezas, piojos y liendres abundantes."),
Q("PL","¿Qué plan de acción integral corresponde?","Recomendaciones de alimentación y actividad física en familia, límite de pantallas, odontología, permetrina para pediculosis y revisar convivientes, desaconsejar el castigo físico, acompañamiento al cruzar la avenida, calefacción segura y casa libre de humo, control en 30-40 días","Dieta hipocalórica estricta, metformina, odontología, permetrina y control en 6 meses","Recomendaciones de alimentación y actividad física, odontología, ivermectina para pediculosis y control en 6 meses","Derivar a endocrinología sin intervenciones","Plan de consejería e intervenciones concretas sobre cada problema, con seguimiento cercano y eventual presentación en la reunión de equipo.","Analía se muestra receptiva pero dice que \"con tres chicos no da abasto\".")
]);

Q("PR","¿Cómo problematizás?","Diarrea aguda con deshidratación leve-moderada (pérdida ~3-5 %), sin signos de invasividad","Normohidratada","Deshidratación grave con shock","Disentería","Irritable, sedienta, ojos hundidos, pliegue lento y descenso de peso: deshidratación leve-moderada → plan B.","Está irritable, sedienta, con ojos algo hundidos, mucosas secas, pliegue que se recupera lentamente, relleno capilar 2 s. Pesa 14 kg."),

Q("E","¿Qué examen hacés?","Signos vitales (qSOFA), puñopercusión, palpación abdominal y puntos ureterales","Especuloscopia de rutina","Sólo temperatura","Tacto rectal","Evaluar sepsis y compromiso alto.","Tuvo ITU en la adolescencia. No tiene flujo ni prurito. No recibió quinolonas. No está embarazada (ligadura tubaria)."),

C(15,"Darío, 48 años",
"Darío vuelve a los 3 meses: no se hizo los estudios. Consulta porque tiene mucha sed, orina seguido y bajó 4 kg. Un análisis de una campaña en la plaza dio glucemia de 260 mg/dl.",
[
Q("A","¿Qué preguntás para orientar el diagnóstico y el plan?","Síntomas cardinales, visión borrosa, infecciones recientes, alimentación, adherencia posible y barreras (trabajo, costo)","Antecedentes de varicela","Si juega al fútbol","Si tiene mascotas","Síntomas, complicaciones y barreras para el tratamiento."),
Q("E","¿Qué ampliás en el examen por la diabetes?","Examen de pies (monofilamento, pulsos), TA, peso, cintura, boca (periodontitis) y fondo de ojo (o derivación)","Sólo glucemia capilar","Otoscopia","Tacto rectal","Rastreo de complicaciones desde el diagnóstico.","Tiene poliuria, polidipsia y visión borrosa. Sigue fumando 20 cig/día. Toma menos alcohol desde la última consulta. Desayuna mate dulce, almuerza sándwiches en la obra."),
Q("PR","¿Cuál es la problematización?","DBT2 de reciente diagnóstico sintomática; HTA (ya confirmada); obesidad; tabaquismo; consumo de alcohol (mejorando); gingivitis; riesgo laboral de lesiones en pies; rastreo de CCR pendiente","DBT2 de reciente diagnóstico; HTA; obesidad; tabaquismo; gingivitis","Prediabetes; HTA; obesidad; tabaquismo; gingivitis; riesgo laboral de lesiones en pies","Sólo obesidad","Integrar la DBT con los otros problemas pendientes.","TA 146/90 (promedio de dos tomas; es la segunda consulta, en otro día, con valores ≥ 140/90). Peso 88 kg. Monofilamento normal, hiperqueratosis en talones, gingivitis."),
Q("PL","¿Qué plan corresponde?","Explicar el diagnóstico; metformina 500 mg con almuerzo y cena con titulación; laboratorio (HbA1c, lípidos, creatinina, albuminuria), ECG; IECA o ARA II + amlodipina o tiazida a dosis bajas; estatina de moderada intensidad; vacunas antitetánica, antigripal y antineumocócica; odontología; cuidado de pies con calzado de seguridad; consejo antitabaco; colonoscopia pendiente; control en 2 semanas","Explicar el diagnóstico, insulina basal inmediata, laboratorio, vacunas y control en 1 mes","Explicar el diagnóstico, glibenclamida, laboratorio completo, vacunas y control en 3 meses","Sólo dieta por 6 meses","Metformina desde el inicio, rastreo de complicaciones, RCV, vacunas, cuidados de pies y abordaje del tabaco. HTA: con la segunda consulta ≥ 140/90 queda confirmada; según la GPC Nacional de HTA 2026, en DBT el esquema de inicio incluye un IECA o ARA II, combinado con amlodipina o tiazida a dosis bajas, sin demorarlo por los estudios. Por la DBT corresponde estatina de moderada intensidad. No asociar IECA con ARA II. Guía SAD de DM2 2025: metformina más enfoque integral; la intensidad inicial depende de la HbA1c (7,5 a < 10 %: terapia dual; ≥ 10 % o glucemia > 300 con síntomas catabólicos: insulina), por eso la HbA1c del laboratorio define si se suma otro fármaco.")
]);

C(15,"Elba, 72 años",
"Analía trae a su madre, Elba, porque \"está olvidadiza\": repite preguntas, se perdió volviendo de la carnicería y se cayó 2 veces en el último mes. Es viuda; vive con la familia desde hace 1 año. Toma enalapril y lorazepam 2,5 mg a la noche desde que enviudó.",
[
Q("A","¿Qué datos recabás antes del examen?","Inicio y evolución de los síntomas, impacto en actividades instrumentales, ánimo, fármacos (BZD), alcohol, caídas, sueño y apoyo familiar; aplicar un test (MMSE)","Sólo la edad","Antecedentes obstétricos","Si toma mate","Caracterizar el deterioro, descartar depresión y fármacos, y evaluar funcionalidad."),
Q("E","¿Qué evaluás en el examen?","TA acostada y de pie, examen neurológico, marcha y equilibrio, visión y audición","Sólo peso","Fondo de ojo exclusivamente","Tacto rectal","Examen orientado a caídas y deterioro cognitivo."),

C(15,"Yésica, 29 años",

// Casos nuevos basados en actualizaciones (Consenso FASGO de trastornos hipertensivos del embarazo, dic. 2025)
C(1,"Jimena, 34 años",
"Jimena tiene 34 años y cursa su segundo embarazo, de 32 semanas. Empezó los controles a las 22 semanas porque no conseguía turno; en ese momento la TA era 112/70. En su primer embarazo tuvo preeclampsia a las 35 semanas. No toma medicación. Trabaja como cajera en un supermercado.\n\nHoy viene al control programado y dice que \"se siente bien\". Al tomarle la TA, sentada, después de 5 minutos de reposo y con la vejiga vacía, obtenés 146/94 en el brazo derecho; a los 15 minutos, en el mismo brazo, 148/92.\n\nExamen: edemas maleolares leves, altura uterina acorde a la edad gestacional, latidos fetales 140 por minuto, movimientos fetales presentes.",
[
Q("A","¿Qué síntomas preguntás ante la TA elevada?","Cefalea, alteraciones visuales, dolor epigástrico o en hipocondrio derecho, disnea y disminución de los movimientos fetales","Prurito vulvar","Tos","Ardor al orinar como único síntoma","Son síntomas de compromiso de órgano blanco (neurológico, hepático, cardiopulmonar) o de disfunción uteroplacentaria. Según el Consenso FASGO, hay que dar pautas de alarma sobre estos signos en cada control después de las 20 semanas."),
Q("T","¿Cómo define el Consenso FASGO la hipertensión en el embarazo?","PAS ≥ 140 y/o PAD ≥ 90 mmHg en al menos 2 tomas en el mismo brazo, con 15 minutos de intervalo","≥ 130/80 en una sola toma","≥ 160/110 en dos tomas","≥ 140/90 en una sola toma, en cualquier brazo","Consenso FASGO 2025: PAS ≥ 140 y/o PAD ≥ 90 mmHg en consultorio, en al menos 2 tomas en el mismo brazo con 15 minutos de intervalo; HTA grave ≥ 160 y/o ≥ 110. Las definiciones de 130/80 de AHA/ACC no se adoptaron en el embarazo. Las mediciones de consultorio se complementan con MAPA o MDPA para descartar HTA de guardapolvo blanco."),
Q("S","¿Qué estudios pedís?","Hemograma con plaquetas, glucemia, urea, creatinina, ácido úrico, hepatograma y proteinuria de 24 h o índice proteína/creatinina","Sólo un sedimento urinario","TC de cerebro","Dímero D y ecodoppler de vasos de cuello","Consenso FASGO: ante TA ≥ 140/90, hemograma con plaquetas, glucemia, uremia, creatinina, ácido úrico, hepatograma y proteinuria (≥ 0,3 g/24 h o proteína/creatinina ≥ 30 mg/mmol); el cociente sFlt-1/PlGF ayuda a confirmar o descartar preeclampsia antes de las 37 semanas, si está disponible. Además, evaluación fetal y ECG."),
Q("T","¿Cómo se clasifica el cuadro?","Preeclampsia sin signos de severidad","Hipertensión gestacional","Preeclampsia leve","Hipertensión crónica","Consenso FASGO 2025: preeclampsia = hipertensión de novo después de las 20 semanas con proteinuria o daño renal, hepático, neurológico, hematológico o disfunción uteroplacentaria (la proteinuria ya no es obligatoria). Se abandonan los términos leve y severa: ahora es con o sin signos de severidad. La cantidad de proteinuria y el ácido úrico no se usan para decidir la interrupción.","Plaquetas 210.000/mm³, creatinina 0,7 mg/dl, ácido úrico 5,2 mg/dl, transaminasas normales. Índice proteína/creatinina 45 mg/mmol. Ecografía: crecimiento fetal en percentil 25, Doppler normal."),
Q("PL","¿Qué antihipertensivos se pueden usar en el embarazo?","Labetalol, alfametildopa, nifedipina de liberación prolongada o amlodipina","Enalapril o losartán","Atenolol","Espironolactona","Consenso FASGO 2025: fármacos de elección labetalol, alfametildopa, nifedipina de liberación prolongada y amlodipina, empezando con monoterapia. Suspender IECA, ARA II, espironolactona y atenolol. Con preeclampsia sin signos de severidad entre las 24 y 33,6 semanas, asistirla en un centro con complejidad acorde para la madre y un recién nacido pretérmino; planificar la finalización a las 37 semanas.","Decidís iniciar tratamiento antihipertensivo y derivarla para seguimiento estrecho."),
Q("C","Indicás labetalol. ¿Qué posología figura en el consenso?","100 a 400 mg por toma, cada 12 h como mínimo (máx. 1200 mg/día)","1200 mg en una sola toma diaria","50 mg por semana","400 mg c/2 h","Consenso FASGO (tabla 2a): labetalol 100-400 mg por toma, como mínimo c/12 h (puede pasar a c/6-8 h), máx. 1200 mg/día; no en dosis única. Nifedipina de liberación prolongada 30-60 mg c/12-24 h (máx. 120 mg/día); alfametildopa 250-500 mg c/6-12 h (máx. 2500 mg/día); amlodipina 5-10 mg/día."),
Q("PL","¿Qué corresponde ahora?","Sulfato de magnesio 4 g IV de ataque y 1 g/h por 24 h; antihipertensivo de acción rápida para mantener la TA < 160/100; finalizar la gestación","Diazepam para prevenir convulsiones y esperar a las 37 semanas","Sulfato de magnesio como antihipertensivo único","Alta con labetalol y control en una semana","Consenso FASGO: preeclampsia con signos de severidad → sulfato de magnesio como profilaxis de eclampsia (hipertensión severa, síntomas neurológicos, dolor abdominal superior, plaquetas < 100.000, falla renal o transaminasas elevadas): 4 g IV en ataque y 1 g/h por 24 h, con control clínico (no de magnesemia de rutina). El MgSO4 no es antihipertensivo; con TA ≥ 160/100 usar uno de acción rápida (labetalol IV, hidralazina IV o nifedipina oral). No usar fenitoína ni benzodiacepinas salvo contraindicación del magnesio. Con compromiso endotelial materno severo, finalizar la gestación independientemente de la edad gestacional; preferir la vía vaginal si las condiciones obstétricas lo permiten.","A las 34 semanas, ya internada, presenta cefalea intensa y escotomas. TA 164/112. Plaquetas 90.000/mm³."),
Q("T","Tras el parto, ¿qué prevención le indicás para un próximo embarazo?","Tamizaje combinado a las 11-13,6 semanas y, si es de alto riesgo, aspirina 150 mg a la noche desde las 12 hasta las 36 semanas","Aspirina 75-100 mg desde la semana 20","Nada: la preeclampsia no recurre","Reposo absoluto desde el primer trimestre","Consenso FASGO 2025: tamizaje combinado (factores maternos, PAM, índice de pulsatilidad de arterias uterinas y PlGF si está disponible) a las 11-13,6 semanas; con alto riesgo, aspirina 150 mg a la noche de las 12 a las 36 semanas (ASPRE: ↓ 62 % la preeclampsia < 37 semanas). (El cuadernillo indicaba aspirina 75-100 mg/día iniciada entre las 8 y las 16 semanas.) Además, reclasificar a las 12 semanas posparto con MAPA y seguir su riesgo cardiovascular a largo plazo.","Nace un varón de 2100 g. A los 4 días está con TA 138/88 y amamantando. Pregunta si le puede volver a pasar.")
]);
M("155-0","Cefalea|Alteraciones visuales (escotomas)|Dolor epigástrico o en hipocondrio derecho|Disnea|Disminución de los movimientos fetales","Prurito vulvar|Tos");
M("155-2","Hemograma con plaquetas|Creatinina, urea y ácido úrico|Hepatograma|Proteinuria de 24 h o índice proteína/creatinina","TC de cerebro|Dímero D|Ecodoppler de vasos de cuello");
M("155-4","Labetalol|Alfametildopa|Nifedipina de liberación prolongada|Amlodipina","Enalapril|Losartán|Atenolol");
M("155-6","Sulfato de magnesio 4 g IV de ataque y 1 g/h por 24 h|Antihipertensivo de acción rápida para mantener la TA < 160/100|Finalizar la gestación","Diazepam para prevenir convulsiones|Usar el sulfato de magnesio como antihipertensivo|Esperar a las 37 semanas");
// Casos nuevos de control de embarazo (cuadernillo 2026, cap. Control de embarazo, Patologías frecuentes y Síntomas frecuentes)
C(1,"Abigail, 19 años",
"Abigail tiene 19 años y consulta porque hace 2 semanas tiene náuseas y vómitos a la mañana. Su FUM fue hace 9 semanas; el test de embarazo de farmacia dio positivo. Vive con su pareja, de 22 años, en la casa de la suegra. Está terminando el secundario a la noche.\n\nVomita 1 o 2 veces al despertar y después tolera el desayuno y el resto de las comidas. No tiene fiebre, diarrea, ardor al orinar ni dolor lumbar. No toma medicación.\n\nExamen: TA 108/66, FC 82, peso 56 kg (antes del embarazo, 56 kg), mucosas húmedas, abdomen blando e indoloro.",
[
Q("A","¿Qué preguntás para descartar otras causas de los vómitos?","Fiebre, mocos o diarrea; fiebre, disuria o dolor lumbar; tolerancia a la vía oral y signos de deshidratación","Sólo la fecha de la última menstruación","Antecedentes de alergia al polen","Si tiene antojos","Diferenciales del cuadernillo: gastroenteritis (fiebre, mocos, diarrea), pielonefritis (fiebre, disuria, puñopercusión positiva), hiperemesis e hipertiroidismo. También hay que evaluar la tolerancia oral y buscar deshidratación."),
Q("T","¿Qué estudio da certeza de embarazo?","La subunidad beta de HCG o la visualización fetal por ecografía transvaginal","Los vómitos matutinos","El reblandecimiento del útero","La turgencia mamaria","Cuadernillo: los signos de presunción (náuseas, vómitos, turgencia mamaria) y las modificaciones uterinas sólo dan probabilidad. La beta-HCG es el método más accesible y precoz, y la ecografía transvaginal visualiza el embarazo desde la 4ª semana desde la FUM."),
Q("A","¿Qué incluye el interrogatorio del primer control?","Si el embarazo fue buscado, pareja y con quién vive, sustento económico, violencia, ocupación y estudio, alimentación, consumos y antecedentes","Sólo los síntomas digestivos","Sólo los antecedentes familiares","El sexo que desea para el bebé","Cuadernillo, semanas 1-12: si tiene pareja y si el embarazo fue buscado (método que falló o no se cuidaban), con quién vive, cómo recibió la noticia y el sustento económico, violencia, ocupación y estudio, dudas y temores, alimentación, actividad física, tabaco (también pasivo), alcohol y drogas, enfermedades, medicación, cirugías, alergias y antecedentes ginecoobstétricos y familiares."),
Q("P","Por ahora, ¿qué le indicás para las náuseas?","Explicar que es benigno, comidas pequeñas y frecuentes con hidratos de carbono fáciles de digerir, evitar grasas y olores fuertes, buena hidratación y esperar 2 h para acostarse","Metoclopramida de entrada por 2 semanas","Ayuno hasta que paren los vómitos","Internación para hidratar","Cuadernillo: las náuseas y vómitos son frecuentes en el 1er trimestre (por la beta-HCG) y suelen desaparecer entre las semanas 14 y 16. Explicar la benignidad, dar pautas de alarma (no tolera la vía oral, vómitos persistentes, boca seca, muy decaída, orina concentrada) y medidas dietarias.","Abigail cuenta que el embarazo no fue buscado pero que «ahora está contenta»; su pareja la acompaña."),
Q("P","¿Qué suplementos le indicás?","Ácido fólico 0,4 mg/día hasta la semana 12 y sulfato ferroso 100 mg/día (60 mg de hierro elemental) hasta los 3 meses posparto","Sólo hierro a partir del tercer trimestre","Ácido fólico 5 mg/día durante todo el embarazo","Ningún suplemento si come bien","Cuadernillo: ácido fólico 0,4 mg/día desde 6 semanas antes de la gestación hasta la semana 12, y sulfato ferroso 100 mg/día (60 mg de hierro elemental) desde la primera consulta prenatal hasta los 3 meses posparto."),
Q("T","¿Cómo se define la hiperemesis gravídica?","Náuseas y vómitos persistentes con pérdida de peso (≈ 5 %), signos de deshidratación e intolerancia a la vía oral","1 o 2 vómitos matutinos que calman durante el día","Cualquier vómito después de la semana 12","Náuseas sin vómitos","Cuadernillo: hiperemesis = vómitos persistentes, pérdida de peso del 5 %, signos de deshidratación e intolerancia a la vía oral, en el 1er trimestre.","A las 11 semanas vuelve: vomita varias veces al día, casi no tolera líquidos y pesa 53 kg. Tiene la boca seca y orina poco."),
Q("P","¿Qué tratamiento farmacológico indica el cuadernillo?","Doxilamina 10 mg + piridoxina 10 mg, hasta 2 comprimidos c/8 h; 2ª línea metoclopramida 10 mg c/8 h por no más de 5 días","Ondansetrón como única opción","Metoclopramida 10 mg c/8 h durante todo el embarazo","Corticoides orales","Cuadernillo: doxilamina succinato 10 mg + piridoxina 10 mg (máximo 2 comprimidos c/8 h), con pautas de alarma de deshidratación; 2ª línea metoclopramida 10 mg c/8 h, no más de 5 días. Con deshidratación e intolerancia oral hay que evaluar hidratación parenteral.")
]);

C(1,"Ludmila, 24 años",
"Ludmila tiene 24 años y cursa su primer embarazo. Viene al control el 15 de septiembre. Su FUM fue el 10 de marzo. La primera ecografía, del 10 de mayo, informó 8 semanas y 2 días.\n\nTrabaja en un local de ropa, 8 horas de pie. Su madre tiene diabetes tipo 2. No fuma. Recibió la vacuna antigripal en junio; no tiene otras vacunas del embarazo registradas.\n\nExamen: TA 112/70, peso 82 kg con talla 1,62 m (IMC previo al embarazo 29), altura uterina 24 cm, latidos fetales 144 por minuto.",
[
Q("T","¿Qué edad gestacional tiene y cómo seguís el embarazo?","27 semanas por FUM y 26 semanas y 4 días por eco: la diferencia es < 5 días, se sigue por FUM","26 semanas y 4 días: siempre se sigue por la ecografía","27 semanas por FUM, pero se sigue por eco porque la diferencia es > 5 días","30 semanas por FUM","Por FUM: del 10/3 al 15/9 hay 189 días → 27 semanas. Por eco: del 10/5 al 15/9 hay 128 días (18 sem y 2 días) + 8 sem y 2 días = 26 sem y 4 días. Cuadernillo: si la diferencia entre eco y FUM es > 5 días se sigue por eco; si no, por FUM. La 1ª eco es la más importante porque mide el diámetro cefalocaudal."),
Q("T","¿Cuál es la fecha probable de parto?","17 de diciembre","3 de diciembre","17 de junio del año siguiente","10 de diciembre","Regla de Naegele (cuadernillo): FUM + 7 días − 3 meses (+ 1 año si hace falta): 10/3 + 7 = 17/3 → − 3 meses = 17/12."),
Q("E","La altura uterina es 24 cm. ¿Cómo la interpretás?","Acorde: lo esperable es 23 cm a las 26 semanas y 25 cm a las 28","Baja: a las 27 semanas debería medir 27 cm","Alta: sugiere macrosomía","No se mide hasta el tercer trimestre","Tabla del cuadernillo: 26 sem 23 cm; 28 sem 25; 30 sem 27; 32 sem 28; 34 sem 30; 36 sem 31; 38 sem 33; 40 sem 34. Se mide en cada control desde el 2° trimestre; si el crecimiento es inadecuado, pedir una ecografía."),
Q("S","¿Qué laboratorio corresponde entre las semanas 24 y 28?","Hemograma, VDRL, toxoplasmosis, PTOG, sedimento y urocultivo","Sólo glucemia en ayunas","TSH, prolactina y cortisol","El mismo laboratorio completo del primer control, con grupo y factor","Cuadernillo, 2° trimestre (24-28 semanas): hemograma completo, VDRL, toxoplasmosis, PTOG y sedimento con urocultivo. Por sus factores de riesgo (obesidad, madre con DBT2), si la PTOG fuera normal se repetiría entre las semanas 31 y 33."),
Q("T","¿Cómo se prepara para la PTOG?","Ayuno de 8-12 h, dieta libre con ≥ 150 g de hidratos los 3 días previos, 75 g de glucosa en 375 ml en 5 minutos, reposo y sin fumar, y extracción a las 2 h","Venir desayunada para no descompensarse","Dieta sin hidratos los 3 días previos","Caminar durante las 2 horas de espera","Condiciones del cuadernillo: a la mañana, con 8-12 h de ayuno; 3 o más días previos con dieta libre (mínimo 150 g de hidratos) y actividad habitual; sin corticoides ni beta-adrenérgicos ni infección en curso; 75 g de glucosa anhidra en 375 cm³ de agua, tomada en 5 minutos; reposo, sin fumar ni comer; extracción en ayunas y a las 2 h."),
Q("T","¿Qué diagnóstico tiene?","Diabetes gestacional","Prediabetes: hay que repetirla en 6 meses","PTOG normal","Diabetes tipo 1","Cuadernillo: DBT gestacional con 2 glucemias en ayunas > 100 mg/dl, PTOG a la hora > 180 mg/dl o PTOG a las 2 h > 140 mg/dl. Su valor a las 2 h (158) cumple el criterio.","PTOG: glucemia en ayunas 92 mg/dl; a las 2 h, 158 mg/dl."),
Q("PL","¿Qué incluye el plan de hoy?","Recategorizarla como embarazo de alto riesgo y derivar; vacuna triple bacteriana acelular; control odontológico; volver a calcular la EG y la FPP en cada control","Repetir la PTOG en 6 meses y controlar como bajo riesgo","Postergar las vacunas hasta después del parto","Indicar dieta muy restrictiva para no aumentar más de peso","Cuadernillo: la DBT gestacional es una patología del embarazo actual que lo vuelve de alto riesgo. La triple bacteriana acelular (dTpa) va desde la semana 20 (1 dosis) y la antigripal en cualquier momento (ya la tiene); control odontológico en el 1er y 3er trimestre. ⚠ El cuadernillo no detalla el tratamiento de la DBT gestacional (plan alimentario, automonitoreo, insulina); no hacer restricción energética.")
]);

C(1,"Carla, 31 años",
"Carla tiene 31 años y cursa su segundo embarazo, de 34 semanas. Su primer hijo nació por parto vaginal hace 3 años. Grupo 0 Rh positivo. El control del segundo trimestre fue normal, con PTOG normal. Ya recibió la triple bacteriana acelular a las 22 semanas y la antigripal.\n\nHoy refiere ardor retroesternal después de cenar, peor al acostarse, y calambres en las piernas a la noche. Percibe bien los movimientos del bebé. Tiene contracciones indoloras y aisladas.\n\nExamen: TA 114/72, altura uterina 30 cm, latidos fetales 138 por minuto, sin edemas.",
[
Q("A","¿Qué signos de alarma tiene que conocer antes de irse?","Pérdida de sangre, pérdida de líquido, contracciones cada 5 minutos durante 1 hora, disminución de los movimientos fetales y flujo fétido","Contracciones aisladas e indoloras","Pirosis después de cenar","Calambres nocturnos","Cuadernillo: la paciente no se va sin los signos de alarma: sangrado (urgencia), pérdida de líquido «como lavandina», contracciones cada 5 minutos durante 1 hora, que el bebé no se mueva por 2 horas, flujo fétido y TA ≥ 160/110 (en hipertensas: zumbidos, visión borrosa, cefalea intensa o dolor en la boca del estómago). Las contracciones de Braxton Hicks después de la semana 30 son esperables."),
Q("E","¿Cómo hacés las maniobras de Leopold?","Las tres primeras de frente a la paciente desde las semanas 20-22 y la cuarta de espaldas a ella desde la semana 28","Las cuatro de espaldas desde el primer trimestre","Sólo la cuarta, desde la semana 12","No se hacen en control de embarazo","Cuadernillo: maniobras 1, 2 y 3 de frente a partir de las semanas 20-22; la 4ª de espaldas a partir de la semana 28. Se suman a TA, peso, IMC, altura uterina (30 cm a las 34 semanas, acorde) y latidos fetales."),
Q("S","¿Qué estudios del tercer trimestre pedís?","Hemograma, glucemia, VDRL, VIH, toxoplasmosis, sedimento y urocultivo, hisopado para estreptococo del grupo B a las 35-37 semanas y la 3ª ecografía","Sólo una ecografía","PTOG otra vez, aunque fue normal y no tiene factores de riesgo","Coombs indirecta, por ser Rh positivo","Cuadernillo, 3er trimestre (32-36 semanas): hemograma, glucemia, VDRL, VIH, toxoplasmosis, sedimento y urocultivo; hisopado anal y vaginal para SGB entre las semanas 35 y 37; 3ª ecografía entre las 32 y 36."),
Q("T","¿Qué vacuna del tercer trimestre falta evaluar?","Vacuna contra el VSR (bronquiolitis) entre las semanas 32 y 36","Triple bacteriana acelular otra vez","BCG","Triple viral","Cuadernillo: dTpa desde la semana 20, antigripal en cualquier momento, hepatitis B si no está vacunada y vacuna contra el VSR entre las semanas 32 y 36 (32,0 a 36,6). El cuadernillo aclara que en ese momento no se conseguía."),
Q("P","¿Qué le indicás para la pirosis?","Comidas chicas y despacio, no acostarse hasta 4 h después de comer, elevar la cabecera, evitar café, mate y cítricos, y antiácido de hidróxido de magnesio con carbonato de calcio","Omeprazol como primera línea","Acostarse enseguida después de cenar","Bicarbonato de sodio todos los días","Cuadernillo: la pirosis es frecuente en el último trimestre (el útero comprime el estómago y baja el tono del esfínter). Medidas higiénico-dietéticas y antiácido (hidróxido de magnesio y carbonato de calcio); 2ª línea metoclopramida o IBP, con datos limitados."),
Q("P","¿Qué le recomendás para los calambres nocturnos?","Más hidratación, calor si el músculo está tenso o hielo si duele mucho, y elongación apoyando los pies y empujando el cuerpo hacia la pared","Reposo absoluto en cama","Quinina","Suspender el hierro","Cuadernillo: los calambres son frecuentes en la 2ª mitad del embarazo, de noche, por enlentecimiento del retorno venoso. Recomendar hidratación, calor o hielo, y el ejercicio de elongación (20 segundos, 3 veces por día)."),
Q("PL","Pregunta qué método anticonceptivo puede usar mientras amamanta. ¿Qué le explicás?","DIU o ligadura en el posparto inmediato, o progestágeno solo desde el inicio; la lactancia no alcanza como único método y conviene el preservativo","Con lactancia exclusiva no necesita ningún método hasta los 6 meses","Anticonceptivos combinados desde el día del parto","Implante el mismo día como única opción","Cuadernillo: la lactancia exclusiva no es 100 % efectiva: usar siempre preservativo. Ligadura o DIU inmediatamente después del parto; ACO de progestina sola desde el inicio; combinados a partir del mes. ⚠ Los criterios de elegibilidad de la OMS no recomiendan los anticonceptivos combinados antes de las 6 semanas en mujeres que amamantan, y desaconsejan su uso hasta los 6 meses.","Se acerca el parto y Carla quiere organizarse.")
]);

C(1,"Belén, 33 años",
"Belén tiene 33 años y cursa un embarazo único de 33 semanas. Consulta porque hace 10 días tiene mucha picazón en las palmas de las manos y en las plantas de los pies, sobre todo de noche; casi no duerme. No cambió de jabón ni de cremas. Nadie en la casa tiene picazón.\n\nNo tuvo fiebre. Los controles previos fueron normales. Toma hierro y nada más.\n\nExamen: TA 116/74, escoriaciones por rascado en palmas y plantas, sin pápulas, vesículas ni surcos. Escleras anictéricas. Abdomen con útero acorde, latidos fetales 140 por minuto.",
[
Q("A","¿Qué preguntás en el interrogatorio?","Color de la orina, características de las deposiciones, náuseas o vómitos y dolor en el hipocondrio derecho","Si tiene mascotas con sarna, como único dato","Si usa anteojos","Antecedente de varicela","Cuadernillo, colestasis gravídica: interrogar coluria, hipocolia (catarsis), náuseas, vómitos y dolor en el hipocondrio derecho. Aparece en el 3er trimestre y resuelve después del parto."),
Q("E","¿Qué buscás en el examen?","Ictericia, lesiones primarias de piel que orienten a otra dermatosis y el examen abdominal","Reflejos osteotendinosos","Adenopatías cervicales","Fondo de ojo","Cuadernillo: el prurito de la colestasis no tiene lesiones primarias, sólo escoriaciones por rascado; buscar ictericia (25 % de los casos, unas 2 semanas después del prurito) y examinar el abdomen. Sin surcos ni convivientes con prurito, la escabiosis es menos probable."),
Q("S","¿Qué laboratorio pedís?","Ácidos biliares, transaminasas, bilirrubina total y directa, FAL, colesterol y triglicéridos, coagulograma, HBsAg, VHC, amilasa y lipasa","Sólo un hemograma","TSH y T4 libre","Hemocultivos","Laboratorio del cuadernillo para el prurito palmoplantar del embarazo: ácidos biliares, transaminasas, BT, BD, FAL, colesterol, TG, coagulograma, HBsAg, VHC, amilasa y lipasa. La esteatorrea puede alterar la absorción de vitamina K."),
Q("T","¿Cuál es la gravedad y dónde se trata?","Leve: ambulatorio","Moderada: internación","Severa: internación inmediata","No es colestasis con ese valor","Cuadernillo: leve con ácidos biliares de 10-39 µmol/L (ambulatorio); moderada 40-99 (ambulatorio; internación si es gemelar); severa > 100 (internación).","Ácidos biliares 28 µmol/L, transaminasas levemente elevadas, bilirrubina y coagulograma normales."),
Q("P","¿Qué tratamiento indicás?","Ácido ursodesoxicólico 300 mg c/8 h (máx. 2000 mg/día) hasta el parto, y difenhidramina 50 mg c/8 h para el prurito nocturno","Corticoides tópicos de alta potencia","Permetrina 5 % a toda la familia","Colestiramina sin ningún otro fármaco","Cuadernillo: el objetivo es tratar el prurito. Ácido ursodesoxicólico 300 mg c/8 h (máx. 2000 mg), hasta el parto o hasta que desaparezcan los síntomas y bajen los ácidos biliares; difenhidramina 50 mg c/8 h VO, con efecto sedante nocturno."),
Q("PL","¿Cómo la seguís?","Ácidos biliares semanales, control de los movimientos fetales por la paciente y recategorizar el riesgo en cada control","Control recién en el puerperio","Sólo cuando aparezca ictericia","Laboratorio mensual sin otras indicaciones","Cuadernillo: ácidos biliares semanales, la paciente controla los movimientos fetales y se recategoriza el riesgo para decidir si se mantiene o suspende el tratamiento. La colestasis gravídica figura entre las hepatopatías del embarazo que lo vuelven de alto riesgo.")
]);

C(1,"Tatiana, 37 años",
"Tatiana tiene 37 años y es hipertensa desde hace 4 años; toma enalapril 10 mg c/12 h. Consulta porque tiene un test de embarazo positivo; la FUM fue hace 8 semanas. Es su segundo embarazo: el primero, hace 12 años, terminó en un parto a término sin complicaciones. No planificaba el embarazo, pero está contenta.\n\nNo fuma. IMC 30. Su madre tuvo preeclampsia.\n\nExamen: TA 146/94 y 144/92 en dos tomas, mismo brazo, separadas por 15 minutos. Resto normal.",
[
Q("A","¿Qué antecedentes preguntás para decidir la aspirina?","ERC, HTA en un embarazo previo, LES, DBT, embarazo gemelar, RCIU previo, intervalo entre embarazos, IMC y antecedentes familiares de preeclampsia","Antecedentes de varicela","Si toma mate","Si tiene caries","Cuadernillo: AAS si cumple al menos 1 criterio (ERC, HTA en embarazo previo, LES, DBT, HTA crónica, embarazo gemelar, antecedente de RCIU) o al menos 2 (primigesta, > 35 años, intervalo > 10 años entre gestaciones, IMC ≥ 35, antecedentes familiares de preeclampsia, embarazo múltiple). Tatiana tiene HTA crónica, que alcanza sola."),
Q("P","¿Qué hacés con el enalapril?","Suspenderlo y cambiar a labetalol 200 mg c/8 h (máx. 400 mg c/6 h)","Mantenerlo: ya está controlada","Agregar losartán","Cambiarlo por hidroclorotiazida","Cuadernillo: en la primera visita se cambia el antihipertensivo contraindicado en la gestación (IECA, ARA II, diuréticos); 1ª línea labetalol 200 mg c/8 h VO, máximo 400 mg c/6 h; antes de la dosis máxima se prueba agregar otro fármaco. El Consenso FASGO 2025 también indica suspender IECA, ARA II, espironolactona y atenolol, y usar labetalol, alfametildopa, nifedipina de liberación prolongada o amlodipina."),
Q("P","¿Cómo indicás la aspirina?","Según el cuadernillo, 75-100 mg/día a la noche, desde antes de la semana 16 (de preferencia desde la 8) hasta la 36; el Consenso FASGO 2025 propone 150 mg a la noche de la semana 12 a la 36","325 mg/día durante todo el embarazo","Recién desde la semana 28","Sólo si aparece proteinuria","Cuadernillo: AAS 75-100 mg/día antes de dormir, desde antes de la semana 16 (preferentemente desde la 8) hasta la 36, para que no tenga efecto antiagregante en el parto. El Consenso FASGO 2025 indica 150 mg a la noche de las 12 a las 36 semanas en embarazadas de alto riesgo. Las dos fuentes difieren en dosis e inicio: conviene conocer ambas."),
Q("S","¿Qué estudios agregás a la rutina del primer trimestre?","Transaminasas, creatinina, relación albúmina/creatinina en orina y ECG de 12 derivaciones","TC de cerebro","Ecocardiograma de rutina a todas","Sólo una glucemia","Cuadernillo, HTA crónica en el embarazo: al laboratorio del trimestre se suman transaminasas, creatinina y relación albuminuria/creatinuria, y se pide un ECG de 12 derivaciones."),
Q("T","¿Cada cuánto controlás la TA?","Semanalmente","Una vez por trimestre","Sólo en los 5 controles de bajo riesgo","No hace falta si toma labetalol","Cuadernillo: en la HTA crónica no controlada en el embarazo, control semanal de la TA. Además la TA se toma en todas las consultas de cualquier embarazada (promedio normal 116 ± 12 / 70 ± 7)."),
Q("PR","¿Cómo problematizás?","Embarazo de 8 semanas de alto riesgo: HTA crónica no controlada, tratamiento con IECA (contraindicado), edad > 35 años, intervalo > 10 años, obesidad y antecedente familiar de preeclampsia","Embarazo de bajo riesgo con TA algo elevada","HTA gestacional","Preeclampsia","Cuadernillo: la HTA crónica es una patología materna previa que define alto riesgo; se suman la edad > 35 años y la obesidad entre los factores sociodemográficos. La hipertensión gestacional y la preeclampsia aparecen después de las 20 semanas.")
]);

M("157-4","Ayuno de 8-12 h|Dieta libre con ≥ 150 g de hidratos los 3 días previos|75 g de glucosa en 375 ml, tomados en 5 minutos|Reposo y sin fumar durante la prueba|Extracción en ayunas y a las 2 h","Venir desayunada|Dieta sin hidratos los días previos|Caminar durante la espera");
M("157-6","Recategorizarla como alto riesgo y derivar|Vacuna triple bacteriana acelular|Control odontológico|Calcular EG y FPP en cada control","Repetir la PTOG en 6 meses|Dieta muy restrictiva");
M("158-0","Pérdida de sangre|Pérdida de líquido|Contracciones cada 5 minutos durante 1 hora|Disminución de los movimientos fetales|Flujo fétido","Contracciones aisladas e indoloras|Calambres nocturnos");
M("158-2","Hemograma y glucemia|VDRL y VIH|Toxoplasmosis|Sedimento y urocultivo|Hisopado para estreptococo del grupo B (35-37 semanas)|Ecografía del 3er trimestre","PTOG otra vez sin factores de riesgo|Coombs indirecta");
M("158-4","Comidas chicas y despacio|No acostarse hasta 4 h después de comer|Elevar la cabecera|Evitar café, mate y cítricos|Antiácido de hidróxido de magnesio y carbonato de calcio","Omeprazol como primera línea|Acostarse enseguida después de cenar");
M("158-6","DIU o ligadura en el posparto inmediato|Progestágeno solo desde el inicio|Preservativo además de la lactancia","Lactancia exclusiva como único método|Combinados desde el día del parto");
M("159-0","Color de la orina|Características de las deposiciones|Náuseas o vómitos|Dolor en el hipocondrio derecho","Si usa anteojos|Antecedente de varicela");
M("159-1","Ictericia|Lesiones primarias de piel|Examen abdominal","Reflejos osteotendinosos|Fondo de ojo");

M("159-4","Ácido ursodesoxicólico 300 mg c/8 h|Difenhidramina 50 mg c/8 h","Corticoides tópicos de alta potencia|Permetrina 5 % a toda la familia");
M("159-5","Ácidos biliares semanales|Control de movimientos fetales por la paciente|Recategorizar el riesgo en cada control","Control recién en el puerperio|Esperar a que aparezca ictericia");
M("160-0","Enfermedad renal crónica|HTA en un embarazo previo|LES o DBT|Embarazo gemelar o RCIU previo|IMC y antecedentes familiares de preeclampsia","Antecedentes de varicela|Si toma mate");
M("160-3","Transaminasas|Creatinina|Relación albúmina/creatinina en orina|ECG de 12 derivaciones","TC de cerebro|Ecocardiograma de rutina");
M("160-5","Embarazo de alto riesgo|HTA crónica no controlada|Tratamiento con IECA (contraindicado)|Edad > 35 años|Obesidad y antecedente familiar de preeclampsia","HTA gestacional|Preeclampsia");
