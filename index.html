<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Casos de Medicina Familiar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Shrikhand&family=Gloock&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: hoja de evolución clínica — índice de secciones a la izquierda, casos como fichas apiladas a la derecha */
:root{
  --bg:#E8E6E1; --card:#F7F6F3; --fg:#1F2430; --muted:#5A6070; --line:#D3D0C8; --soft:#EFEDE8;
  --accent:#556B2F; --accent-ink:#ffffff; --accent-soft:#E2E8D2;
  --g1:#6B7B3A; --g2:#F2B48A; --g3:#A7B77F; --g4:#E8C46A;
  --ok:#1d7a3e; --ok-soft:#dfecd9; --bad:#b3261e; --bad-soft:#f1dcd3; --warn:#8a5a00;
  --f-sans:"Fredoka",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-display:"Gloock",Georgia,"Times New Roman",serif;
  --f-serif:var(--f-sans);
  --f-big:"Shrikhand",var(--f-display);
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px; color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#000000; --card:#121410; --fg:#E8EADF; --muted:#A3A795; --line:#2B2F24; --soft:#1A1D15;
  --accent:#B4C47A; --accent-ink:#000000; --accent-soft:#232A17;
  --g1:#3F4A1F; --g2:#5A3A22; --g3:#2F3A1E; --g4:#4A3F18;
  --ok:#6fd38f; --ok-soft:#12301d; --bad:#f08a80; --bad-soft:#3a1715; --warn:#e2b257; color-scheme:dark}
:root[data-theme="dark"] .mcard:hover{box-shadow:none}
:root[data-theme="dark"] .tag.A,:root[data-theme="dark"] .tag.E,:root[data-theme="dark"] .tag.S,:root[data-theme="dark"] .tag.PR,:root[data-theme="dark"] .tag.PL,:root[data-theme="dark"] .tag.C{color:color-mix(in oklab,var(--c) 45%,var(--fg));background:color-mix(in oklab,var(--c) 22%,var(--card))}
:root[data-theme="dark"] .sec-head .num{color:color-mix(in oklab,var(--c) 45%,var(--fg))}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-sans);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;flex-direction:column;min-width:0;flex:1 1 200px}
.brand h1{font-family:var(--f-serif);font-weight:600;font-size:1.25rem;margin:0;text-wrap:balance}
.brand span{font-size:.8rem;color:var(--muted)}
.meter{display:flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{width:100px;height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.tbtn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:.85rem}
.tbtn:hover{border-color:var(--accent)}
.tbtn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:270px minmax(0,1fr);gap:28px;align-items:start}
nav.idx{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
.idx h2{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:600}
.idx ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.idx button{width:100%;display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;border:0;background:transparent;padding:5px 8px;line-height:1.25;border-radius:8px;cursor:pointer;font-size:.88rem}
.idx button:hover{background:var(--soft)}
.idx button[aria-current="true"]{background:var(--accent-soft);font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.cnt{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.chips{display:none}
main{min-width:0}
.sec-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:10px 16px;border-bottom:3px solid var(--c);padding-bottom:10px;margin-bottom:16px}
.sec-head h2{font-family:var(--f-serif);font-size:1.6rem;margin:0;font-weight:600;text-wrap:balance}
.sec-head .num{font-family:var(--f-mono);font-size:.8rem;color:color-mix(in oklab,var(--c) 65%,var(--fg));display:block;font-weight:500}
.filters{display:flex;gap:8px;align-items:center;font-size:.85rem;color:var(--muted)}
.filters label{display:flex;gap:6px;align-items:center;cursor:pointer}
.ref{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-bottom:16px;display:flex;flex-direction:column;gap:10px}
.ref h3{margin:0;font-family:var(--f-serif);font-size:1.1rem}
.ref p{margin:0;max-width:75ch;font-size:.92rem}
.ref .formula{font-family:var(--f-mono);font-size:.85rem;background:var(--soft);padding:8px 10px;border-radius:6px}
.ref .tw{overflow-x:auto}
.ref table{border-collapse:collapse;font-size:.85rem;min-width:640px;width:100%}
.ref th,.ref td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.ref th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.ref td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.ref small{color:var(--muted);font-size:.8rem}
.dosebar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:16px;color:var(--muted);font-size:.9rem}
.dmodal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgb(0 0 0 / .45);animation:fadeIn .25s ease-out}
.dmodal[hidden]{display:none!important}
.dmodal .dbox{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:14px;max-width:880px;width:100%;max-height:min(88vh,900px);overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px;animation:inUp .35s cubic-bezier(.2,.8,.3,1) both;box-shadow:0 18px 50px rgb(0 0 0 / .25)}
.dmodal .dhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dmodal h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:1.4rem}
.dmodal .formula{font-family:var(--f-mono);font-size:.82rem;background:var(--soft);padding:8px 10px;border-radius:6px}
.dmodal .tw{overflow-x:auto}
.dmodal table{border-collapse:collapse;font-size:.85rem;min-width:600px;width:100%}
.dmodal th,.dmodal td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.dmodal th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.dmodal td.n{font-family:var(--f-mono);white-space:nowrap}
.dmodal small{color:var(--muted);font-size:.8rem}

.cases{display:flex;flex-direction:column;gap:12px}
section.fam{margin:0 0 16px}
.famh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:4px 4px 10px;border-bottom:2px solid color-mix(in oklab,var(--c) 40%,var(--line));margin-bottom:12px}
.famh .num{font:600 11px/1.2 "JetBrains Mono",monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.famh h3{font-family:Gloock,serif;font-weight:400;font-size:1.5rem;margin:4px 0 2px}
.famh p{margin:0;font-size:.9rem;opacity:.75}
.famc{font:600 12px/1 "JetBrains Mono",monospace;white-space:nowrap;padding:6px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.famcases{display:flex;flex-direction:column;gap:10px}
#cases>section.fam{animation:inUp 0.64s cubic-bezier(.2,.8,.3,1) both}
#cases>section.fam:nth-child(2){animation-delay:0.08s}#cases>section.fam:nth-child(3){animation-delay:0.16s}#cases>section.fam:nth-child(n+4){animation-delay:0.22s}
details.case{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
details.case[open]{border-color:color-mix(in oklab,var(--c) 45%,var(--line))}
summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 16px}
summary::-webkit-details-marker{display:none}
.pt{display:flex;align-items:baseline;gap:10px;min-width:0;flex-wrap:wrap}
.pt b{font-family:var(--f-serif);font-size:1.08rem;font-weight:600}
.pt small{color:var(--muted);font-size:.82rem;overflow:hidden;text-overflow:ellipsis}
.pill{font-family:var(--f-mono);font-size:.75rem;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.pill.done{background:var(--ok-soft);color:var(--ok)}
.pill.mid{background:var(--accent-soft);color:var(--accent)}
.pill.low{background:var(--bad-soft);color:var(--bad)}
.body{padding:0 16px 18px;display:flex;flex-direction:column;gap:18px}
.hc{border-left:3px solid var(--c);background:var(--soft);padding:12px 14px;border-radius:0 8px 8px 0}
.hc .lbl{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px}
.hc p+p{margin-top:.7em}
.evo{border-left:3px dashed var(--c);padding:8px 14px;background:color-mix(in oklab,var(--c) 7%,var(--card));border-radius:0 8px 8px 0}
.evo .lbl{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:2px}
.evo p{margin:0;font-family:var(--f-serif);font-size:1rem;line-height:1.55;max-width:70ch}
.step{display:flex;flex-direction:column;gap:10px}
.lock{color:var(--muted);font-size:.88rem;border:1px dashed var(--line);border-radius:8px;padding:10px 12px}
.hc p{margin:0;font-family:var(--f-serif);font-size:1.02rem;line-height:1.6;max-width:70ch}
figure{margin:0;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--card)}
figure .scroll{overflow-x:auto}
figcaption{font-size:.8rem;color:var(--muted);margin-top:6px}
.q{display:flex;flex-direction:column;gap:8px}
.qh{display:flex;gap:10px;align-items:baseline}
.rep{margin-left:auto;flex:none;font-size:.75rem;color:var(--muted);text-decoration:none;border:1px solid transparent;border-radius:6px;padding:1px 6px;white-space:nowrap}
.rep:hover{color:var(--bad);border-color:var(--line)}
.tag.upd{background:color-mix(in oklab,var(--warn) 18%,var(--card));color:color-mix(in oklab,var(--warn) 85%,var(--fg));cursor:help}
.updlist{display:flex;flex-direction:column;gap:12px}
.gcard{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:10px;padding:14px 16px}
.gcard h3{margin:0 0 2px;font-size:1.05rem}
.gcard .gmeta{font-size:.8rem;color:var(--muted);margin-bottom:8px}
.gcard ul{margin:6px 0 8px;padding-left:20px}
.gcard li{margin:3px 0}
.gcases{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.gcases button{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:3px 10px;font-size:.8rem;cursor:pointer;color:var(--fg)}
.gcases button:hover{border-color:var(--accent)}
.updlink{margin-top:18px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:.9rem;color:var(--muted)}
#acctWrap{display:inline-flex;align-items:center;gap:6px}
#acctWrap:empty{display:none}
.acct{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:.85rem;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.acct:hover{border-color:var(--accent)}
.acct .av{width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:inline-grid;place-items:center;font-size:.72rem;font-weight:600}
.sst{font-size:.75rem;color:var(--muted);white-space:nowrap}
.sst.err{color:var(--bad)}
.syncnote{margin-top:14px;font-size:.9rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pfoot{max-width:980px;margin:0 auto;padding:0 16px 40px;text-align:center;font-size:.85rem}
.pfoot a{color:var(--muted)}
.pfoot a:hover{color:var(--accent)}
.qn{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);flex:none}
.qt{font-weight:600;max-width:72ch}
.tag{font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;font-weight:600;padding:2px 7px;border-radius:4px;margin-left:6px;vertical-align:2px;white-space:nowrap}
.tag.T{background:var(--soft);color:var(--muted)}
.tag.P{background:var(--accent-soft);color:var(--accent)}
.tag.A,.tag.E,.tag.S,.tag.PR,.tag.PL,.tag.C{background:color-mix(in oklab,var(--c) 14%,var(--card));color:color-mix(in oklab,var(--c) 70%,var(--fg))}
.opts{display:flex;flex-direction:column;gap:6px;padding-left:30px}
.opt{display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 12px;cursor:pointer;line-height:1.4}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .k{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.opt[disabled]{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .k{color:var(--ok);font-weight:600}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .k{color:var(--bad);font-weight:600}
.opt.dim{opacity:.6}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.multi .k::before{content:"";display:inline-block;width:12px;height:12px;border:1.5px solid currentColor;border-radius:3px;margin-right:4px;vertical-align:-1px}
.opt.multi.sel .k::before{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--card)}
.opt.multi{grid-template-columns:40px minmax(0,1fr)}
.opt.miss{border:1px dashed #C77700;background:color-mix(in oklab,#C77700 10%,var(--card))}
.opt.miss .k{color:#C77700;font-weight:600}
.opt .fl{font-size:.72rem;font-weight:600;color:#C77700;margin-left:6px;text-transform:uppercase;letter-spacing:.04em}
.mode{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.mode button{border:0;background:transparent;padding:6px 12px;font-size:.85rem;cursor:pointer;color:var(--muted)}
.mode button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.dta{width:100%;min-height:110px;resize:vertical;font:inherit;font-size:.95rem;line-height:1.45;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg)}
.dta:focus{outline:2px solid var(--accent);outline-offset:1px}
.dans{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--soft);white-space:pre-wrap;font-size:.93rem}
.dans.empty{color:var(--muted);font-style:italic}
.clh{font-size:.82rem;font-weight:600;color:var(--muted);margin-top:4px}
.mhint{padding-left:30px;font-size:.82rem;color:var(--muted);margin:-2px 0 2px}
.conf{align-self:flex-start}
.conf[disabled]{opacity:.5;cursor:default}
.exp{margin-left:30px;font-size:.9rem;border-radius:8px;padding:9px 12px;background:var(--soft);max-width:78ch}
.exp b{display:block;margin-bottom:2px}
.exp.ok b{color:var(--ok)} .exp.bad b{color:var(--bad)}
.foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;border-top:1px dashed var(--line);padding-top:12px}
.score{font-family:var(--f-mono);font-size:.85rem;color:var(--muted)}
.wrap{grid-template-columns:minmax(0,1fr)!important;max-width:980px}
nav.idx,.chips{display:none!important}
.brand h1{cursor:pointer}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:14px;font-size:.88rem;color:var(--muted)}
.back{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:.88rem;color:var(--fg)}
.back:hover{border-color:var(--accent)}
.crumbs .lnk{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer;font-size:.88rem}
.vhead{margin:4px 0 18px}
.vhead h2{font-family:var(--f-serif);font-size:1.7rem;margin:0 0 4px;font-weight:600;text-wrap:balance}
.vhead p{margin:0;color:var(--muted);max-width:70ch}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:16px}
.mcard{display:flex;flex-direction:column;gap:10px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:20px;cursor:pointer;color:var(--fg);font:inherit}
.mcard:hover{border-color:var(--accent);box-shadow:0 2px 10px rgb(0 0 0 / .06)}
.mcard h3{font-family:var(--f-serif);font-size:1.35rem;margin:0;font-weight:600}
.mcard p{margin:0;color:var(--muted);font-size:.92rem;line-height:1.45}
.mcard .stat{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums}
.mcard .go{align-self:flex-start;margin-top:4px}
.mbar{flex:1;height:6px;border-radius:3px;background:var(--soft);overflow:hidden}
.mbar i{display:block;height:100%;background:var(--accent)}
.secs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:10px}
.scard{display:grid;grid-template-columns:12px minmax(0,1fr);gap:4px 10px;align-items:start;text-align:left;border:1px solid var(--line);border-left:4px solid var(--c);background:var(--card);border-radius:10px;padding:12px 14px;cursor:pointer;font:inherit;color:var(--fg)}
.scard:hover{border-color:var(--c);border-left-color:var(--c)}
.scard .dot{margin-top:5px}
.scard b{font-weight:600;line-height:1.3}
.scard .stat{grid-column:2;font-family:var(--f-mono);font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.scard .mbar i{background:var(--c)}
body[data-v="cases"] .top{border-bottom:3px solid var(--accent)}
body[data-v="home"] .meter,body[data-v="home"] #rnd,body[data-v="home"] #resetWrap,body[data-v="upd"] .meter,body[data-v="upd"] #rnd,body[data-v="upd"] #resetWrap{display:none}
.thm{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:.85rem;white-space:nowrap}
.thm:hover{border-color:var(--accent)}
.note{font-size:.8rem;color:var(--muted);margin-top:28px;max-width:75ch}
.empty{color:var(--muted);padding:24px;text-align:center;border:1px dashed var(--line);border-radius:var(--r)}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:.85rem;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:.85rem}
@media (max-width:860px){
  .top{position:static}
  .wrap{grid-template-columns:minmax(0,1fr);gap:14px}
  nav.idx{display:none}
  .chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin:0 0 6px}

Q("P","Con 62 kg, ¿cuántos comprimidos de la cuádruple asociación toma en la fase intensiva?","4 comprimidos","2 comprimidos","3 comprimidos","5 comprimidos","Pautas técnicas de TB 2026 (tabla 5): cuádruple HRZE 75/150/400/275 mg → 30-34 kg 2 comp; 35-39 kg 2,5; 40-54 kg 3; ≥ 55 kg 4. Doble HR 150/300 mg en la 2ª fase: 1; 1,5; 1,5 y 2 comprimidos. (El cuadernillo usaba < 40, 40-55 y > 55 kg.)"),
Q("T","¿Cómo se toman?","Una toma diaria, todos los días, en ayunas o alejada de las comidas","Con las comidas","Repartidos c/8 h","Sólo los días hábiles con leche","Pautas técnicas de TB 2026: esquema diario (60 tomas en la fase inicial y 120 en la de continuación). HR se absorbe peor con alimentos, sobre todo grasos: tomarla en ayunas o lejos de las comidas, y al menos 1 h antes de antiácidos. (El cuadernillo decía diario salvo domingos, ≥ 2 h después de comer y 1 h antes de volver a comer.)"),
Q("P","¿Qué hacés con su hija de 4 años (contacto, sin enfermedad activa)?","Tratamiento preventivo (TPT) sin importar la PPD, de preferencia 3HR: isoniacida + rifampicina por 3 meses","Nada si está asintomática y la PPD es negativa","Esquema completo 2HRZE/4HR","BCG de refuerzo","Pautas técnicas de TB 2026: los contactos menores de 5 años reciben TPT independientemente de la PPD, una vez descartada TB activa, preferentemente 3HR (H 10 mg/kg/día y R 10 mg/kg/día, con formulaciones pediátricas dispersables); alternativas 6H (6-9 meses) o 4R. Suplementar con piridoxina los esquemas con H. Si no tuviera BCG, vacunarla al terminar. (El cuadernillo indicaba isoniacida 10 mg/kg/día por 6 meses.)"),
Q("T","¿Cuándo se pide baciloscopia de control?","Al final del 2° mes; si sigue expectorando, también al 4° mes y al final (6°)","Mensual","Sólo al final","No se controla","Pautas técnicas de TB 2026: baciloscopia al final del 2° mes (se negativiza en ~90 %); si continúa expectorando, repetir en el 4° mes y al final. Positiva al 2° mes con buena adherencia → predictor de fracaso: pedir prueba molecular rápida, cultivo y pruebas de sensibilidad. Positiva al final del 4° mes = fracaso. Además, control clínico mensual y Rx al inicio, al final de la fase intensiva y al terminar.")
]);

C(4,"Norma, 58 años",
"Placa roja, caliente y dolorosa en la pierna izquierda, de bordes netos y sobreelevados, de 2 días, con fiebre de 38 °C. Tiene intertrigo micótico entre los dedos. Sin necrosis, ampollas ni dolor desproporcionado. Sin alergias.",
[
Q("T","¿Cuál es el diagnóstico más probable?","Erisipela","Fascitis necrotizante","Absceso","Trombosis venosa profunda","Placa eritematosa, brillante, de bordes netos y sobreelevados, con puerta de entrada (intertrigo): erisipela. Sin compromiso sistémico es un cuadro leve, de manejo ambulatorio (Guía SADI de IPPB 2025)."),
Q("P","¿Qué antibiótico indicás?","Cefalexina 500-1000 mg c/6 h VO por 5-7 días, reevaluando a las 48-72 h","Penicilina benzatínica 2.400.000 UI IM única","Ciprofloxacina 5 días","TMS 3 días","Guía SADI de IPPB 2025: erisipela o celulitis leve (sin compromiso sistémico) → cefalosporina de 1ª generación (cefalexina o cefadroxilo), 5-7 días. Marcar el borde con un marcador y reevaluar a las 48-72 h; si no responde o hay factores de riesgo de SAMR, agregar TMS o doxiciclina/minociclina. No se recomienda penicilina benzatínica (más fracasos) ni fluoroquinolonas. (El cuadernillo indicaba penicilina V 1.000.000 UI c/6 h por 10 días.)"),
Q("P","¿Qué medida general agregás?","Reposo con el miembro elevado y tratar la micosis interdigital","Vendaje compresivo apretado sin elevar","Compresas calientes","Inmovilización con yeso","General: reposo con miembro elevado; tratar micosis, linfedema o insuficiencia venosa (puertas de entrada). Para evitar recurrencias, la Guía SADI de IPPB 2025 agrega compresión elástica (fuera del episodio agudo) y descenso de peso en obesos; 2 o más episodios en 6 meses = recurrente."),
Q("T","¿Cuál es signo de alarma de infección necrotizante?","Dolor desproporcionado, bullas hemorrágicas, crepitación o color azul-purpúrico","Bordes netos","Fiebre de 38 °C","Calor local","Alarma: compromiso sistémico o sensorio, dolor desproporcionado, hipoestesia, progresión bajo ATB, bullas hemorrágicas, crepitación, necrosis."),
Q("P","Si fuera alérgica a betalactámicos, ¿qué usarías para la erisipela?","Clindamicina 300 mg c/6-8 h VO, confirmando que la alergia sea real","Amoxicilina-clavulánico","Cefalexina igual, aunque haya tenido anafilaxia","Nada","Guía SADI de IPPB 2025: con alergia a betalactámicos, clindamicina (300 mg c/6-8 h VO); la alergia a penicilina debe estar adecuadamente documentada. (El cuadernillo proponía azitromicina 500 mg el día 1 y 250 mg 4 días, o claritromicina.)")
]);

// Sección 5: Factores de riesgo cardiovascular y ECNT
C(5,"Miguel, 48 años",
"Tres controles con TA promedio 156/96. Sin DBT, sin enfermedad renal ni cardiovascular. RCV 12 %. IMC 29. Come con mucha sal y toma 4 vasos de vino por día. Sedentario.",
[
Q("T","Con la HTA confirmada, ¿inicia fármacos?","Sí, desde el diagnóstico: dos antihipertensivos a dosis bajas, junto con los cambios de hábitos","No todavía: 3 a 6 meses de cambios de hábitos por ser estadio 1 sin daño de órgano blanco","Sí, con un solo fármaco a dosis media","No: sólo si supera 180/120","GPC Nacional de HTA 2026: ante el diagnóstico de HTA no se demora el tratamiento farmacológico; se inicia con dos antihipertensivos a dosis bajas (preferir una toma diaria o combinación en una píldora), además de los cambios de hábitos. Tampoco se retrasa por esperar los estudios de daño de órgano blanco. El cuadernillo indicaba iniciar fármacos en estadio 1 sólo con DOB, ECV, DBT, ERC o RCV ≥ 20 %."),
Q("P","¿Cuál es la indicación de sal?","Hasta 5 g de sal por día (2000 mg de sodio)","Eliminar toda la sal","5 g de sodio por día","No restringir si toma la medicación","GPC Nacional de HTA 2026: alimentación reducida en sodio, 5 g de sal por día = 2000 mg de sodio. En Argentina el consumo supera los 10 g/día, y el 70 % es sal oculta de alimentos industrializados: preferir frescos, cocinar sin sal, sacar el salero y evitar caldos y saborizantes. (El cuadernillo decía < 2 g de sodio ≈ 6 g de sal.)"),
Q("T","¿Qué le indicás sobre el alcohol?","Limitarlo al menor consumo posible y nunca más de 2 UBE/día en hombres","Hasta 3 UBE/día es seguro en hombres","Puede seguir: el vino tinto protege el corazón","Hasta 5 UBE/día si no maneja","GPC Nacional de HTA 2026: limitar al menor consumo posible, nunca más de 1 UBE/día en mujeres y 2 en hombres; en quien no toma, no alentar el inicio. Una UBE (12-14 g de alcohol) = 1 lata de cerveza de 330 ml o media copa de vino (140 ml): sus 4 vasos de vino superan ampliamente el límite. Rastreo con AUDIT-C (positivo ≥ 5 en hombres, ≥ 4 en mujeres). (El cuadernillo decía < 3 UBE en hombres y < 2 en mujeres.)"),
Q("T","¿Cuándo evaluás si hay que intensificar?","A las 4 semanas: controles mensuales hasta alcanzar la meta","A los 3 días","A la semana","A los 6 meses","GPC Nacional de HTA 2026: visitas de seguimiento mensuales hasta alcanzar la meta; si al mes sigue fuera de meta, se pasa al paso siguiente del protocolo. Hasta entonces, reforzar adherencia y hábitos."),
Q("P","¿Qué hacés según el protocolo de la vía clínica?","Paso 2: losartán 50 mg + amlodipina 5 mg en una toma diaria","Seguir igual 6 meses más","Agregar enalapril al losartán","Cambiar a atenolol solo","GPC Nacional de HTA 2026 (vía clínica): paso 1 losartán 25 + amlodipina 2,5; paso 2 losartán 50 + amlodipina 5; paso 3 losartán 100 + amlodipina 10; paso 4 sumar hidroclorotiazida 25 mg, todo en una toma diaria. Antes de intensificar, siempre evaluar adherencia y efectos adversos. No asociar IECA con ARA II (falla renal, hiperkalemia). Derivar si no alcanza la meta con 3 fármacos a dosis altas.")
]);

C(5,"Elena, 62 años",
"Hipertensa recién diagnosticada: TA 168/98 en varias tomas. Creatinina normal, sin proteinuria. No tiene DBT. Toma ibuprofeno por artrosis algunos días.",
[
Q("P","¿Con qué esquema iniciás el tratamiento?","Dos fármacos a dosis bajas: IECA o ARA II + amlodipina (o + tiazida)","Tiazida o amlodipina sola, por tener ≥ 55 años","Atenolol + tiazida como primera opción","Enalapril + losartán","GPC Nacional de HTA 2026: iniciar con dos antihipertensivos a dosis bajas, sin importar la edad. Opciones preferenciales: IECA o ARA II + AC-D (amlodipina) o + tiazida. Opciones con BB (BB + AC-D, IECA o ARA II) y menos utilizadas (BB + tiazida, AC-D + tiazida). Nunca IECA + ARA II. (El cuadernillo seguía el criterio por edad: ≥ 55 años tiazida o BC en monoterapia.) Además, conviene que suspenda el ibuprofeno."),
Q("P","¿Qué dosis corresponde al paso 1 de la vía clínica?","Losartán 25 mg + amlodipina 2,5 mg, una toma diaria","Losartán 100 mg + amlodipina 10 mg","Amlodipina 10 mg c/8 h","Losartán 50 mg c/12 h","GPC Nacional de HTA 2026 (anexo 1): amlodipina dosis baja 2,5 mg/día, media 5, alta 10; losartán 25/50/100 mg/día. El paso 1 combina ambas a dosis baja en una sola toma."),
Q("T","Aparecen edemas maleolares. ¿Qué hacés?","Reducir la amlodipina o reemplazarla por una tiazida, manteniendo el losartán","Agregar enalapril al losartán","Agregar furosemida en dosis altas","Suspender todo tratamiento","El edema por amlodipina es dosis dependiente: bajar la dosis o cambiar el esquema; ARA II + tiazida es una combinación preferencial de la GPC Nacional de HTA 2026. El cuadernillo proponía asociar diurético o IECA, pero como ya toma un ARA II no se suma un IECA: la guía desaconseja combinarlos (falla renal, hiperkalemia)."),
Q("T","Sigue fuera de meta al mes. ¿Qué hacés antes de intensificar?","Evaluar adherencia, tolerancia y efectos adversos","Duplicar la dosis sin preguntar","Internar","Pedir ecocardiograma","GPC Nacional de HTA 2026: siempre evaluar adherencia y monitorear tolerancia y efectos adversos antes de intensificar. Luego se duplica la dosis de la combinación (sin superar la máxima) y/o se agrega un tercer fármaco, con controles mensuales hasta la meta."),
Q("T","¿Qué meta de TA corresponde para Elena?","< 140/90 mmHg","< 120/70","< 160/100","< 150/90","GPC Nacional de HTA 2026: meta general < 140/90. Considerar valores cercanos a 130/80 si hay alto RCV (daño de órgano blanco, múltiples FR, ECV previa) y bajo riesgo de efectos adversos. En ≥ 80 años que inician tratamiento, < 150/90 (y guiarse por la TA de pie si hay fragilidad). Elena no tiene alto RCV.")
]);

C(5,"Graciela, 56 años",
"Glucemias en ayunas 148 y 156 mg/dl, HbA1c 7,8 %. IMC 32. Sin síntomas cardinales. Creatinina normal. TA 128/80. LDL 132 mg/dl. No fuma.",
[
Q("P","¿Cuándo inicia metformina?","Desde el inicio, sin esperar los cambios de hábitos","A los 3 meses si fallan las medidas","Sólo si la HbA1c supera 9 %","Nunca: alcanza con dieta","Cuadernillo: metformina a todos desde el inicio (no esperar a los cambios de hábitos). Guía SAD de DM2 2025 (Sociedad Argentina de Diabetes): metformina como primera línea junto con el enfoque integral de bienestar (alimentación, actividad física, sueño, tabaco, alcohol, salud mental), y la intensidad inicial según la HbA1c: < 7,5 % monoterapia; 7,5 a < 10 % terapia dual; ≥ 10 % terapia inyectable (insulina si hay síntomas catabólicos). Con la HbA1c de 7,8 % y obesidad de Graciela, la guía SAD sugiere empezar con terapia dual, priorizando un fármaco que baje de peso (arGLP-1 o iSGLT-2)."),
Q("P","¿Cómo se titula?","500 mg 1-2 veces/día con las comidas; a los 5-7 días, si tolera, 850-1000 mg c/12 h","2000 mg de entrada en ayunas","850 mg c/8 h desde el día 1","500 mg/semana","500 mg 1-2 veces/día con almuerzo/cena → a los 5-7 días 850-1000 mg c/12 h; máx. efectiva 2000 mg/día. Guía SAD de DM2 2025: igual titulación; si hay intolerancia digestiva, volver a la dosis previa o pasar a la forma de liberación prolongada; controlar vitamina B12 en el uso crónico."),
Q("T","¿Cuál es la meta de HbA1c?","< 7 %","< 5,7 %","< 9 %","< 6 % siempre","Meta HbA1c < 7 %; glucemia en ayunas 80-130 mg/dl. La Guía SAD de DM2 2025 habla de metas individualizadas y propone reevaluar el tratamiento cada 3-6 meses para evitar la inercia terapéutica."),
Q("P","¿Qué indicás para reducir su RCV (DBT ≥ 40 años, sin ECV)?","Rosuvastatina 10 mg/día","Rosuvastatina 40 mg/día","AAS 100 mg obligatorio","Fibratos","Sin ECV y ≥ 40 años → rosuvastatina 10 mg/día; con ECV → AAS + rosuvastatina 20 mg/día."),
Q("T","A los 3 meses sigue sin control. ¿Qué fármaco agregarías si tuviera ECV establecida o ERC ≥ 3?","iSGLT2 o arGLP-1","Glibenclamida","Insulina cristalina","Acarbosa","Cuadernillo: iSGLT2 o arGLP-1 si no hay control con metformina y hay ECV, muy alto RCV o ERC ≥ 3. Guía SAD de DM2 2025: se indican independientemente de la HbA1c y desde el diagnóstico, manteniendo la metformina: ECV aterosclerótica o alto riesgo → arGLP-1 o iSGLT-2; insuficiencia cardíaca → iSGLT-2; ERC (FG > 20) → iSGLT-2 (arGLP-1 si no se tolera). No usar glibenclamida (hipoglucemias).")
]);

C(5,"Oscar, 63 años, 80 kg",
"DBT2 de 12 años con metformina 1000 mg c/12 h y gliclazida 160 mg/día desde hace más de 6 meses. HbA1c 9,4 %. Ayunas 190 mg/dl. Sin cetosis.",
[
Q("T","¿Tiene indicación de insulina?","Sí, de terapia inyectable: DBT2 sin control tras 6 meses de orales combinados","No: hay que subir la gliclazida a 640 mg","No: con HbA1c < 10 nunca","Sólo si se interna","Cuadernillo: insulina en la DBT2 sin control tras 6 meses de tratamiento oral combinado. Guía SAD de DM2 2025: cuando se necesita terapia inyectable, considerar primero un arGLP-1 para la mayoría (y sumar insulina basal si no alcanza la meta); insulina de entrada si hay síntomas catabólicos o glucemia > 300 mg/dl y/o HbA1c > 10 %. Oscar (HbA1c 9,4 %, sin catabolismo) podría empezar con arGLP-1 según la guía; el caso sigue con la insulina basal del cuadernillo."),
Q("P","¿Cómo la iniciás?","NPH al acostarse o glargina: 0,2 U/kg (16 U) o 10-12 UI según el cuadernillo; 0,1-0,2 UI/kg o 10 UI según la guía SAD","Insulina cristalina c/6 h","1 U/kg/día en 4 dosis","Lispro antes de cada comida","Cuadernillo: NPH al acostarse o glargina, 0,2 U/kg o 10-12 UI. Guía SAD de DM2 2025: dosis inicial 0,1-0,2 UI/kg de peso actual o 10 UI/día; NPH 7-9 h antes del desayuno, siempre a la misma hora; mantener los orales, con cuidado con las sulfonilureas por las hipoglucemias."),
Q("P","¿Cómo ajusta la dosis?","Según la glucemia en ayunas (meta 80-130): cuadernillo 2-4 UI c/3 días; guía SAD +2 UI (+4 si > 180) c/3-5 días y −4 UI si < 70","10 UI por día","Según la glucemia posprandial semanal","No se ajusta","Cuadernillo: ajustar 2-4 UI c/3 días según el automonitoreo en ayunas (meta 80-130 mg/dl). Guía SAD de DM2 2025: ajustar c/3-5 días; si la glucemia en ayunas es > 130 sin valores < 70, +2 UI; si el promedio es > 180, +4 UI; ante hipoglucemia o < 70, −4 UI (o −10 % si la dosis es > 60 UI). Si la glucemia en ayunas está en meta y la HbA1c no, buscar hiperglucemias posprandiales."),
Q("T","¿Cuál es el perfil de la glargina?","Inicio 2 h, sin pico (meseta), duración 20-24 h","Inicio 5-15 min, pico 1 h","Pico a las 4-12 h, dura 18 h","Dura 6 h","Glargina: inicio 2 h / meseta sin pico / 20-24 h. NPH: 1-2 h / 4-12 h / 18-28 h."),
Q("T","¿Qué técnica de aplicación es correcta?","Rotar sitios, no inyectar en zonas que se ejercitarán, sacar de la heladera 15-20 min antes","Siempre en el mismo punto","Agitar la lapicera 2 veces","Conservar en el freezer","Rotar dejando varios cm; mismo sitio en el mismo horario; no en cicatrices; sacar 15-20 min antes; lapicera: agitar 15 veces, 90°, esperar 10 s.")
]);

Q("T","¿Qué síntomas obligan a consultar y qué hacer si CPK y transaminasas están elevadas?","Mialgias u orina oscura; suspender la estatina","Cefalea; duplicar la dosis","Insomnio; seguir igual","Tos; agregar fibrato","Pautas: mialgias, orina oscura, ictericia → CPK + transaminasas elevadas: suspender."),
Q("T","¿En qué mujeres hay que advertir sobre las estatinas?","En edad fértil: son teratogénicas; suspender 3 meses antes de buscar embarazo","Posmenopáusicas","Con osteoporosis","Ninguna","Mujeres en edad fértil: advertir teratogenicidad y suspender 3 meses antes de buscar embarazo.")

Q("T","¿Cuándo se plantea cirugía bariátrica?","IMC > 40 sin respuesta, o 35-39,9 con DBT2, HTA, apnea o artrosis limitante","IMC > 30 siempre","Por pedido del paciente con IMC 32","Nunca","Cirugía: IMC > 40 sin respuesta o 35-39,9 con comorbilidades, en programa multidisciplinario. En personas con DM2, la Guía SAD de DM2 2025 la recomienda con IMC ≥ 40, o 35-39,9 con HbA1c > 8 % pese al tratamiento óptimo, y la considera con IMC 30-34,9 y HbA1c > 8 %.")

Q("T","¿Qué esquema de clopidogrel figura en el cuadernillo?","Carga 300-600 mg; 75 mg/día por 12 meses","75 mg única","600 mg/día por 1 mes","No se usa","Clopidogrel: carga 300-600 mg, mantenimiento 75 mg/día 12 meses. (ESC 2023 prefiere ticagrelor o prasugrel si va a ICP.) Al alta, la guía ESC 2026 de rehabilitación cardíaca recomienda derivarlo a un programa de rehabilitación (ejercicio, cesación tabáquica, nutrición, abordaje psicosocial y optimización de fármacos).")

C(6,"Ernesto, 74 años",
"Disnea de moderados esfuerzos (CF II-III) y edemas maleolares. Ecocardiograma: FEy 30 %. Crepitantes bibasales. TA 128/76, FC 92, ritmo sinusal. Toma diclofenac por dolor de rodilla y verapamilo indicado hace años.",

Q("T","¿Qué fármacos agrega la guía ESC 2026 al tratamiento de base que no están en el cuadernillo?","iSGLT2 (dapagliflozina/empagliflozina) y antialdosterónico desde CF II; sacubitril-valsartán","Digoxina a todos","Amiodarona a todos","Nitratos de acción prolongada","Guía ESC 2026 de IC: el tratamiento médico de base (FMT) de la IC con FE reducida es ARNI o IECA (ARA II si no tolera), betabloqueante, antagonista mineralocorticoideo (espironolactona) e iSGLT2; en la FE preservada, ARM e iSGLT2. El cuadernillo reserva la espironolactona para CF III-IV. Con FEVI ≤ 35 % de causa isquémica, como Ernesto, también está indicado evaluar un cardiodesfibrilador implantable, y se recomienda incluirlo en un programa multidisciplinario con rehabilitación cardíaca.")
]);

Q("T","Si hubiera disentería, ¿qué ATB para un niño?","Azitromicina 10 mg/kg/día por 3 días (o TMS)","Ciprofloxacina 1 g","Amoxicilina","Nada","Disentería niños: azitromicina 10 mg/kg/día por 3 días o TMS 8-10 mg/kg/día c/12 h."),
Q("T","¿Qué está desaconsejado ante sospecha infecciosa?","Loperamida, difenoxilato, bismuto y ATB profiláctico","SRO","Lactancia","Dieta blanda","No recomendados: loperamida, difenoxilato, subsalicilato de bismuto, ATB profiláctico."),
Q("T","Ante sospecha de cólera en un niño, ¿qué dosis de azitromicina?","20 mg/kg monodosis","10 mg/kg 3 días","5 mg/kg","1 g","Sospecha de cólera: azitromicina monodosis (adultos 1 g; niños 20 mg/kg).")
