FAM("Familia Acosta","Matías (23), su hermana Agostina (22) y su bebé Thiago, y los padres Sandra (52) y Julio (54)","US barrio San Martín");
C(15,"Matías, 23 años",
"Ud. trabaja en la Unidad Sanitaria del barrio San Martín, con una enfermera, un promotor de salud y una agente sanitaria de lunes a viernes; la trabajadora social va 3 veces por semana y la psicóloga, 2. Se toman muestras de laboratorio dos veces por semana; hay botiquín de Remediar, vacunatorio y reunión de equipo los jueves. En las próximas consultas atenderá a la familia Acosta.\n\nMatías, de 23 años, consulta a demanda espontánea por tos con expectoración desde hace 5 semanas. Trabaja de noche como ayudante en una panadería. Dice que \"ya tomó jarabe y no se le pasa\".",
[
Q("A","¿Qué datos buscás en la anamnesis?","Fiebre vespertina, sudoración nocturna, pérdida de peso y de apetito, hemoptisis, disnea, contactos con tos o con TB, convivientes y hacinamiento, tabaquismo y otros consumos, VIH u otra inmunosupresión y medicación que tomó","Fiebre, convivientes, tabaquismo y antecedentes de asma, sin indagar contactos ni pérdida de peso","Color del esputo, fiebre y si tuvo varicela","Alergias estacionales, mascotas y exposición a polvo como únicas preguntas","Cuadernillo: tos y expectoración por más de 15 días = caso sospechoso de TB. Se pregunta por síntomas de impregnación (fiebre, sudoración nocturna, pérdida de peso, astenia, hemoptisis), contactos y convivientes, hacinamiento, tabaquismo, calefacción y grupos especiales (VIH, hepatopatía, IR, embarazo o puerperio)."),
Q("E","¿Qué examen físico realizás?","Signos vitales (FC, FR, TA, temperatura y saturación), peso, talla e IMC, estado general y de nutrición, y examen respiratorio completo (inspección, palpación, percusión y auscultación)","Auscultación pulmonar solamente","Otoscopia, rinoscopia y examen de fauces","Tacto rectal y palpación abdominal","Cuadernillo (TB, O): inspección general, FC, TA, FR, examen respiratorio completo, estado general y de nutrición, peso, talla, IMC y temperatura.","Refiere fiebre por las tardes, sudoración nocturna y que \"la ropa le queda grande\": bajó unos 6 kg en 2 meses. Vive con su madre Sandra (52), su padre Julio (54), su hermana Agostina (22) y Thiago, el bebé de ella, de 2 semanas, en una casa de 2 habitaciones; él duerme en el living. Fuma 10 cigarrillos por día y consume marihuana los fines de semana. Un compañero de la panadería \"estuvo con tuberculosis\" el año pasado. Nunca se hizo serologías."),
Q("PR","¿Cuál es la problematización más completa?","Caso sospechoso de TB pulmonar (tos y expectoración de más de 15 días con síndrome de impregnación y contacto previo); pérdida de peso significativa; tabaquismo; consumo de marihuana; hacinamiento con convivientes de riesgo (lactante y puérpera); serologías desconocidas","Neumonía aguda de la comunidad; tabaquismo; pérdida de peso","TB pulmonar confirmada; tabaquismo; hacinamiento","Bronquitis aguda; tabaquismo; consumo de marihuana; hacinamiento","Hasta tener la bacteriología es un caso sospechoso: el diferencial incluye neumonía, cáncer de pulmón y TB. La problematización suma hábitos, situación habitacional y convivientes de riesgo, que van a definir el estudio de contactos.","Peso 58 kg (antes 64), talla 1,75 m (IMC 18,9), T 37,8 °C, FC 96, FR 20, SatO2 96 %. Rales subcrepitantes en el vértice derecho."),
Q("S","¿Qué estudios solicitás?","Dos muestras de esputo (la primera en la consulta y la segunda a la mañana siguiente) para baciloscopia, cultivo y prueba molecular rápida (Xpert MTB/RIF), Rx de tórax de frente, y serologías (VIH, VDRL, HBsAg, VHC)","Una sola baciloscopia: si es negativa, se descarta TB","Rx de tórax y empezar hoy el tratamiento antituberculoso empírico","TC de tórax y broncoscopia como primeros estudios","Cuadernillo: baciloscopia de al menos 2 muestras en días distintos (la 1ª en la consulta, la 2ª por la mañana), siempre con cultivo; Rx de tórax de frente; prueba tuberculínica; no iniciar el tratamiento hasta tener baciloscopia o cultivo. Pautas técnicas de TB 2026: suma la prueba molecular rápida (Xpert MTB/RIF), que detecta además resistencia a rifampicina, y serologías para VIH, hepatitis B, Chagas y VDRL al inicio."),
Q("PL","¿Qué tratamiento indicás?","2HRZE/4HR diario: 4 comprimidos de cuádruple asociación (H 75/R 150/Z 400/E 275 mg) por 2 meses y luego 2 comprimidos de doble asociación (H 150/R 300 mg) por 4 meses, en una sola toma, en ayunas o alejado de las comidas","2HRZE/4HR con 3 comprimidos de cuádruple, porque pesa menos de 60 kg","Isoniacida sola 300 mg/día por 6 meses","Estreptomicina IM más rifampicina por 2 meses","Con 58 kg corresponden 4 comprimidos de cuádruple y 2 de doble asociación según ambas fuentes: cuadernillo (> 55 kg) y Pautas técnicas de TB 2026 (≥ 55 kg). Diferencia en la toma: el cuadernillo dice diaria salvo domingos, ≥ 2 h después de comer y 1 h antes de volver a comer; las Pautas 2026, diaria (60 + 120 tomas), en ayunas o lejos de las comidas.","Baciloscopia positiva (++). Xpert: M. tuberculosis detectado, sin resistencia a rifampicina. Rx de tórax: cavidad en el lóbulo superior derecho. VIH, VDRL, HBsAg y VHC no reactivos. Hepatograma normal.")
]);
M("161-3","Dos muestras de esputo para baciloscopia y cultivo|Prueba molecular rápida (Xpert MTB/RIF)|Rx de tórax de frente|Serología para VIH (y VDRL, HBsAg, VHC)","Una sola baciloscopia|TC de tórax como primer estudio|Broncoscopia");

C(15,"Matías, 23 años (inicio del tratamiento)",
"Matías empieza el tratamiento. Pregunta si puede seguir trabajando y si su familia \"se va a contagiar\". Sigue trabajando de noche y los fines de semana sale con amigos.",
[
Q("PL","¿Qué modalidad de supervisión del tratamiento le proponés?","TDO: por el consumo de sustancias y el trabajo nocturno tiene riesgo de no completarlo, así que se acuerda la toma observada (en la unidad sanitaria o en el domicilio, con la agente sanitaria) en un horario que pueda cumplir; si sostiene buena adherencia y red de apoyo, puede pasar a tratamiento acompañado","Entregarle la medicación de los 6 meses y control al terminar","Tratamiento acompañado por videollamada desde el inicio, sin evaluar riesgo de abandono","Internarlo durante toda la fase intensiva","Cuadernillo: tratamiento directamente observado, bajo supervisión estricta. Pautas técnicas de TB 2026: TDO para quienes tienen riesgo de no completarlo (consumo problemático, pérdida de seguimiento previa, situación de calle, salud mental); con buena adherencia y red de apoyo, tratamiento acompañado (contacto frecuente por distintos medios)."),
Q("PL","¿Qué medidas indicás en la casa?","Ventilar los ambientes, cubrirse al toser, dormir separado si es posible y usar barbijo cerca del bebé mientras sea bacilífero; explicar que la contagiosidad baja con el tratamiento efectivo; notificar el caso y estudiar a todos los convivientes","Aislamiento total dentro de la casa durante los 6 meses","Ninguna: con la primera dosis deja de contagiar","Mudar al bebé con otros familiares y suspender la lactancia materna","La transmisión es aérea y baja rápidamente con el tratamiento efectivo. Todos los casos de TB se notifican (Pautas técnicas de TB 2026, SNVS 2.0). La lactancia no se suspende: si la madre fuera bacilífera, usa barbijo."),
Q("PR","¿Quiénes son contactos y a quiénes priorizás?","Convivientes y personas con contacto cercano durante el período sintomático o los 3 meses previos (familia y compañeros de trabajo); prioridad: Thiago (menor de 5 años), Agostina (puérpera) y cualquier conviviente con síntomas","Sólo los convivientes que tengan tos","Sólo los menores de 15 años","Sólo quienes comparten la habitación con él","Cuadernillo: contactos = personas próximas al enfermo durante el período sintomático o los 3 meses previos; la quimioprofilaxis prioriza a los menores de 15 años. Pautas técnicas de TB 2026: menores de 5 años reciben TPT independientemente de la PPD; de 5 a 19 años según la PPD; desde los 20, según riesgo individual (el puerperio es un grupo de riesgo)."),
Q("C","¿Qué le explicás sobre los efectos adversos?","Que la rifampicina tiñe de naranja la orina, las lágrimas y el sudor (no es peligroso), que puede haber molestias digestivas, y que consulte ante ictericia, vómitos, dolor abdominal, erupción, hormigueos o alteraciones de la visión","Que estos fármacos no tienen efectos adversos","Que la orina naranja indica hepatitis y debe suspender la medicación","Que sólo puede darle sueño","La hepatotoxicidad (H, R, Z) es el efecto adverso grave más frecuente; el etambutol puede dar neuritis óptica y la isoniacida, neuropatía periférica (piridoxina en grupos de riesgo)."),
Q("S","¿Qué controles programás?","Control clínico mensual (peso y ajuste de dosis, adherencia, toxicidad); baciloscopia al final del 2.º mes, del 4.º y del 6.º (o al terminar); Rx al inicio, al final de la fase intensiva y al completar el tratamiento","Baciloscopia semanal durante los 6 meses","Sólo una Rx de tórax al final","Un único control a los 6 meses","Cuadernillo: caso nuevo con baciloscopia positiva → baciloscopia al final del 2.º, 4.º y 6.º mes; controles clínicos al menos en los meses 1, 2, 4 y 6; Rx al inicio, al final de la 1ª fase y al completar. Pautas técnicas de TB 2026: baciloscopia al final del 2.º mes y, si sigue expectorando, en el 4.º y el 6.º; control clínico mensual.")
]);

C(15,"Agostina, 22 años (puérpera)",
"Agostina, hermana de Matías, viene al control puerperal a los 14 días de un parto vaginal de término con episiotomía. Amamanta a Thiago. Ya sabe del diagnóstico de su hermano y está muy preocupada por el bebé.",
[
Q("A","¿Qué preguntás en la anamnesis?","Cómo se siente, dolor, loquios (cantidad, color y olor), diuresis y catarsis, lactancia (prendida, dolor, grietas), fiebre, ánimo y red de apoyo, si toma hierro, vacunas recibidas, qué MAC piensa usar y síntomas respiratorios por el contacto con TB","Lactancia, MAC y cuándo puede retomar las relaciones sexuales","Sólo si tiene tos","Sólo el peso del bebé","Cuadernillo (puerperio, S): parto, dolor, diuresis y catarsis, lactancia, pérdidas, hierro, conocimiento de MAC; a eso se suma el contacto con un caso de TB bacilífera."),
Q("E","¿Qué evaluás en el examen físico?","Signos vitales, piel y mucosas, mamas y pezones, altura, consistencia y sensibilidad uterina, loquios, periné y episiorrafia, miembros inferiores y estado emocional","Mamas y loquios únicamente","Especuloscopia con toma de PAP","Sólo TA y peso","Cuadernillo: signos vitales, involución uterina, loquios, periné y episiorrafia, abdomen, mamas, MMII (edema, tromboflebitis), catarsis, diuresis y estado emocional.","Se siente cansada, duerme poco. Loquios escasos y sin olor. No tiene fiebre ni tos. Le duele el pezón derecho al amamantar. Recibió la antigripal y la dTpa en el embarazo. Dice que \"con la teta ya está cuidada\" y que no menstruó. Está en pareja; el padre del bebé vive en otro barrio."),
Q("T","¿Qué esperás encontrar en el útero y los loquios a los 14 días?","Útero intrapélvico, no palpable por abdomen e indoloro; loquios serohemáticos o serosos, sin mal olor","Útero a la altura del ombligo y loquios hemáticos abundantes","Útero palpable a mitad de camino entre ombligo y pubis, levemente doloroso, lo que es normal","Ausencia de loquios desde el día 5","Cuadernillo: útero en el ombligo a las 24 h, desciende 1 través de dedo por día y al día 12 es intrapélvico. Un útero sensible es siempre anormal. Loquios: hemáticos 48 h, serohemáticos la 2ª semana, serosos de la 2ª a la 6ª; sin olor."),
Q("PR","¿Cuál es la problematización más completa?","Puerperio alejado normal; grieta del pezón por técnica de prendida inadecuada; contacto conviviente de TB pulmonar bacilífera; necesidad de MAC (falsa seguridad con la lactancia sin evaluar criterios de MELA); cansancio con red de apoyo a evaluar","Puerperio inmediato; mastitis; contacto de TB","Puerperio patológico por endometritis; grieta del pezón","Puerperio normal sin problemas","Puerperio alejado: hasta la 6ª semana (11-42 días según otra definición del cuadernillo). La grieta se debe a defectos de colocación y prendida.","TA 110/70, afebril. Grieta pequeña en el pezón derecho, con prendida superficial. Útero no palpable. Episiorrafia cicatrizada. Sin edemas. Loquios serohemáticos escasos."),
Q("PL","¿Qué plan indicás?","Corregir la técnica (prendida a la areola, empezar por el pecho menos dolorido, romper el vacío con el dedo) y sostener la lactancia; sulfato ferroso 60-100 mg/día hasta los 3 meses posparto; MAC compatible con la lactancia; evaluarla como contacto de TB (clínica, PPD y Rx) sin suspender la lactancia; pautas de alarma y control a los 30 días junto con pediatría","Suspender la lactancia hasta que Matías termine la fase intensiva","Anticonceptivos combinados desde hoy porque la lactancia ya está instalada","Indicar MELA como único método sin evaluar sus criterios","Cuadernillo: hierro hasta los 3 meses, 2º control a los 30 días con pediatría, tratamiento de grietas sin acortar las mamadas. Pautas técnicas de TB 2026: el estudio de contactos incluye clínica, PPD y Rx; el puerperio es un grupo de riesgo de progresión; la lactancia no se suspende durante el TPT."),
Q("PL","¿Qué métodos anticonceptivos le podés ofrecer hoy?","Minipíldora de progestágeno, implante subdérmico o inyectable trimestral de progestágeno (y preservativo)","Anticonceptivos combinados orales","DIU de cobre colocado hoy","Anillo vaginal combinado","Cuadernillo: con lactancia se contraindican los estrógenos (combinados recién a los 6 meses). El DIU se coloca antes de las 48 h posparto o a las 4 semanas; el SIU a las 6 semanas. MELA sólo si hay LME (7-10 tomas con nocturnas), amenorrea y menos de 6 meses.")
]);
M("163-5","Minipíldora de progestágeno|Implante subdérmico|Inyectable trimestral de progestágeno|Preservativo","Anticonceptivos combinados orales|DIU de cobre colocado hoy|Anillo vaginal combinado");

C(15,"Thiago, 1 mes",
"Agostina trae a Thiago al control del mes, acompañada por su madre, Sandra. Nació a término por parto vaginal y pesó 3200 g. Recibió BCG y hepatitis B en la maternidad. Pesquisa neonatal y otoemisiones acústicas normales. Matías lleva 2 semanas de tratamiento.",
[
Q("A","¿Qué preguntás?","Lactancia (frecuencia, prendida, otros líquidos), diuresis y catarsis, sueño (dónde, con quién, en qué posición y si alguien que duerme con él fuma), caída del cordón, intercurrencias, signos de alarma (fiebre, tos, rechazo del alimento, poca ganancia de peso) y preocupaciones de la familia","Sólo si toma el pecho","Si ya le dan agua y té","Antecedentes de alergia alimentaria y si come papillas","Cuadernillo (control < 1 año, S): contexto psicosocial, perinatales, vacunas y pesquisa, intercurrencias, alimentación, catarsis y diuresis, cordón, sueño seguro, tabaquismo, preocupaciones y MAC de la madre."),
Q("E","Pesaba 3800 g a los 15 días y hoy, a los 30 días, 4250 g. ¿Cómo valorás el aumento?","Adecuado: 30 g/día (450 g en 15 días; lo esperado es 25-30 g/día)","Insuficiente: debería aumentar 50 g/día","Excesivo: indica sobrealimentación","No se puede valorar sin la talla","Cuadernillo: el aumento normal es de 25-30 g/día; el descenso fisiológico máximo es del 10 % y se recupera antes de los 10 días.","Toma pecho cada 2-3 h, moja 8 pañales por día, catarsis diaria. El cordón se cayó al día 9. Duerme en la cama con Agostina. Julio fuma dentro de la casa. Sin tos ni fiebre."),
Q("E","¿Qué incluye el examen físico?","Peso, talla y PC con percentiles, fontanelas, reflejo rojo, auscultación cardíaca y pulsos femorales, abdomen y ombligo, genitales (testículos en bolsa), caderas (Ortolani y Barlow), piel, reflejos arcaicos y pautas madurativas, y observar una toma","Peso únicamente","Otoscopia y TA como datos principales","Agudeza visual con tabla de Snellen","Examen cefalocaudal del lactante según el cuadernillo, incluyendo caderas en cada control del primer año y técnica de lactancia."),
Q("PR","¿Cuál es la problematización más completa?","Control de niño sano de 1 mes con crecimiento y desarrollo adecuados; contacto conviviente menor de 5 años de un caso de TB pulmonar bacilífera; colecho; tabaquismo pasivo; hacinamiento","TB congénita","Bajo progreso de peso; colecho; tabaquismo pasivo","Niño sano sin problemas","El menor de 5 años contacto de un bacilífero tiene alto riesgo de progresión a formas graves; el colecho y el tabaquismo pasivo son problemas de sueño seguro.","Examen normal; sonrisa social incipiente, fija la mirada. Sin signos de TB."),
Q("PL","¿Qué indicás respecto de la TB?","Descartar TB activa (clínica y Rx de tórax) e indicar tratamiento preventivo independientemente de la PPD, preferentemente 3HR (isoniacida + rifampicina) con formulación pediátrica dispersable y piridoxina, con control clínico mensual","Esperar la PPD: si es negativa, no indicar nada","Isoniacida sólo si aparece tos","Revacunar con BCG","Pautas técnicas de TB 2026: contactos menores de 5 años → TPT independientemente de la PPD, preferentemente 3HR (alternativas 6H o 4R), con piridoxina. El cuadernillo indicaba isoniacida 10 mg/kg/día por 6 meses, con prioridad en menores de 15 años. Thiago ya tiene BCG; si no la tuviera, se aplica al terminar el TPT."),
Q("PL","¿Qué consejería le das a la familia?","LME a libre demanda; sueño seguro: boca arriba, en su propia cuna en la habitación de la madre, colchón firme, sin almohadas ni peluches; casa libre de humo (fumar afuera, cambiarse la ropa y lavarse las manos); fiebre como signo de gravedad en menores de 3 meses; vacunas de los 2 meses; control en 1 mes","Colecho seguro aunque el abuelo fume","Agregar agua y té de yuyos entre las tomas","Dormir boca abajo para evitar ahogos","Cuadernillo: el colecho se debe evitar siempre cuando el padre o la madre fuman, con múltiples personas o con alguien que no sea el padre o la madre. Los yuyos (anís estrellado, payco) son gastro y neurotóxicos.")
]);

C(15,"Sandra, 52 años",
"Sandra, madre de Matías, aprovecha que trajo al nieto para consultar: desde hace meses tiene \"calores\" que la despiertan de noche. Trabaja limpiando casas. Su última consulta médica fue hace 6 años.",
[
Q("A","¿Qué preguntás en la anamnesis?","FUM y cómo fueron los ciclos, sofocos (frecuencia, si interfieren con el sueño y la vida diaria), sequedad vaginal y dispareunia, síntomas urinarios, ánimo y sueño, antecedentes personales y familiares (cáncer de mama, TVP o TEP, ECV), tabaquismo, actividad física, rastreos previos y síntomas respiratorios por el contacto con TB","Sólo la FUM","Antecedentes de alergias y vacunas únicamente","Si quiere tomar hormonas","Cuadernillo (menopausia, S): sofocos, alteraciones menstruales, dispareunia, síntomas urinarios, ánimo, riesgo cardiovascular y osteoporosis."),
Q("T","¿En qué etapa está?","Posmenopausia: 12 meses o más de amenorrea, con síntomas vasomotores y genitourinarios por hipoestrogenismo","Perimenopausia, que requiere FSH para confirmarse","Amenorrea secundaria a estudiar con prolactina y TSH","Embarazo hasta demostrar lo contrario","Cuadernillo: menopausia = cese de la menstruación tras 12 meses de amenorrea (entre los 42 y 53 años); el climaterio es la transición. No hace falta laboratorio hormonal para el diagnóstico clínico.","FUM hace 14 meses. Tiene 6 a 8 sofocos por día que la despiertan varias veces por noche y la tienen \"agotada\" en el trabajo. Sequedad vaginal. No fuma. Sin antecedentes de TVP, cáncer, HTA ni ECV. Su madre tuvo cáncer de mama a los 70. Nunca se hizo una mamografía; último PAP hace 6 años, normal. No tiene tos."),
Q("E","¿Qué examen físico realizás?","TA, peso, talla, IMC, circunferencia de cintura, piel y mucosas, examen mamario y ginecológico con toma de PAP","Sólo TA","Tacto rectal y densitometría","Fondo de ojo y ECG","Cuadernillo: lo propio del control del adulto más examen mamario y ginecológico con los rastreos correspondientes."),
Q("S","¿Qué estudios solicitás?","Glucemia, perfil lipídico, SOMF anual, mamografía, PAP (o test de VPH), serologías y evaluación como contacto de TB","Densitometría y ecografía transvaginal de rutina","FSH y estradiol para confirmar la menopausia","Mamografía sólo si se palpa un nódulo","Cuadernillo: glucemia, perfil lipídico, SOMF, mamografía y PAP; densitometría a partir de los 65 años; ecografía transvaginal sólo si hay sangrado. El cáncer de mama de la madre a los 70 no adelanta el rastreo (que se inicia 10 años antes del caso más joven).","TA 122/78, IMC 26, cintura 86 cm. Mucosa vaginal seca. Examen mamario normal."),
Q("PL","¿Qué tratamiento le proponés para los sofocos?","Explicar que es una etapa normal; medidas generales (actividad física 150 min/semana, calcio, exposición solar); por síntomas severos y sin contraindicaciones, THR combinada porque tiene útero: estradiol diario (oral 1-2 mg o gel 1,5-3 mg) + progesterona micronizada 200 mg/día 10-14 días por mes, por el menor tiempo posible, reevaluando al año y con mamografía anual; lubricantes o estrógeno vaginal para la sequedad","Estrógenos solos, porque no está histerectomizada","THR por 10 años para prevenir enfermedad cardiovascular","No puede recibir THR por tener más de 50 años","Cuadernillo: THR reservada para síntomas severos e intolerables, sin contraindicaciones (> 60 años o > 10 años de la FUM, metrorragia sin causa, cáncer estrógeno-dependiente, TVP/TEP, enfermedad coronaria o ACV, hepatopatía activa). Con útero, siempre combinada. No previene la ECV.")
]);

C(15,"Julio, 54 años",
"Julio, padre de Matías, consulta por dolor lumbar desde hace 3 días, después de cargar bolsas de cemento. Es albañil.",
[
Q("A","¿Qué preguntás?","Características del dolor (ALICIA), irradiación a miembros, parestesias o pérdida de fuerza, trastornos esfinterianos, fiebre, pérdida de peso, dolor nocturno o en reposo, antecedentes de neoplasia, corticoides u osteoporosis, episodios previos, trabajo; y, como conviviente de un caso de TB, tos, fiebre o sudoración","Sólo si el dolor se irradia","Si quiere una RMN","Antecedentes de cálculos renales únicamente","Cuadernillo (lumbalgia): banderas rojas de neoplasia, infección, fractura y compromiso neurológico. Al ser contacto de un caso bacilífero, se rastrean síntomas respiratorios."),
Q("E","¿Qué examen físico realizás?","Marcha y postura, inspección de la columna, marcha en puntas (S1) y en talones (L5), palpación de apófisis espinosas y paravertebrales, puñopercusión, Lasègue y Bragard, fuerza, sensibilidad y reflejos; y examen respiratorio completo","Sólo palpación lumbar","Tacto rectal de rutina","Otoscopia y fondo de ojo","Cuadernillo: inspección, palpación, percusión y maniobras (Lasègue, Bragard, movilidad activa y pasiva).","Dolor lumbar sin irradiación, mejora con el reposo y empeora al agacharse. Sin fiebre, parestesias ni alteración esfinteriana. Fuma 20 cigarrillos por día desde los 18 años. Tiene tos con flema desde hace 3 semanas, \"la de siempre del fumador\". No bajó de peso."),
Q("PR","¿Cuál es la problematización más completa?","Lumbalgia aguda mecánica sin compromiso neurológico (con indicación de Rx por ser mayor de 50); sintomático respiratorio conviviente de un caso de TB bacilífera; tabaquismo de 36 paquetes/año","Hernia de disco con radiculopatía L5","Lumbalgia aguda simple sin necesidad de estudios; tos del fumador","Pielonefritis; tabaquismo","Tos de más de 15 días en un contacto = caso sospechoso, aunque la atribuya al cigarrillo. Carga tabáquica: 20 cig/día (1 paquete) × 36 años = 36 paquetes/año.","Contractura paravertebral derecha, sin dolor a la percusión de las apófisis espinosas. Lasègue negativo, fuerza y sensibilidad conservadas. Auscultación pulmonar: roncus aislados."),
Q("S","¿Qué estudios solicitás?","Rx de columna lumbosacra de frente y perfil (por la edad) y, por ser sintomático respiratorio y contacto, dos muestras de esputo para baciloscopia, cultivo y prueba molecular, y Rx de tórax","Ningún estudio: el 85 % de las lumbalgias agudas son mecánicas","RMN de columna urgente","Sólo Rx de tórax","Cuadernillo: Rx lumbosacra F y P en mayores de 50 o menores de 20 años, fiebre, traumatismo, corticoides u osteoporosis, sospecha de neoplasia o compromiso neurológico. La tos de más de 15 días obliga a estudiar TB."),
Q("PL","¿Qué tratamiento le indicás para la lumbalgia?","Tranquilizar y explicar; paracetamol 1 g c/8 h o ibuprofeno 400 mg c/6 h; mantenerse activo (sin reposo, salvo dolor intenso, no más de 2 días), calor o frío local, técnicas para levantar peso, pautas de alarma neurológicas, consejo antitabaco y control en 2 semanas","Reposo absoluto en cama por 7 días","Tramadol y diazepam desde el inicio durante un mes","Corticoides IM diarios por una semana","Cuadernillo: tratamiento escalonado (paracetamol → AINE → AINE + opioide débil o miorrelajante), no recomendar reposo, ejercicios y control en 2 semanas.")
]);
M("166-3","Rx de columna lumbosacra de frente y perfil|Dos muestras de esputo para baciloscopia, cultivo y prueba molecular|Rx de tórax","Ningún estudio|RMN de columna urgente|Centellograma óseo");

C(15,"Agostina, 22 años (4 semanas posparto)",
"A las 4 semanas del parto, Agostina consulta a demanda espontánea por dolor en la mama derecha desde hace 2 días y fiebre de 38,5 °C. La grieta del pezón no terminó de cerrar.",
[
Q("E","¿Qué examinás?","Signos vitales, ambas mamas (eritema, calor, induración, fluctuación), pezones, axilas, y otros focos (útero, loquios, miembros inferiores)","Sólo la temperatura","Especuloscopia","Ecografía mamaria como único examen","Hay que diferenciar mastitis de congestión mamaria y de absceso (fluctuación), y descartar otros focos puerperales."),
Q("PR","¿Cómo problematizás?","Mastitis aguda puerperal (más de 24 h de evolución, con fiebre) secundaria a grieta y técnica de lactancia inadecuada","Congestión mamaria sin infección","Endometritis puerperal","Absceso mamario que obliga a suspender la lactancia","Cuadernillo: aparece en la 3ª-4ª semana; inflamación unilateral, dolor, rubor, calor, malestar, artromialgias y fiebre > 38 °C. En la congestión no hay proliferación bacteriana.","Cuadrante superoexterno derecho eritematoso, caliente y doloroso, sin fluctuación. Malestar general y artromialgias. Útero no palpable, loquios serosos sin olor."),
Q("PL","¿Qué tratamiento indicás?","Mantener la lactancia y vaciar la mama afectada, corregir la técnica, calor húmedo justo antes de la toma y frío después, analgésicos, cefalexina 1 g c/8 h VO 7-10 días y control a las 48 h","Suspender la lactancia del lado afectado hasta terminar el antibiótico","Amoxicilina 500 mg c/8 h por 3 días","Sólo frío local, porque los antibióticos están contraindicados en la lactancia","Cuadernillo (puerperio patológico): ATB VO si los signos llevan más de 24 h o hay afectación del estado general → cefalexina 1 g/8 h 7-10 días. ⚠ En otro apartado (control del niño < 1 año) el cuadernillo menciona cefalexina 500 mg c/6 h o amoxicilina 500 mg c/8 h 10-14 días; se toma el esquema del capítulo de puerperio."),
Q("C","Pregunta si el antibiótico pasa a la leche y si debe dejar de amamantar. ¿Qué le respondés?","Que la cefalexina es compatible con la lactancia y que vaciar la mama es fundamental para curarse: tiene que seguir amamantando","Que debe tirar la leche mientras tome el antibiótico","Que pase a fórmula definitivamente","Que la leche de la mama infectada contagia al bebé","Cuadernillo: reafirmar la seguridad de mantener la lactancia y el beneficio del vaciado, que es fundamental en el tratamiento.")
]);

C(15,"Familia Acosta (clínica ampliada)",
"Pasaron 2 meses. En la reunión de equipo, la agente sanitaria cuenta que Matías faltó 6 días al TDO en las últimas 2 semanas: volvió a trabajar de noche y dice que \"ya está curado porque no tose\". Agostina le da el 3HR a Thiago \"cuando se acuerda\". Sandra está desbordada: cuida al bebé y sigue limpiando casas. Julio tuvo baciloscopias negativas y dejó de fumar hace 3 semanas.",
[
Q("T","La baciloscopia del final del 2.º mes de Matías es positiva. ¿Cómo la interpretás?","Todavía no es fracaso: con baciloscopia positiva al 2.º mes se piden cultivo y prueba de sensibilidad (o prueba molecular), se refuerza la adherencia y se sigue de cerca","Fracaso terapéutico: se cambia a drogas de segunda línea","Es esperable y no requiere ninguna acción","Pérdida en el seguimiento","Cuadernillo: si la baciloscopia del 2.º mes es positiva, pedir cultivo y PS; fracaso = baciloscopia o cultivo positivo en el mes 5 o después. Pautas técnicas de TB 2026: la persistencia al 2.º mes es predictor de fracaso; fracaso = bacteriología positiva al final del 4.º mes (operativo si no se aseguró la toma regular)."),
Q("T","Si Matías interrumpiera el tratamiento 2 meses seguidos, ¿cómo se clasificaría?","Pérdida en el seguimiento","Fracaso","Tratamiento completo","No evaluado","Cuadernillo: pérdida en el seguimiento = no inició el tratamiento o lo interrumpió durante 2 meses consecutivos o más."),
Q("PL","¿Qué estrategias acuerda el equipo para sostener el tratamiento de Matías?","Entrevista con él para entender por qué falta, acordar horario y lugar del TDO compatibles con el trabajo (domicilio, agente sanitaria), certificado laboral si lo necesita, abordar los consumos con la psicóloga, trabajadora social para recursos, e involucrar a la familia como red","Darle el alta porque ya no tose","Denunciarlo y obligarlo a internarse","Entregarle la medicación de un mes para que la tome solo","Cuadernillo: si el paciente no acude, contactarlo a la brevedad y descubrir la causa de la falta para sostener el tratamiento."),
Q("PL","¿Qué propone el equipo para Thiago y para Sandra?","Simplificar la toma del 3HR (horario fijo con una toma, recordatorios, supervisión por la agente sanitaria), revisar la técnica de preparación y reforzar por qué es importante; para Sandra, espacio de escucha, distribución de tareas de cuidado en la familia y articulación con trabajo social","Suspender el 3HR porque no tuvo síntomas","Cambiar a isoniacida por 12 meses","Derivar a Sandra a psiquiatría sin hablar con ella","El proyecto terapéutico singular incluye metas negociadas con la familia, estrategias y seguimiento; la sobrecarga de quien cuida es un problema a abordar.")
]);
// Sección 15: Examen integrador — Familia Ríos (formato de examen final)
FAM("Familia Ríos","Silvana (44), Hernán (47), Tobías (16), Kiara (9) y el abuelo Rubén (74)","US Las Lomas");
C(15,"Silvana, 44 años",
"Ud. trabaja en la Unidad Sanitaria Las Lomas, con una enfermera y dos promotoras de salud de lunes a viernes; la trabajadora social y la psicóloga van 3 veces por semana y el odontólogo, 2. Hay turnos programados por la mañana, demanda espontánea por la tarde, botiquín de Remediar y reunión de equipo los jueves. En las próximas consultas atenderá a la familia Ríos.\n\nSilvana, de 44 años, pide un turno porque \"hace un mes que no duerme\" y quiere \"algo para dormir\". Es cocinera en un comedor comunitario.",
[
Q("A","¿Qué preguntás en la anamnesis?","Tipo de insomnio (conciliación, mantenimiento o mixto) y duración, hábitos de sueño, cafeína, alcohol y medicación; ánimo, anhedonia, apetito y peso, energía, concentración, ideas de muerte o suicidio; crisis vitales y duelos, red de apoyo y síntomas de hipotiroidismo","Sólo a qué hora se acuesta y se levanta","Ronquidos y apneas, como única causa a descartar","Si prefiere clonazepam o zolpidem","Cuadernillo (insomnio): clasificar el tipo y la duración y descartar trastornos de base (ansiedad, depresión), fármacos, cafeína y sustancias. En depresión: anhedonia, visión negativa, duelos, hipotiroidismo, ideación suicida, red de apoyo."),
Q("E","¿Qué examen físico realizás?","TA, FC, peso y talla, piel y faneras, palpación tiroidea y un cuestionario estructurado (PHQ-9)","Ningún examen: es un problema de salud mental","Fondo de ojo y examen neurológico completo","ECG y espirometría","Cuadernillo (depresión, O): TA, FC, peso y talla, piel y faneras, y cuestionarios (Hamilton, Beck, PHQ-9, PHQ-2).","Hace 2 meses su pareja, Hernán, perdió el trabajo en la fábrica y desde entonces discuten por plata. Se despierta a las 4 de la mañana y no se vuelve a dormir. No disfruta de nada, ni de sus hijos; está cansada todo el día, come menos (bajó 4 kg) y le cuesta concentrarse. Se siente \"una carga\" y a veces piensa que \"sería mejor no despertarse\", sin plan ni intentos previos. Toma 4 mates y 2 cafés por día. No toma alcohol."),
Q("T","Obtiene 17 puntos en el PHQ-9. ¿Cómo lo interpretás?","Depresión moderada-severa (15-19)","Depresión leve (5-9)","Depresión moderada (10-14)","Depresión severa (20 o más)","Cuadernillo: PHQ-9 de 5-9 leve, 10-14 moderada, 15-19 moderada-severa, más de 20 severa.","TA 118/76, FC 78, IMC 23. Tiroides no palpable. Resto normal."),
Q("PR","¿Cuál es la problematización más completa?","Depresión (ánimo deprimido y anhedonia con 5 o más síntomas por más de 2 semanas) con ideas pasivas de muerte, sin plan; insomnio de mantenimiento secundario; crisis paranormativa (desempleo de la pareja) con conflicto conyugal; alto consumo de cafeína","Trastorno de adaptación que no requiere tratamiento","Distimia con insomnio de conciliación","Insomnio primario","Criterios del cuadernillo: ánimo deprimido o anhedonia + al menos 5 síntomas durante 2 semanas, con malestar o deterioro. La distimia no tiene anhedonia ni ideas de muerte y dura al menos 2 años."),
Q("PL","¿Qué plan le proponés?","Explicar que es una enfermedad tratable; psicoterapia con la psicóloga del equipo más un IRS (sertralina 25-50 mg/día por la mañana, luego 50-200 mg) con pautas anticipatorias (efecto a las 3-6 semanas, efectos adversos, no genera dependencia), por al menos 6 meses; evaluar la ideación en cada consulta, pautas de alarma y red; higiene del sueño y menos cafeína; control en 1-2 semanas","Zolpidem 10 mg y control en 3 meses","Psicoterapia sola por 12 semanas y luego evaluar medicación","Amitriptilina 150 mg desde el primer día","Cuadernillo: psicoterapia sola en la depresión leve; en cuadros más severos, tratamiento combinado. IRS de 1ª opción (sertralina o citalopram), control a las 1-2 semanas y luego cada 2-4 semanas los primeros 3 meses. Puede sumarse un curso corto de BZD (clonazepam 0,5 mg, no más de 2 semanas) si hay insomnio o ansiedad.")
]);

C(15,"Tobías, 16 años",
"Tobías, de 16 años, hijo de Silvana, viene solo a pedir el certificado de apto físico para jugar al fútbol en el club. Hace 3 años que no se controla.",
[
Q("A","¿Cómo encarás la entrevista?","Explicar la confidencialidad y sus límites (riesgo para su vida o la de terceros), recordando que a los 16 años decide como un adulto sobre el cuidado de su cuerpo; luego HEADSSS: hogar, escuela, actividades y pantallas, drogas, sexualidad, ánimo e ideas suicidas, y seguridad","Pedirle que vuelva con un adulto, porque es menor","Garantizarle confidencialidad absoluta, sin excepciones","Preguntar sólo por antecedentes deportivos","Cuadernillo: entre 13 y 16 años decide sobre tratamientos no invasivos; desde los 16 es considerado adulto para las decisiones sobre el cuidado de su cuerpo. Entrevista por esferas HEADSSS."),
Q("T","¿Cómo interpretás su consumo de alcohol?","Consumo episódico excesivo (5 o más tragos en un día; test de una sola pregunta positivo): consumo de riesgo, con una consulta a la guardia por intoxicación","Consumo social sin riesgo","Dependencia alcohólica que requiere internación","No corresponde evaluarlo porque es menor","Cuadernillo: test de una sola pregunta positivo si en el último año tomó 5 o más bebidas en un día (hombres). Unidad estándar: 1 botella de cerveza de 330 ml, 1 vaso de vino o 1 medida de destilado (≈ 10 g).","Vive con sus padres, su hermana Kiara (9) y el abuelo Rubén (74), que se mudó con ellos al enviudar. Repitió 4.º año. Los sábados toma \"una birra de litro y unos fernet\" (7-8 tragos) y fuma marihuana con amigos; una vez lo llevaron a la guardia \"por pasarse\". Vuelve en la moto de un amigo, sin casco. Tiene novia hace 6 meses y usan preservativo \"casi siempre\". Dice que en su casa \"está todo mal\" desde que el padre se quedó sin trabajo. Niega ideas de muerte."),
Q("E","¿Qué examen físico corresponde para el apto físico?","Peso, talla e IMC, TA, FC y FR, auscultación cardíaca (de pie, acostado y con Valsalva), pulsos femorales, agudeza visual, examen bucal, maniobra de Adams y evaluación osteomioarticular de los 2 minutos","Peso y talla únicamente","Sólo auscultación cardíaca","Tanner con examen genital y tacto rectal","Cuadernillo (adolescencia y apto físico): antropometría, TA, examen cardiovascular, visión, examen musculoesquelético de 2 minutos y Adams."),
Q("PR","¿Cuál es la problematización más completa?","Adolescente en control; consumo episódico excesivo de alcohol y consumo de marihuana; conducta vial de riesgo (moto sin casco, con conductor que toma); uso inconsistente del preservativo; repitencia escolar; crisis familiar paranormativa; calendario de vacunas a revisar","Adolescente sano, apto","Dependencia de sustancias; abandono escolar","Consumo de marihuana; repitencia","El listado del cuadernillo para adolescentes incluye consumos, riesgo de accidentes, de ITS y embarazo, rendimiento escolar, vínculos familiares y vacunas.","Peso 68 kg, talla 1,76 m, TA 118/72, auscultación normal, Adams simétrico, agudeza visual 10/10. Libreta: tiene las vacunas de los 11 años; falta la dT de los 16."),
Q("PL","¿Cómo cerrás la consulta?","Consejo breve sobre alcohol y marihuana (devolución, información de riesgos y metas), no subir a una moto con quien tomó y usar casco, preservativo en todas las relaciones con doble protección (ofrecer MAC para la pareja), serologías (VIH, VDRL, HBsAg), dT, espacio con la psicóloga y entrevista familiar si él acepta, certificado de apto y nuevo encuentro","Avisarles a los padres del consumo","Negarle el certificado hasta que deje de consumir","Derivarlo a internación por adicciones","Cuadernillo: consejería sobre sustancias, prevención de accidentes, preservativo y doble protección, serologías si inició relaciones, dT a los 16 años, y espacio de contención con entrevista familiar ante crisis vitales.")
]);
M("170-4","Consejo breve sobre alcohol y marihuana|Usar casco y no subir a una moto con quien tomó|Preservativo en todas las relaciones (doble protección)|Serologías (VIH, VDRL, HBsAg)|Vacuna dT|Certificado de apto físico","Avisarles a los padres del consumo|Negarle el certificado hasta que deje de consumir|Derivarlo a internación por adicciones");

C(15,"Kiara, 9 años",
"Hernán, el padre, trae a Kiara porque hace 3 semanas le duele la panza casi todas las mañanas antes de ir a la escuela; los fines de semana está bien. Ya consultaron dos veces en la guardia: \"le dieron buscapina y nada\".",
[
Q("A","¿Qué preguntás?","Características del dolor (horario, relación con la escuela, vómitos, fiebre, catarsis, pérdida de peso); cambios de conducta, sueño, apetito y rendimiento; cómo se lleva con sus compañeros, si tiene amigos, si perdió útiles o volvió lastimada, uso del celular y redes, y situación familiar","Sólo si tiene diarrea","Qué comió el día anterior","Si tiene parásitos","Cuadernillo (acoso escolar): somatizaciones antes de ir a la escuela, cambios de carácter y de hábitos, pérdida de útiles, lastimaduras, trastornos del sueño y del apetito, alejamiento de amigos."),
Q("E","¿Qué examen físico realizás?","Peso, talla e IMC con percentiles, TA, examen abdominal completo, piel (lastimaduras), agudeza visual y examen bucal","Ecografía abdominal y análisis de sangre antes de examinarla","Tacto rectal","Sólo palpación abdominal","Un examen físico completo y normal apoya el carácter funcional del dolor.","Hernán cuenta que Kiara está más callada, duerme mal, dejó de ir a cumpleaños y \"perdió\" dos veces la cartuchera. A solas, Kiara cuenta que unas compañeras le dicen \"gorda\" todos los días, la dejan sola en los recreos y armaron un grupo de WhatsApp para burlarse de ella. No quiere que le cuenten a la maestra."),
Q("PR","¿Cómo problematizás?","Dolor abdominal recurrente de probable origen funcional (somatización) en contexto de acoso escolar y ciberacoso; alteración del sueño; aislamiento social; crisis familiar paranormativa","Parasitosis intestinal","Conflicto escolar ocasional, sin características de acoso","Apendicitis subaguda","Es acoso: agresión sistemática, repetida y con relación asimétrica de poder; tiene además manifestaciones virtuales (ciberacoso). Con 3 semanas de evolución todavía no es un dolor abdominal crónico: el cuadernillo lo considera crónico cuando excede 1-2 meses, y Roma V exige para el síndrome de dolor abdominal no especificado (antes dolor abdominal funcional NEOM) dolor intermitente en promedio ≥ 4 días/mes, cumplido ≥ 2 meses antes del diagnóstico. Por eso se problematiza como dolor recurrente de probable origen funcional y se sigue.","Peso y talla en percentil 75, IMC en percentil 80, TA normal. Abdomen blando, indoloro. Sin lesiones en la piel."),
Q("PL","¿Qué le recomendás a la familia?","Escuchar y validar a Kiara, no culparla ni incitarla a defenderse sola; que la familia hable con la docente y las autoridades de la escuela (explicándole a Kiara por qué), no con los padres de las compañeras; acompañar el uso de redes; fomentar amistades en otros espacios; derivación a psicología y control cercano","Que los padres hablen con los padres de las compañeras","Decirle que se defienda sola y no le dé importancia","Cambiarla de escuela sin hablar con nadie","Cuadernillo: desnaturalizar la violencia, no culpar al niño ni incitarlo a defenderse, no hablar con los padres del agresor ni ir a protestar de forma agresiva, contacto con la escuela, ampliar grupos de pertenencia, acompañar el uso de redes y derivar a salud mental.")
]);
M("171-3","Escuchar y validar a Kiara sin culparla|Que la familia hable con la docente y las autoridades de la escuela|Acompañar el uso de redes|Fomentar amistades en otros espacios (club, barrio)|Derivación a psicología","Que los padres hablen con los padres de las compañeras|Decirle que se defienda sola|Cambiarla de escuela sin hablar con nadie");

C(15,"Rubén, 74 años",
"Rubén, de 74 años, padre de Silvana, viene a su control. Es ferroviario jubilado y enviudó hace 2 años; desde entonces vive con la familia de su hija. Toma enalapril 10 mg/día por HTA. Fumó 25 cigarrillos por día hasta los 55 años.",
[
Q("A","¿Qué evaluás en la anamnesis?","Esferas física, cognitiva, emocional y social: medicación, caídas, visión, audición, continencia, sueño, ánimo (duelo, preguntas de depresión), alcohol (CAGE), alimentación, AVD básicas e instrumentales, red de apoyo y vacunas","Sólo la adherencia al enalapril","Antecedentes quirúrgicos y alergias","Únicamente si tiene olvidos","Cuadernillo (adulto mayor): se evalúan las esferas física, cognitiva, emocional, social y los sentidos, con AVD (0-8) y AIVD (0-7)."),
Q("E","¿Qué examen físico realizás?","Peso, talla, IMC, TA sentado y de pie (hipotensión ortostática), agudeza visual, otoscopia, cavidad bucal, auscultación, prueba de levántate y anda, y evaluación cognitiva y del ánimo (minimental, test del reloj, Yesavage)","Sólo TA","Tacto rectal y PSA","Espirometría","Cuadernillo: TA anual con búsqueda de hipotensión ortostática, otoscopia, visión, marcha (levántate y anda), triple maniobra y escalas cognitivas y de ánimo.","Dice que \"la tele está muy baja\" y que en la mesa no entiende las conversaciones. Se cayó una vez en el baño hace 2 meses. Se levanta 3 veces por noche a orinar y le cuesta empezar a orinar. Hace todas las AVD y AIVD (el dinero se lo maneja Silvana \"por comodidad\"). Desde que murió su esposa sale poco. Toma 1 vaso de vino por día. Antigripal hace 2 años; no recibió antineumocócica."),
Q("PR","¿Cuál es la problematización más completa?","Control de adulto mayor; HTA controlada; hipoacusia (probable presbiacusia); alteración de la marcha con caída previa; síntomas del tracto urinario inferior a estudiar; duelo con menor participación social (Yesavage negativo); vacunas incompletas","Demencia; incontinencia urinaria","Depresión mayor; HTA no controlada","Adulto mayor sano","Levántate y anda > 15 segundos = anormal. Yesavage hasta 5 = negativo.","TA 134/82 sentado y 128/80 de pie. Otoscopia sin tapones; habla fuerte. Levántate y anda: 17 segundos. Yesavage: 3 puntos. Minimental normal. Agudeza visual 8/10 con anteojos."),
Q("S","¿Qué estudios y rastreos solicitás?","Audiometría (interconsulta con ORL), SOMF anual (hasta los 75), ecografía abdominal única para aneurisma de aorta (varón de 65-75 que fumó), laboratorio de riesgo cardiovascular (glucemia, lípidos, creatinina, orina, RAC) y estudio de los síntomas urinarios","PSA de rastreo y TC de tórax de baja dosis","Colonoscopia anual y densitometría de rutina","Sólo audiometría","Cuadernillo: no se recomienda el PSA de rastreo después de los 70 años (grado D). La TC de baja dosis es para 50-80 años con ≥ 20 paquetes/año que fuman o dejaron hace menos de 15 años: Rubén dejó hace 19. Los síntomas urinarios no son un rastreo: se estudian."),
Q("PL","¿Qué plan le proponés?","Antigripal anual, VCN20 en dosis única, dT si pasaron 10 años y hepatitis B si no tiene esquema; ejercicios de fuerza y equilibrio y adaptar el baño (barras, antideslizante, sin alfombras); fomentar redes (centro de jubilados); pautas sobre el alcohol; control con resultados","Indicar bastón y reposo","Sólo vacuna antigripal","Benzodiazepinas para dormir mejor","Cuadernillo: antineumocócica 2025 con VCN20 (sin vacuna previa → 1 dosis), antigripal anual, dT cada 10 años, HB 3 dosis. Si levántate y anda > 15 s: fortalecimiento de MMII, equilibrio y adaptación del hogar.")
]);
M("172-3","Audiometría|SOMF anual|Ecografía abdominal para aneurisma de aorta|Laboratorio de riesgo cardiovascular (glucemia, lípidos, creatinina, orina, RAC)","PSA de rastreo|TC de tórax de baja dosis|Densitometría de rutina");

C(15,"Rubén, 74 años (síntomas urinarios)",
"Rubén vuelve por los síntomas urinarios: desde hace un año se levanta 3 veces por noche, orina a cada rato, le cuesta arrancar, el chorro es débil y queda goteando. No tuvo fiebre ni sangre en la orina.",
[
Q("T","Completa el IPSS: 15 puntos. ¿Cómo lo interpretás?","Síntomas moderados (8-19)","Síntomas leves (0-7)","Síntomas severos (20 o más)","Sirve para diagnosticar cáncer de próstata","Cuadernillo: el IPSS gradúa los síntomas (0-7 leves, 8-19 moderados, ≥ 20 severos) y la calidad de vida, y sirve para seguir la respuesta al tratamiento."),
Q("E","¿Cómo realizás el examen?","Explicar y pedir consentimiento, con la vejiga vacía; tacto rectal valorando tamaño, consistencia, superficie, límites, sensibilidad y movilidad de la próstata; palpar el hipogastrio en busca de globo vesical","Sólo palpación abdominal","Tacto rectal sin explicar, para no incomodarlo","Ecografía en lugar de examen","Cuadernillo: duro-elástica, lisa, límites netos, indolora y móvil = benigna; duro-pétrea o nodular orienta a cáncer; dolorosa, a prostatitis."),
Q("S","¿Qué estudios pedís?","Sedimento urinario (urocultivo si hay piuria), creatinina, PSA y ecografía vesicoprostática con residuo posmiccional","Sólo PSA","Cistoscopia y biopsia de próstata","Urocultivo y antibiótico empírico","Cuadernillo (HPB): sedimento en toda evaluación inicial, creatinina, PSA (para descartar cáncer ante síntomas, a diferencia del rastreo en asintomáticos) y ecografía con residuo (normal < 10 %).","Tacto rectal: próstata aumentada de tamaño, duro-elástica, lisa, de límites netos, indolora y móvil."),
Q("PR","¿Cómo problematizás?","Síntomas del tracto urinario inferior moderados por HPB grado I, sin complicaciones","HPB grado III con retención","Prostatitis aguda","Cáncer de próstata","Cuadernillo: grado I 25-50 cc, II 50-100 cc, III > 100 cc. Residuo > 10-20 % es patológico.","Sedimento normal, creatinina 1,0 mg/dl, PSA 2,1 ng/ml. Ecografía: próstata de 38 cc, residuo posmiccional del 8 %."),
Q("PL","Los síntomas le molestan y quiere tratarse. ¿Qué indicás?","Medidas generales (evitar café, alcohol, picantes, frío y estar mucho sentado; actividad física) y tamsulosina 0,4 mg/día a la noche, advirtiendo sobre mareos y que se levante despacio por el riesgo de caídas; control con IPSS","Terazosina 10 mg desde el inicio","Finasteride por un mes y luego suspender","Cirugía de entrada","Cuadernillo: alfabloqueantes (tamsulosina, más selectiva, menos hipotensión; terazosina 5-10 mg a la noche); finasteride para próstatas grandes (> 40 cc) con síntomas obstructivos, con efecto a largo plazo; combinado en muy sintomáticos con próstata grande. Con una caída previa, el riesgo ortostático importa.")
]);

C(15,"Silvana, 44 años (control)",
"Silvana vuelve a las 2 semanas de empezar sertralina 50 mg. Dice que \"no le hace nada\" y que los primeros días tuvo náuseas.",
[
Q("A","¿Qué evaluás?","Adherencia y horario de la toma, efectos adversos y su evolución, ánimo, sueño y apetito, ideación suicida, consumo de alcohol y cómo sigue la situación familiar","Sólo si sigue con náuseas","Si quiere suspender la medicación","Nada: es demasiado pronto para controlar","Cuadernillo: citar a la 1-2 semanas para evaluar tolerancia, adherencia y riesgo."),
Q("PL","¿Qué conducta tomás?","Explicar que el efecto antidepresivo aparece a las 3-6 semanas y que las náuseas suelen ceder; continuar con la misma dosis, sostener la psicoterapia y citar cada 2-4 semanas los primeros 3 meses","Cambiar a otro IRS porque no respondió","Suspenderla por las náuseas y empezar clonazepam","Duplicar la dosis cada semana hasta que mejore","Cuadernillo: los efectos tardan 3-6 semanas; la falta de mejoría rápida y los efectos adversos iniciales favorecen el abandono, por eso se dan pautas anticipatorias.","Toma la sertralina todas las mañanas. Las náuseas cedieron. Duerme un poco mejor; no tiene ideas de muerte. Fue dos veces a la psicóloga."),
Q("T","Si a las 8 semanas, con buena adherencia, no mejorara, ¿qué opciones tenés?","Revisar adherencia, estresores, alcohol y descartar bipolaridad; cambiar a otro IRS (50 % de respuesta) y, si no responde, rotar de familia (ATC), combinar o agregar adyuvantes","Agregar benzodiazepinas de forma indefinida","Suspender todo y dar el alta","Terapia electroconvulsiva como primera opción","Cuadernillo (falla del tratamiento): evaluar adherencia, estresores, sustancias y trastorno bipolar; cambiar de IRS, luego de familia, combinar con ATC a dosis bajas o agregar litio o metilfenidato."),
Q("C","¿Cuánto debe durar el tratamiento?","Al menos 6 meses, con retiro gradual","Hasta que se sienta bien, y suspender de golpe","Dos semanas","Toda la vida","Cuadernillo: duración mínima de 6 meses; para suspender, reducir gradualmente.")
]);

C(15,"Familia Ríos (clínica ampliada)",
"En la reunión de equipo de los jueves se presenta a la familia Ríos: Hernán (47) perdió el empleo, Silvana está en tratamiento por depresión, Tobías tiene consumos y repitió, Kiara sufre acoso escolar y el abuelo Rubén, viudo, se mudó con ellos y tuvo una caída. Hernán no viene a la unidad: dice que \"los médicos son para las mujeres\".",
[
Q("T","¿Qué es la clínica ampliada?","Una clínica centrada en el sujeto y sus contextos, cuyo objeto es el cuidado, que amplía la mirada más allá del síntoma sin dejar de abordarlo","Sumar más interconsultas con especialistas","Ampliar el horario de atención","Un abordaje biomédico con más estudios complementarios","Cuadernillo: \"clínica del sujeto\"; se ocupa de la dolencia, del contexto y del propio sujeto, y busca producir autonomía."),
Q("E","¿Qué tipo de evento paranormativo es la llegada de Rubén a la casa? ¿Y los consumos de Tobías?","La llegada de Rubén es un evento de incremento; los consumos, de desmoralización","Ambos son crisis normativas","La llegada de Rubén es de desmembramiento; los consumos, de desorganización","Ambos son eventos de desorganización","Cuadernillo: desmembramiento (separación, muerte, hospitalización), incremento (llegada de miembros), desmoralización (consumos, ruptura de normas, encarcelamiento), desorganización (accidentes, discapacidad grave, pérdida de la casa)."),
Q("PL","¿Cómo se arma el proyecto terapéutico singular?","Hipótesis diagnóstica que integra todas las miradas, metas medibles negociadas con la familia, estrategias para alcanzarlas y evaluación de resultados, con responsables del equipo","Un listado de derivaciones a especialistas","Un plan que decide el médico y la familia cumple","Esperar a que Hernán consulte","Cuadernillo: el PTS tiene 4 momentos: hipótesis diagnóstica, metas, estrategias y resultados; considera el riesgo clínico, social, económico, ambiental y afectivo."),
Q("PL","¿Qué estrategias concretas propone el equipo?","Entrevista familiar (invitando a Hernán, en un horario posible, quizás con visita domiciliaria), trabajadora social para recursos y búsqueda laboral, sostener los tratamientos de Silvana y el espacio de Tobías, articulación con la escuela de Kiara y propuestas comunitarias para Rubén","Internar a Tobías y medicar a Kiara","Esperar a que la situación económica mejore","Atender a cada uno por separado sin coordinar","La clínica ampliada trabaja con el equipo interdisciplinario, la familia y la comunidad.")
]);
// Sección 15: Examen integrador — Familia Quiroga (formato de examen final)
FAM("Familia Quiroga","Néstor (60), Irma (58), su hija Celina (30) y el nieto Lisandro (5)","US Barrio Obrero");
C(15,"Néstor, 60 años",
"Ud. trabaja en la Unidad Sanitaria de Barrio Obrero, con una enfermera y un promotor de salud de lunes a viernes; la nutricionista y la trabajadora social van 2 veces por semana. Hay botiquín de Remediar, laboratorio con extracción los martes y reunión de equipo los viernes. En las próximas consultas atenderá a la familia Quiroga.\n\nNéstor, de 60 años, tiene diabetes tipo 2 desde hace 8 años y toma metformina 850 mg en almuerzo y cena. Viene a buscar la receta y a mostrar los análisis. Es chofer de colectivo.",
[
Q("A","¿Qué preguntás en la anamnesis?","Adherencia y tolerancia a la metformina, automonitoreo, síntomas de hiper e hipoglucemia, síntomas de daño de órgano blanco (angor, disnea, visión borrosa, nicturia, claudicación, parestesias, úlceras en los pies), hábitos (alimentación, actividad física, tabaco, alcohol), vacunas, vínculos y preocupaciones","Sólo si tomó la metformina","Si tuvo cetoacidosis","Sólo antecedentes familiares de diabetes","Cuadernillo (diabetes, S): tratamiento y adherencia, síntomas de hiperglucemia y de DOB, hábitos, vacunas, entorno y crisis vitales."),
Q("E","¿Qué examen físico realizás?","Peso, talla, IMC, cintura, TA, FC, pulsos periféricos, auscultación cardíaca, piel, examen de los pies (inspección, pulsos, reflejo aquiliano, diapasón y monofilamento), agudeza visual y cavidad bucal","Sólo peso y TA","Fondo de ojo con dilatación en la consulta","Tacto rectal","Cuadernillo (diabetes, O): antropometría, TA, pulsos, piel y sensibilidad, examen de pies, agudeza visual y examen bucal.","Toma bien la metformina, sin molestias. Fuma 15 cigarrillos por día. Come en la terminal \"lo que hay\" y toma gaseosa. No hace actividad física. Tiene hormigueos en los pies a la noche. Antigripal el año pasado; no recibió antineumocócica."),
Q("PR","¿Cuál es la problematización más completa?","DM2 no controlada (HbA1c 8,4 %) con probable neuropatía periférica; obesidad; dislipemia (LDL 128); tabaquismo; sedentarismo; alimentación inadecuada; vacunas incompletas","DM2 controlada; obesidad","DM2 con nefropatía; HTA; tabaquismo","DM1 descompensada","Meta del cuadernillo: HbA1c < 7 % y glucemia en ayunas 80-130 mg/dl. RAC < 30 = sin microalbuminuria.","Peso 96 kg, talla 1,72 m (IMC 32,4), cintura 110 cm, TA 132/82. Laboratorio: glucemia 168 mg/dl, HbA1c 8,4 %, LDL 128 mg/dl, TG 210, creatinina 0,9 mg/dl, RAC 18 mg/g, orina sin proteinuria. ECG normal."),
Q("PL","¿Cómo ajustás el tratamiento de la diabetes?","Llevar la metformina a 1000 mg c/12 h (máx. 2000 mg/día) y agregar un segundo fármaco: sulfonilurea (gliclazida o glimepirida) según el cuadernillo, o según la guía SAD 2025 preferir uno que baje de peso (arGLP-1 o iSGLT-2), con la gliclazida como opción accesible; plan alimentario y actividad física; control en 2 semanas y HbA1c en 3 meses","Pasar directamente a insulina NPH","Suspender la metformina y empezar glibenclamida","Mantener la misma dosis y repetir la HbA1c en un año","Cuadernillo: sulfonilurea si tras 3 meses con plan alimentario, actividad física y metformina no hay control; iSGLT2 o aGLP-1 si hay ECV establecida, muy alto RCV o ERC estadio 3 o más; insulina si no hay control tras 6 meses de tratamiento oral combinado, o con HbA1c > 10 %. La glibenclamida no es 1ª opción por las hipoglucemias. Guía SAD de DM2 2025: con HbA1c 7,5 a < 10 % corresponde terapia dual; con obesidad se priorizan arGLP-1 (semaglutida, eficacia muy alta para el peso) o iSGLT-2; las sulfonilureas siguen siendo una opción por costo (la gliclazida es la de menor riesgo de hipoglucemia; no glibenclamida). Reevaluar cada 3-6 meses."),
Q("PL","¿Qué más indicás para reducir el riesgo cardiovascular y prevenir complicaciones?","Rosuvastatina 10 mg/día, AAS 100 mg/día (más de 50 años con diabetes y otro FRCV), consejo antitabaco, vacunas (antigripal, antineumocócica conjugada, dT), fondo de ojo y ECG anuales, RAC y creatinina, y cuidado de los pies","Sólo dieta","Simvastatina sólo si el LDL supera 190","Clopidogrel como primera opción","Cuadernillo: sin ECV y con 40 años o más → rosuvastatina 10 mg/día; AAS 100 mg en DBT > 50 años con al menos 1 FRCV adicional. ⚠ La GPC Nacional de HTA 2026 reserva la AAS para ECV establecida en personas con HTA; Néstor no es hipertenso, así que vale lo del cuadernillo para diabetes. La Guía SAD de DM2 2025 agrega: actividad física aeróbica 150-300 min/semana más fuerza 2-3 días, sodio < 2300 mg/día, pérdida de peso ≥ 5 %, alcohol ≤ 2 bebidas/día en hombres, rastreo anual de depresión (PHQ-9) y de trastornos del sueño.")
]);

C(15,"Néstor, 60 años (pies)",
"Néstor vuelve al mes. Cuenta que los hormigueos en los pies lo despiertan a la noche y que tiene \"la piel de los talones partida\". Usa ojotas en la casa y anda descalzo en el patio.",
[
Q("E","¿Cómo examinás los pies?","Inspección de ambos pies y entre los dedos (heridas, callos, grietas, micosis, uñas), temperatura, pulsos pedio y tibial posterior, reflejo aquiliano, sensibilidad con diapasón y monofilamento","Sólo mirar la planta","Radiografía de pies","Palpar sólo el pulso pedio","Cuadernillo (pie diabético): pie frío o pulsos débiles orientan a vasculopatía; diapasón y monofilamento para neuropatía."),
Q("PR","¿Cómo problematizás?","Neuropatía periférica diabética sin vasculopatía; hiperqueratosis de talones con grietas; tiña pedis interdigital; cuidado inadecuado de los pies (descalzo, ojotas)","Arteriopatía periférica grave","Pie de Charcot","Pie sano","El cuadernillo lista hiperqueratosis de talón y tiña pedis como problemas del pie diabético; la neuropatía aumenta el riesgo de úlceras.","Hiperqueratosis con fisuras en ambos talones, descamación y maceración entre el 4.º y 5.º dedo de ambos pies. Uñas engrosadas. Pulsos pedio y tibial posterior presentes, pies tibios. Monofilamento: no siente en 3 de 10 puntos de cada pie. Aquilianos disminuidos."),
Q("PL","¿Qué cuidados le indicás?","Revisar los pies todos los días; baño templado y secado suave entre los dedos; vaselina después del baño; uñas rectas; calzado cómodo y blando, nunca descalzo; medias sin costuras; los callos los trata un profesional; no usar callicidas ni productos irritantes; tratar la tiña pedis","Cortar los callos en casa con una hoja de afeitar","Baños de pies con agua bien caliente","Usar zapatos nuevos todo el día para que se adapten","Cuadernillo: los 12 cuidados del pie diabético, con tratamiento de la tiña pedis."),
Q("C","¿Qué pautas de alarma le das?","Consultar ante cualquier herida, ampolla, cambio de color, calor, hinchazón o dolor en un pie, o si aparece fiebre","Consultar sólo si el pie se pone negro","No hace falta: la neuropatía no tiene complicaciones","Esperar al control del año","Con neuropatía, una lesión puede pasar inadvertida por la falta de dolor.")
]);
M("177-2","Revisar los pies todos los días|Secar bien entre los dedos y aplicar vaselina|Cortar las uñas rectas|Calzado cómodo y blando, nunca descalzo|Tratar la tiña pedis","Cortar los callos en casa|Baños de pies con agua bien caliente|Usar zapatos nuevos todo el día");

C(15,"Irma, 58 años",
"Irma, esposa de Néstor, consulta por dolor en la cadera derecha desde hace un año, que empeoró en los últimos meses. Cuida a su nieto Lisandro mientras su hija trabaja.",
[
Q("A","¿Qué preguntás?","Características del dolor (ALICIA): relación con el movimiento y alivio con el reposo, rigidez y su duración, irradiación, dolor nocturno, fiebre o pérdida de peso, traumatismos, limitación para las actividades, medicación que usa (AINE) y antecedentes de enfermedades reumáticas","Sólo la intensidad del dolor","Si tuvo cálculos en la vesícula","Antecedentes de alergias únicamente","Cuadernillo (artrosis, S): ALICIA, rigidez, antecedentes, sobreuso, obesidad, autonomía y medicación."),
Q("E","¿Qué examen realizás?","Peso, talla, IMC, TA, marcha, inspección y palpación de la cadera, movilidad activa y pasiva comparando con el lado sano, medición de los miembros","Sólo palpación lumbar","Punción articular","Tacto rectal","Cuadernillo: evaluar la articulación y compararla siempre con la contralateral.","El dolor aparece al caminar y al subir escaleras, mejora con el reposo, rigidez de menos de 15 minutos al levantarse. No la despierta de noche. Sin fiebre ni pérdida de peso. Toma ibuprofeno 400 mg 3 veces por día \"desde hace meses\". Camina 20 cuadras por día para llevar al nieto al jardín."),
Q("S","Pedís una Rx de cadera de frente. ¿Qué hallazgos esperás si es artrosis?","Disminución del espacio articular, osteofitos marginales, esclerosis subcondral y quistes subcondrales","Lesiones líticas en sacabocado","Ensanchamiento del espacio articular","Reacción perióstica en catáfilas de cebolla","Cuadernillo: pinzamiento del espacio articular, osteofitos, esclerosis y quistes subcondrales; en estadios avanzados, deformidad y subluxación.","Peso 82 kg, talla 1,58 m (IMC 32,8). Marcha antálgica. Dolor y limitación a la rotación interna de la cadera derecha. Miembros de igual longitud."),
Q("PR","¿Cuál es la problematización más completa?","Coxartrosis derecha; obesidad; uso crónico de AINE; sobrecarga como cuidadora","Artritis séptica de cadera","Necrosis avascular que requiere cirugía urgente","Lumbalgia con radiculopatía","El uso crónico de AINE suma riesgo gastrointestinal, renal y cardiovascular.","Rx: disminución del espacio articular superior y osteofitos en la cadera derecha."),
Q("PL","¿Qué plan le indicás?","Educación (enfermedad crónica, no siempre progresiva); ejercicios de fortalecimiento, bicicleta fija o natación 30 min 3 veces por semana; bajar de peso; bastón en la mano izquierda; calzado de horma ancha y suela acolchada; kinesiología; paracetamol en lugar del ibuprofeno crónico (tramadol si no alcanza); interconsulta con traumatología ante signos de alarma","Reposo y evitar caminar","Bastón en la mano derecha","Ibuprofeno 600 mg c/6 h de forma indefinida","Cuadernillo: el bastón se usa en la mano contralateral a la articulación afectada. Fármacos (paracetamol, opioides) cuando el resto de las medidas no alcanza. Interconsulta ante dolor en reposo, claudicación, fiebre, atrofia, dudas diagnósticas o fracaso del tratamiento.")
]);

C(15,"Celina, 30 años",
"Celina, hija de Néstor e Irma, consulta porque con su pareja quieren tener un segundo hijo. Es madre de Lisandro (5). Trabaja en un supermercado.",
[
Q("A","¿Qué preguntás?","Hábitos (tabaco, alcohol, drogas, alimentación, actividad física), medicación, enfermedades crónicas, antecedentes obstétricos (embarazo y parto de Lisandro, peso al nacer), antecedentes familiares (diabetes, HTA, malformaciones), vacunas, serologías previas y violencia","Sólo la FUM","Si quiere varón o nena","Únicamente si tuvo abortos","Cuadernillo (control preconcepcional, S): hábitos, antecedentes familiares, obstétricos y personales, y violencia familiar."),
Q("E","¿Qué examen físico realizás?","Examen clínico, TA, peso y talla, examen mamario y genital (con toma de PAP o test de VPH según corresponda)","Sólo TA","Ecografía transvaginal","Ninguno hasta que esté embarazada","Cuadernillo (O): examen clínico, TA, peso, talla, examen genital y mamario.","Fuma 5 cigarrillos por día. No toma medicación. Lisandro nació por cesárea, pesó 4200 g. Su padre tiene diabetes. Último PAP hace 4 años, normal. No recuerda si tiene vacunas de rubéola."),
Q("S","¿Qué laboratorio solicitás?","VIH, VDRL (también a la pareja), HBsAg, IgG rubéola, IgG toxoplasmosis, Chagas, anti-VHC; hemograma, glucemia, urea, creatinina, ácido úrico, hepatograma y orina; PAP","Sólo hemograma","Prueba de embarazo y nada más","Dosaje hormonal (FSH, LH, prolactina)","Cuadernillo: serologías y laboratorio general antes del embarazo. Tiene además factores de riesgo de diabetes (familiar de 1er grado, obesidad, hijo macrosómico).","TA 118/74, IMC 31. Examen normal."),
Q("PL","IgG rubéola negativa, IgG toxoplasmosis negativa, resto normal. ¿Qué indicás?","Doble viral (y esperar 30 días antes de buscar el embarazo), pautas de higiene para toxoplasmosis, ácido fólico 0,4 mg/día desde 1 mes y medio antes hasta las 12 semanas, dejar de fumar, alimentación y actividad física para bajar de peso, dT y HB si no las tiene","Buscar el embarazo ya y vacunar contra la rubéola durante el embarazo","Ácido fólico recién cuando tenga el test positivo","Tratamiento para toxoplasmosis por la IgG negativa","Cuadernillo: rubéola IgG negativa → vacunar y esperar 30 días; toxoplasmosis negativa → pautas de higiene; ácido fólico 0,4-4 mg/día desde 1 mes y medio antes hasta los 28 días o 12 semanas.")
]);
M("179-3","Doble viral y esperar 30 días antes de buscar el embarazo|Pautas de higiene para toxoplasmosis|Ácido fólico 0,4 mg/día desde antes del embarazo|Dejar de fumar|Plan para bajar de peso","Vacunar contra la rubéola durante el embarazo|Ácido fólico recién con el test positivo|Tratamiento para toxoplasmosis");

C(15,"Lisandro, 5 años",
"Celina trae a Lisandro al control para el ingreso a primer grado. Lo cuida la abuela Irma mientras ella trabaja.",
[
Q("A","¿Qué preguntás?","Con quién vive y quién lo cuida, si fuman en la casa, antecedentes, alimentación (lácteos, carnes, frutas y verduras, galletitas, golosinas, qué bebe con las comidas), pantallas, higiene dental, juego y actividad física, sueño, control de esfínteres y catarsis","Sólo las vacunas","Si sabe leer","Antecedentes perinatales únicamente","Cuadernillo (control 4-5 años, S): sociofamiliar, antecedentes, hábitos alimentarios, pantallas, higiene dental, actividad física, sueño, catarsis y diuresis."),
Q("E","¿Qué evaluás en el examen?","Cavidad bucal, TA, auscultación cardíaca, peso, talla e IMC con percentiles, vacunas, neurodesarrollo (2 consignas, colores, saltar en un pie, toma del lápiz) y agudeza visual","Sólo peso y talla","Tanner","Audiometría tonal de rutina","Cuadernillo (O): cavidad bucal, TA, auscultación, antropometría, vacunas, neurodesarrollo y agudeza visual (7/10 es normal de 5 a 7 años).","Come galletitas dulces y toma jugo en polvo con todas las comidas; casi no come verduras. Mira 3 horas por día el celular de la abuela. Se cepilla \"cuando se acuerda\" y nunca fue al odontólogo. Duerme bien y controla esfínteres."),
Q("PR","¿Cuál es la problematización más completa?","Control de niño sano de 5 años con desarrollo acorde; sobrepeso; caries; alimentación inadecuada con exceso de ultraprocesados y bebidas azucaradas; exceso de pantallas; vacunas del ingreso escolar pendientes","Obesidad grave; hipertensión","Ambliopía; sobrepeso","Niño sano sin problemas","Cuadernillo: IMC con puntaje Z entre +1 y +2 = sobrepeso; > +2 = obesidad. Agudeza visual 7/10 es normal a esta edad.","IMC con puntaje Z +1,5. TA normal. Caries en 3 piezas. Cumple 2 consignas, reconoce colores, salta en un pie. Agudeza visual 7/10 en ambos ojos. Libreta: no recibió las vacunas del ingreso escolar."),
Q("PL","¿Qué plan indicás?","Vacunas del ingreso escolar (triple viral, triple bacteriana celular y polio); odontología y cepillado diario; agua como bebida principal, 3 lácteos por día, frutas y verduras, menos galletitas y ultraprocesados; menos pantallas y más juego activo; prevención de accidentes; control al año","Dieta hipocalórica estricta","Derivar a oftalmología por la agudeza visual","Vacuna HPV y dTpa","Cuadernillo: consejería alimentaria (agua, lácteos, frutas y verduras, galletitas como golosinas), cepillado y control odontológico, pantallas, prevención de accidentes y vacunas acordes a la edad.")
]);

C(15,"Familia Quiroga (clínica ampliada)",
"Irma vuelve a los 3 meses. Dice que está \"agotada\": cuida a Lisandro todas las tardes, cocina aparte para Néstor y discuten porque él \"esconde facturas\". Celina se mudó con su pareja a la vuelta. Néstor bajó 3 kg pero sigue fumando.",
[
Q("T","¿En qué etapa del ciclo vital familiar están Néstor e Irma?","Contracción: desde la independencia de un hijo hasta la muerte de uno de los cónyuges","Formación","Extensión","Disolución","Cuadernillo: formación (matrimonio-1er hijo), extensión (1er hijo-independencia de uno), contracción (independencia-muerte de un cónyuge), disolución (muerte del 1er cónyuge-muerte del 2º)."),
Q("PR","¿Qué problemas agregás a la lista de Irma?","Sobrecarga de la cuidadora y conflicto de pareja en torno a la alimentación de Néstor","Depresión mayor","Ninguno: es esperable","Demencia","Ante una crisis vital se abre un espacio de escucha y se evalúa el ánimo; el cansancio no alcanza para diagnosticar depresión."),
Q("PL","¿Qué estrategias propone el equipo?","Espacio de escucha para Irma; entrevista con la pareja y con Celina para repartir el cuidado de Lisandro; consulta con la nutricionista para un plan que coma toda la familia (no \"comida aparte\"); consejería antitabaco a Néstor según su etapa de cambio","Que Irma controle más a Néstor","Indicarle una benzodiazepina a Irma","Que Celina deje de trabajar","La clínica ampliada busca metas negociadas y autonomía, no más control sobre el paciente."),
Q("A","Néstor dice que \"en los próximos meses\" quiere dejar de fumar, pero todavía no puso fecha. ¿En qué etapa del cambio está?","Contemplación (piensa dejar en los próximos 6 meses, sin fecha)","Precontemplación","Preparación","Acción","Etapas de Prochaska: precontemplación (no piensa dejar en 6 meses), contemplación (lo piensa en los próximos 6 meses), preparación (en el próximo mes), acción, mantenimiento y recaída.")
]);
// Actualización: criterios Roma V (Gastroenterology 2026;170(6)) — preguntas diagnósticas agregadas
D(0,[
Q("T","¿Cómo se denomina y define este cuadro según Roma V?","Síndrome de distrés del lactante (antes cólico del lactante): comienzo antes de los 5 meses, períodos recurrentes y prolongados de llanto e irritabilidad sin causa evidente, que los cuidadores no pueden prevenir ni resolver, sin otra condición que los explique tras una evaluación adecuada","Cólico del lactante: exige llanto de más de 3 horas por día, más de 3 días por semana, como criterio clínico obligatorio","Disquecia del lactante: pujo de más de 10 minutos antes de evacuar","Cólico del lactante: llanto que cede con antiespasmódicos","El cuadernillo lo llama cólico infantil (benigno y autolimitado) y no da criterios. Roma V lo renombra síndrome de distrés del lactante, con criterios clínicos: inicio < 5 meses, llanto e irritabilidad recurrentes y prolongados, sin causa evidente, que los cuidadores no pueden prevenir ni resolver. El llanto > 3 h/día hasta las 6 semanas (> 2,5 h/día después) ≥ 3 días/semana se exige sólo para investigación clínica.")
]);
D(45,[
Q("T","¿Qué criterios diagnósticos de SII cumple Lorena?","Dolor abdominal recurrente asociado a 2 o más de: relación con la defecación, cambio en la frecuencia y cambio en la forma de las heces, en los últimos 3 meses con inicio hace más de 6 meses (frecuencia: ≥ 1 día/semana según el cuadernillo; ≥ 3 días/mes según Roma V)","Dolor abdominal asociado a 1 solo de los 3 criterios, con 2 meses de evolución","Diagnóstico de exclusión: se confirma sólo con colonoscopia normal","Dolor abdominal continuo que no se relaciona con la defecación","Cuadernillo (Roma 2016/IV): dolor abdominal recurrente ≥ 1 día/semana en los últimos 3 meses, con ≥ 2 de: relación con la defecación, cambio de consistencia y cambio de frecuencia; se diagnostica por criterios, no por exclusión. Roma V: dolor O MALESTAR recurrente, no continuo, en promedio ≥ 3 días/mes en los últimos 3 meses (inicio ≥ 6 meses antes), con ≥ 2 de las mismas 3 asociaciones; criterio de apoyo: no se relaciona sólo con la menstruación. El dolor continuo orienta a dolor abdominal de mediación central."),
Q("T","¿Qué subtipo de SII tiene?","SII con predominio de diarrea (SII-D): más del 25 % de las deposiciones anormales son Bristol 6-7 y menos del 25 %, Bristol 1-2","SII mixto","SII con predominio de constipación","SII no clasificado","Roma V subtipifica con la escala de Bristol, contando sólo los días con ≥ 1 deposición anormal y sin fármacos para el hábito: SII-D Bristol 6-7 > 25 % y 1-2 < 25 %; SII-C al revés; SII-M ambos > 25 %. ⚠ El cuadernillo trata el SII según el síntoma predominante (diarrea, constipación, dolor, distensión) sin detallar la subtipificación por Bristol.","Lorena cuenta que en los días malos las heces son \"blandas, casi líquidas\" y que nunca tiene heces duras.")
]);
D(47,[
Q("T","¿Qué criterios de constipación crónica cumple Beatriz?","Dos o más de: < 3 deposiciones espontáneas por semana, heces duras (Bristol 1-2), pujo, sensación de evacuación incompleta u obstrucción, o maniobras manuales en más del 25 % de las defecaciones; heces blandas raras sin laxantes; no cumple criterios de SII","Basta con menos de 3 deposiciones por semana, aunque no le moleste","Sólo se diagnostica si hay dolor abdominal que alivia con la defecación","Exige 2 semanas de síntomas","Cuadernillo: deposiciones infrecuentes (< 3/semana) y duras, que representan un problema para el paciente; después de los 50 años, descartar cáncer de colon. Roma V la llama constipación crónica (antes constipación funcional): ≥ 2 de los 6 ítems, heces blandas raras sin laxantes y sin criterios de SII, en los últimos 3 meses con inicio ≥ 6 meses antes. Beatriz cumple < 3 deposiciones/semana, heces duras y pujo.")
]);
D(75,[
Q("T","¿Qué criterios de constipación funcional cumple Bruno?","Al menos 2 en el último mes, con ≥ 1 mes de evolución: ≤ 2 defecaciones/semana, ≥ 1 episodio de incontinencia fecal/semana, conductas retentivas, deposiciones dolorosas o duras, masa fecal grande en el recto, heces de gran diámetro; sin otra condición que lo explique y sin criterios de SII","Al menos 6 meses de evolución y 3 criterios","Sólo se diagnostica con una Rx de abdomen con materia fecal","Requiere dolor abdominal que alivia con la defecación","⚠ El cuadernillo no da criterios diagnósticos de constipación funcional en niños (sólo dice que es la causa más frecuente y que la incontinencia fecal, antes encopresis, se diagnostica por clínica). Roma V (H2a): ≥ 2 de 6 criterios en el último mes, cumplidos ≥ 1 mes antes del diagnóstico. El dolor abdominal no es criterio: si predomina y alivia con la defecación, corresponde SII. La incontinencia fecal no retentiva es otro diagnóstico (sin retención fecal).")
]);

<script>
(function(){

CASES.forEach(c=>c.q.forEach(q=>{const m=MULTI[q.key];if(!m)return;q.multi=true;q.nOk=m.ok.length;q.opts=m.ok.concat(m.wr);}));

sanitize();
function isOk(q,a){if(q.multi)return Array.isArray(a)&&a.length===q.nOk&&a.every(i=>i<q.nOk);return a===0;}
// preguntas reescritas: se descarta la respuesta guardada para que se vuelvan a responder
const REDO={dbt2025:["35-0","35-1","35-2","106-2","176-3"],guias2026b:["24-2","24-3","24-4","24-d2","27-1","27-4","90-3","121-1","121-4"],hta2026:["32-0","32-1","32-2","32-3","32-4","32-d1","32-d2","33-0","33-1","33-2","33-3","33-4","36-1","116-4","130-3"]};
if(!Array.isArray(st.rv))st.rv=[];
function applyRedo(o){let ch=false;Object.keys(REDO).forEach(v=>{if(o.rv.includes(v))return;REDO[v].forEach(k=>{delete o.a[k];if(o.d)delete o.d[k];});o.rv.push(v);ch=true;});return ch;}
if(applyRedo(st))saveLocal();
const SEL={};
if(!st.d||typeof st.d!=="object")st.d={};if(st.theme!=="dark")st.theme="light";if(st.mode!=="dev")st.mode="mc";
const DEV=st=>st.mode==="dev";
// preguntas que dependen de las opciones: sólo en multiple choice
const MCONLY=/cuál de est|\bNO\b|afirmaci|es correcta/i;
function QS(c){if(!DEV(st))return c.q;if(c.dq)return c.dq;let carry="";const out=[];
  c.q.forEach(q=>{if(MCONLY.test(q.text)&&!q.multi){if(q.info)carry+=(carry?"\n\n":"")+q.info;return;}
    const o=Object.assign({},q);if(carry){o.info=carry+(q.info?"\n\n"+q.info:"");carry="";}out.push(o);});
  return c.dq=out;}
function CL(q){return q.multi?q.opts.slice(0,q.nOk):[q.opts[0]];}
function done(q){if(DEV(st)){const r=st.d[q.key];return !!(r&&r.f);}return st.a[q.key]!==undefined;}
// orden de opciones estable por pregunta
function rng(seed){let x=seed>>>0||1;return()=>{x^=x<<13;x^=x>>>17;x^=x<<5;return (x>>>0)/4294967296;};}
CASES.forEach(c=>c.q.forEach((q,i)=>{const r=rng((c.id+1)*7919+(i+1)*104729);const n=q.opts.length;const ord=[...Array(n).keys()];for(let k=n-1;k>0;k--){const j=Math.floor(r()*(k+1));[ord[k],ord[j]]=[ord[j],ord[k]];}q.ord=ord;}));
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function caseStat(c){const qs=QS(c);let ans=0,ok=0,it=0,itn=0;
  if(DEV(st))qs.forEach(q=>{const r=st.d[q.key];if(r&&r.f){ans++;const n=CL(q).length,k=(r.c||[]).length;it+=k;itn+=n;if(k===n)ok++;}});
  else qs.forEach(q=>{const a=st.a[q.key];if(a!==undefined){ans++;if(isOk(q,a))ok++;}});
  return{ans,ok,n:qs.length,it,itn};}
function secStat(s){let ans=0,n=0;CASES.filter(c=>c.s===s).forEach(c=>{const x=caseStat(c);n++;if(x.ans===x.n)ans++;});return{ans,n};}
function renderMeter(){let qa=0,ok=0,done=0,it=0,itn=0,n=CASES.length;CASES.forEach(c=>{const x=caseStat(c);qa+=x.ans;ok+=x.ok;it+=x.it;itn+=x.itn;if(x.ans===x.n)done++;});
  document.querySelectorAll(".mode button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.m===st.mode));
  if(DEV(st)){$("#gtxt").textContent=done+"/"+n+" casos";$("#gbar").style.width=(n?done/n*100:0)+"%";$("#gpct").textContent=itn?Math.round(it/itn*100)+"% de ítems":"—";return;}
  $("#gtxt").textContent=done+"/"+n+" casos";$("#gbar").style.width=(n?done/n*100:0)+"%";$("#gpct").textContent=qa?Math.round(ok/qa*100)+"% correctas":"—";}
function renderIdx(){
  const ol=$("#idx");ol.innerHTML="";const ch=$("#chips");ch.innerHTML="";
  SECTIONS.forEach(([name,col],i)=>{const n=CASES.filter(c=>c.s===i).length;const x=secStat(i);
    const li=document.createElement("li");
    li.innerHTML=`<button type="button" style="--c:${col}" aria-current="${st.sec===i}"><span class="dot"></span><span>${esc(name)}</span><span class="cnt">${x.ans}/${x.n}</span></button>`;
