}
function centerChip(){const ch=$("#chips");const cur=ch.querySelector('[aria-current="true"]');if(cur&&ch.offsetParent!==null){ch.scrollLeft=cur.offsetLeft-ch.clientWidth/2+cur.clientWidth/2;}}
function updCounts(){const btns=document.querySelectorAll("#idx .cnt"),cb=document.querySelectorAll("#chips .cnt");SECTIONS.forEach((_,i)=>{const x=secStat(i);if(btns[i])btns[i].textContent=x.ans+"/"+x.n;if(cb[i])cb[i].textContent=x.ans+"/"+x.n;});}
function pillFor(x){if(!x.ans)return`<span class="pill">${x.n} preguntas</span>`;
  if(x.ans<x.n)return`<span class="pill mid">${x.ans}/${x.n} respondidas</span>`;
  if(DEV(st)){const f=x.itn?x.it/x.itn:0;const cls=f>=0.8?"done":(f>=0.6?"mid":"low");return`<span class="pill ${cls}">${Math.round(f*100)}% de ítems</span>`;}
  const f=x.ok/x.n;const cls=f>=0.8?"done":(f>=0.6?"mid":"low");return`<span class="pill ${cls}">${x.ok}/${x.n} correctas</span>`;}
function renderSection(openId){
  const s=st.sec,[name,col]=SECTIONS[s];
  document.documentElement.style.setProperty("--c",col);setAccent(col);
  const list=CASES.filter(c=>c.s===s);
  $("#secintro").innerHTML=SECINTRO[s]||"";
  {const ob=$("#openDose");if(ob)ob.onclick=openDoses;}
  $("#sechead").innerHTML=`<div><span class="num">Sección ${s+1} de ${SECTIONS.length} · ${list.length} casos${(()=>{const n=new Set(list.map(c=>c.fam).filter(Boolean)).size;return n?` · ${n} familias`:"";})()}</span><h2>${esc(name)}</h2></div>
   <div class="filters"><label for="pend"><input type="checkbox" id="pend" ${st.pend?"checked":""}> Sólo casos sin terminar</label></div>`;
  $("#pend").onchange=e=>{st.pend=e.target.checked;save();renderSection();};
  const box=$("#cases");box.innerHTML="";
  const shown=list.filter(c=>{const x=caseStat(c);return !st.pend||x.ans<x.n;});
  if(!shown.length){box.innerHTML=`<div class="empty">Terminaste todos los casos de esta sección. Desmarcá el filtro para revisarlos.</div>`;return;}
  if(shown.some(c=>c.fam)){
    const groups=[];shown.forEach(c=>{const f=c.fam||{name:"Otros casos",who:"",where:"",i:999};let g=groups.find(x=>x.f===f);if(!g)groups.push(g={f,cs:[]});g.cs.push(c);});
    groups.forEach(g=>{const all=list.filter(c=>c.fam===g.f);const done=all.filter(c=>{const x=caseStat(c);return x.ans===x.n;}).length;
      const w=document.createElement("section");w.className="fam";
      w.innerHTML=`<div class="famh"><div><span class="num">Familia ${g.f.i+1}${g.f.where?" · "+esc(g.f.where):""}</span><h3>${esc(g.f.name)}</h3>${g.f.who?`<p>${esc(g.f.who)}</p>`:""}</div><span class="famc">${done}/${all.length} casos</span></div><div class="famcases"></div>`;
      const fc=w.querySelector(".famcases");g.cs.forEach(c=>fc.appendChild(caseEl(c,c.id===openId)));box.appendChild(w);});
    return;}
  shown.forEach(c=>box.appendChild(caseEl(c,c.id===openId)));
}
function caseEl(c,open){
  const d=document.createElement("details");d.className="case";d.id="caso-"+c.id;d.style.setProperty("--c",SECTIONS[c.s][1]);if(open)d.open=true;
  const parts=c.t.split(",");const nm=parts.shift();const rest=parts.join(",").trim();
  d.innerHTML=`<summary><div class="pt"><b>${esc(nm)}</b><small>${esc(rest)}</small></div><span class="pill-slot">${pillFor(caseStat(c))}</span></summary><div class="body"></div>`;
  const fill=()=>{const b=d.querySelector(".body");if(b.dataset.ready)return;b.dataset.ready=1;buildBody(c,b,d);};
  if(open)fill();d.addEventListener("toggle",()=>{if(d.open)fill();});
  return d;
}
function buildBody(c,b,d){
  let h=`<div class="hc"><span class="lbl">Historia clínica</span>${c.v.split(/\n\n+/).map(p=>`<p>${esc(p)}</p>`).join("")}</div>`;

  const qs=QS(c);
  qs.forEach((q,i)=>{h+=`<div class="step" data-s="${i}">${q.info?`<div class="evo"><span class="lbl">Evolución</span><p>${esc(q.info)}</p></div>`:""}<div class="q" data-i="${i}"><div class="qh"><span class="qn">${i+1}/${qs.length}</span><div class="qt">${esc(q.text)}<span class="tag ${q.type}">${TAGS[q.type]}</span>${updOf(q)?`<span class="tag upd" title="Actualizado según ${esc(updOf(q))}. Ver «Actualizaciones de guías» al pie.">Actualizado</span>`:""}</div><a class="rep" target="_blank" rel="noopener" title="Reportar un error en esta pregunta" href="${repURL(`${MNAME[st.mode]} · Sección ${c.s+1}: ${SECTIONS[c.s][0]} · Caso ${c.t} · Pregunta ${i+1}/${qs.length}: ${q.text} [${q.key}]`)}">⚑ Reportar</a></div>${q.multi&&!DEV(st)?`<div class="mhint">Seleccioná todas las correctas (puede haber más de una) y confirmá.</div>`:""}<div class="opts"></div><div class="exp" hidden></div></div></div>`;});
  h+=`<div class="lock" hidden></div><div class="foot"><span class="score"></span><span style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="tbtn redo">Rehacer caso</button><button type="button" class="tbtn primary next">Siguiente caso</button></span></div>`;
  b.innerHTML=h;
  qs.forEach((q,i)=>drawQ(c,q,b.querySelector(`.q[data-i="${i}"]`),d));
  steps(c,b);updFoot(c,b,d);
  b.querySelector(".redo").onclick=()=>{qs.forEach(q=>{if(DEV(st))delete st.d[q.key];else{delete st.a[q.key];delete SEL[q.key];}});save();qs.forEach((q,i)=>drawQ(c,q,b.querySelector(`.q[data-i="${i}"]`),d));steps(c,b);updFoot(c,b,d);renderMeter();updCounts();};
  b.querySelector(".next").onclick=()=>nextCase(c);
}
function after(c,el,d,y){const b=d.querySelector(".body");steps(c,b);updFoot(c,b,d);renderMeter();updCounts();if(Math.abs(window.scrollY-y)>2)window.scrollTo(0,y);}
function drawQ(c,q,el,d){
  if(DEV(st))return drawD(c,q,el,d);
  if(q.multi)return drawM(c,q,el,d);
  const a=st.a[q.key];const opts=el.querySelector(".opts");const exp=el.querySelector(".exp");opts.innerHTML="";
  q.ord.forEach((oi,pos)=>{const bt=document.createElement("button");bt.type="button";bt.className="opt";
    bt.innerHTML=`<span class="k">${"abcdefghij"[pos]})</span><span>${esc(q.opts[oi])}</span>`;
    if(a!==undefined){bt.disabled=true;if(oi===0)bt.classList.add("ok");else if(oi===a)bt.classList.add("bad");else bt.classList.add("dim");}
    else bt.onclick=()=>{const y=window.scrollY;st.a[q.key]=oi;save();drawQ(c,q,el,d);fx(el);after(c,el,d,y);};

  else{exp.hidden=false;exp.className="exp "+(a===0?"ok":"bad");exp.innerHTML=`<b>${a===0?"Correcto.":"Incorrecto. La respuesta es: "+esc(q.opts[0])}</b>${esc(q.exp)}`;}
}
function drawM(c,q,el,d){

function fmtU(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");}
function updCases(u){return CASES.filter(c=>(!u.secs||u.secs.includes(c.s))&&c.q.some(q=>u.re.test(q.text+" "+q.exp+" "+(q.opts||[]).join(" "))));}
function updBody(u){
  let h=u.b.map(x=>(x.h?`<h4>${esc(x.h)}</h4>`:"")+(x.n?`<p class="unote">${fmtU(x.n)}</p>`:"")+(x.li?`<ul>${x.li.map(i=>`<li>${fmtU(i)}</li>`).join("")}</ul>`:"")+(x.t?`<div class="tw"><table${x.t[0].length<3?' class="t2"':""}><thead><tr>${x.t[0].map(c=>`<th>${fmtU(c)}</th>`).join("")}</tr></thead><tbody>${x.t.slice(1).map(r=>`<tr>${r.map((c,i)=>i?`<td>${fmtU(c)}</td>`:`<td><b>${fmtU(c)}</b></td>`).join("")}</tr>`).join("")}</tbody></table></div>`:"")).join("");
  const cs=updCases(u);
  if(cs.length)h+=`<h4>Casos con preguntas actualizadas (${cs.length})</h4><div class="gcases">${cs.map(c=>`<button type="button" data-c="${c.id}">${esc(c.t)} · ${esc(SHORT[c.s])}</button>`).join("")}</div>`;
  return h;}

function renderAcct(){const w=$("#acctWrap");if(!w)return;if(!SYNC_OK){w.innerHTML="";return;}
  if(!fbUser){w.innerHTML=sstate==="load"?`<span class="sst">Conectando…</span>`:`<button type="button" class="acct" id="login">Iniciar sesión</button>`;const b=$("#login");if(b)b.onclick=login;return;}
  const nm=(fbUser.displayName||fbUser.email||"?").trim();const st2={ok:"☁ Guardado",pending:"Guardando…",sync:"Sincronizando…",error:"⚠ Sin sincronizar"}[sstate]||"☁";
  w.innerHTML=`<span class="sst${sstate==="error"?" err":""}">${st2}</span><button type="button" class="acct" id="acctB" title="${esc(fbUser.email||"")}"><span class="av">${esc(nm[0].toUpperCase())}</span>Salir</button>`;
  $("#acctB").onclick=logout;}
async function initSync(){if(!SYNC_OK)return;sstate="load";renderAcct();
  try{if(window.__fbStub){fb=window.__fbStub;}else{const B="https://cdn.jsdelivr.net/npm/firebase@10.14.1/";await loadScript(B+"firebase-app-compat.js");await loadScript(B+"firebase-auth-compat.js");await loadScript(B+"firebase-firestore-compat.js");fb=window.firebase;fb.initializeApp(FB_CONFIG);}
    db=fb.firestore();fb.auth().getRedirectResult().catch(()=>{});
    fb.auth().onAuthStateChanged(u=>{fbUser=u;sstate=u?"sync":"";renderAcct();if(VIEW==="home")renderHome();if(u)pull();});
  }catch(e){sstate="";fb=null;const w=$("#acctWrap");if(w)w.innerHTML=`<span class="sst err">Sincronización no disponible</span>`;}}
function login(){if(!fb)return;const p=new fb.auth.GoogleAuthProvider();p.setCustomParameters({prompt:"select_account"});
  fb.auth().signInWithPopup(p).catch(e=>{const c=e&&e.code||"";if(/popup-blocked|operation-not-supported|web-storage-unsupported/.test(c))fb.auth().signInWithRedirect(p);else if(!/popup-closed|cancelled-popup/.test(c))toast("No se pudo iniciar sesión");});}
async function logout(){if(!fb)return;clearTimeout(syncT);if(st.dirty)await push();await fb.auth().signOut();
  st.a={};st.d={};delete st.uid;st.dirty=false;saveLocal();show(VIEW==="cases"?"secs":VIEW,{nopush:true});toast("Sesión cerrada: tu progreso queda guardado en tu cuenta");}
function ref(){return db.collection("progreso").doc(fbUser.uid);}
async function pull(){try{const snap=await ref().get();const r=snap.exists?snap.data():null;
    if(r){const rem={a:r.a||{},d:r.d||{},rv:Array.isArray(r.rv)?r.rv:[]};applyRedo(rem);
      if(st.uid===fbUser.uid&&!st.dirty){st.a=rem.a;st.d=rem.d;}
      else{st.a=Object.assign({},rem.a,st.a);st.d=Object.assign({},rem.d,st.d);}
      st.rv=[...new Set([...rem.rv,...st.rv])];}
    st.uid=fbUser.uid;sanitize();saveLocal();await push();
    show(VIEW,{nopush:true,keepScroll:true});
  }catch(e){sstate="error";renderAcct();}}
function push(){if(!fbUser||!db)return Promise.resolve();clearTimeout(syncT);st.dirty=true;saveLocal();
  return ref().set({a:st.a,d:st.d,rv:st.rv,updated:Date.now()}).then(()=>{st.dirty=false;saveLocal();sstate="ok";renderAcct();}).catch(()=>{sstate="error";renderAcct();});}
function syncSoon(){if(!fbUser||!db)return;st.dirty=true;saveLocal();sstate="pending";renderAcct();clearTimeout(syncT);syncT=setTimeout(push,1500);}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"&&fbUser&&st.dirty)push();});
try{history.replaceState({v:"home",sec:st.sec,mode:st.mode},"");}catch(e){}
show("home",{nopush:true});
initSync();
})();
</script>
