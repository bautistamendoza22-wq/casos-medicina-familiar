Q("P","¿Qué tratamiento indicás?","Gotas óticas de ATB + corticoide c/8 h por 5-7 días + ibuprofeno","Amoxicilina VO 10 días","Lavado de oído","Sólo analgésicos","OEA: ibuprofeno 400-600 mg c/6-8 h + gotas ATB + corticoide (neomicina o ciprofloxacina + hidrocortisona o dexametasona) c/8 h 5-7 días.","Confirmás el tímpano íntegro."),
Q("P","¿Qué le decís sobre la natación?","Evitar el agua durante el tratamiento","Nadar con normalidad","Nadar con algodón en el oído","Usar hisopos más seguido","OEA: evitar agua.","Franco tiene una competencia en 10 días."),
Q("T","¿Cuándo lo controlás y qué evaluás si persiste el dolor?","A las 48 h si persiste el dolor; evaluar ATB oral","Al mes","Nunca","A las 2 h","Control a las 48 h si persiste el dolor (evaluar ATB oral).","A las 48 h sigue con mucho dolor."),
Q("T","¿Qué consejo das sobre los hisopos?","Desaconsejarlos: no introducir objetos en el CAE","Usarlos todos los días","Usarlos con alcohol","Usarlos sólo después de nadar","Se desaconsejan hisopos y objetos en el CAE.","Franco pregunta cómo limpiarse los oídos.")
]);

C(2,"Sabrina, 17 años",
"Sabrina tiene 17 años, juega al hockey. Desde hace 5 días tiene fiebre de 38,5 °C, odinofagia intensa, cansancio marcado y \"ganglios en el cuello\". Su novio estuvo enfermo hace un mes. Ayer en la guardia le dieron amoxicilina y hoy le apareció un exantema en todo el cuerpo.\n\nExamen: amígdalas hipertróficas con exudado, adenopatías cervicales posteriores, petequias en el paladar, polo de bazo palpable. Exantema maculopapular generalizado.\n\nLaboratorio: linfocitosis con linfocitos atípicos, transaminasas levemente elevadas. Monotest positivo.",
[
Q("T","¿Cuál es el diagnóstico?","Síndrome mononucleósido (mononucleosis infecciosa)","Faringitis estreptocócica","Escarlatina","Alergia a la amoxicilina únicamente","Fiebre, faringitis exudativa, adenopatías posteriores, esplenomegalia, linfocitos atípicos y monotest positivo."),
Q("P","¿Qué hacés con la amoxicilina?","Suspenderla: no tiene indicación y el exantema es típico con ATB en la mononucleosis","Continuarla 10 días","Cambiarla por cefalexina","Agregar corticoides","Rash a los 7-10 días si recibe ATB; el tratamiento es sintomático.","Le explicás la relación entre el exantema y el antibiótico."),
Q("P","¿Qué tratamiento indicás?","Sintomático (paracetamol o AINE) y reposo","Aciclovir","Corticoides de rutina","Antibióticos de amplio espectro","Síndrome mononucleósido: sintomático (paracetamol o AINE), reposo, no realizar actividad física.","Sabrina pregunta qué tiene que tomar."),
Q("P","Sabrina quiere volver al hockey el fin de semana. ¿Qué le decís?","No realizar actividad física (riesgo con la esplenomegalia)","Puede jugar si no tiene fiebre","Puede jugar con protector","Sólo entrenar suave","El cuadernillo indica no realizar actividad física.","Tiene un torneo el sábado."),
Q("T","¿Qué estructura palpable motiva especialmente esa restricción?","El bazo aumentado","El hígado","Las amígdalas","Los ganglios","La esplenomegalia aumenta el riesgo de rotura con traumatismos. (Fisiopatología general.)","Al examen, el bazo sigue palpable.")
]);

C(2,"Lola, 3 años",
"Lola tiene 3 años y 14 kg. Desde hace 2 días tiene rinorrea acuosa, estornudos, congestión nasal y tos leve, con febrícula de 37,8 °C. Come un poco menos. Va al jardín. La madre pide \"un jarabe para la tos y algo para destaparle la nariz\" y pregunta si necesita antibiótico.\n\nExamen: buen estado general, rinorrea hialina, fauces levemente congestivas, otoscopia normal, auscultación pulmonar normal, FR 24, SatO2 98 %.",
[
Q("T","¿Corresponde antibiótico?","No: es un resfrío viral; tratamiento sintomático","Sí, amoxicilina 7 días","Sí, azitromicina 3 días","Sólo si la rinorrea se vuelve amarilla","Resfrío: educar, tratamiento sintomático, no antibióticos. Dura 7-10 días."),
Q("P","¿Qué medida es de elección en niños para la congestión?","Vapor 5-10 min, 3-5 veces/día","Pseudoefedrina oral","Oximetazolina por 10 días","Antihistamínico de 1ª generación","Niños: vapor 5-10 min, 3-5 veces/día (de elección).","La madre quiere algo para que respire mejor de noche."),
Q("T","¿Qué dice el cuadernillo sobre los descongestivos orales en niños?","Nunca en < 2 años y escaso beneficio en < 12 años","Son de 1ª línea","Se usan a cualquier edad","Son seguros en todos","Pseudoefedrina: nunca en < 2 años; escaso beneficio en < 12 años; EA cardiovasculares y del SNC.","La abuela le compró un descongestivo oral."),
Q("P","¿Corresponde dextrometorfano para la tos?","Sólo si la tos es seca y molesta: 2-6 años 7,5 mg 3 veces/día","Sí, a dosis de adulto","Sí, codeína","Nunca existe esa opción","Antitusivo sólo en tos seca: 2-6 años 7,5 mg; 6-12 años 15 mg; no en < 2 años.","La tos es seca y no la deja dormir."),
Q("T","¿Cuánto dura habitualmente el cuadro?","7-10 días","1-2 días","1 mes","3 meses","El resfrío dura 7-10 días.","La madre pregunta cuándo puede volver al jardín.")
]);

C(2,"Hernán, 35 años",
"Hernán tiene 35 años, docente de secundaria. Desde hace 3 días está disfónico después de un resfrío y de dar clases gritando; tiene tos seca y leve dolor de garganta. Afebril. No fuma. Sin disnea, estridor ni disfagia. Test de COVID-19 negativo.\n\nExamen: voz ronca, fauces levemente congestivas, sin adenopatías. SatO2 98 %, FR 14. Auscultación normal.",
[
Q("T","¿Qué medida es central en la laringitis?","Reposo de voz","Gárgaras con antibiótico","Antibiótico VO","Ninguna","Laringitis: reposo de voz; paracetamol o ibuprofeno."),
Q("P","Para el dolor, ¿qué indicás?","Paracetamol o ibuprofeno","Morfina","Corticoide IM siempre","Antibiótico","Laringitis: paracetamol o ibuprofeno.","Le duele la garganta al hablar."),
Q("P","Tiene un acto escolar en 2 días y necesita la voz. ¿Qué corticoide podría usarse?","Budesonide nebulizado 20 gotas c/8 h por 3-5 días, o meprednisona 8 mg c/8 h VO por 3 días","Dexametasona IM diaria por 2 semanas","Hidrocortisona IV","Corticoide tópico nasal","Corticoides: budesonide 20 gotas en SF nebulizado c/8 h 3-5 días, o meprednisona 8 mg c/8 h VO 3 días.","Pide algo que lo ayude a recuperar la voz rápido."),
Q("T","¿Cuándo derivás a ORL?","Si la disfonía dura > 3 semanas (crónica)","A las 24 h","Nunca","Si tiene tos","> 3 semanas (crónica) → ORL.","Hernán pregunta cuándo preocuparse si no mejora."),
Q("T","Si tuviera COVID-19, ¿cuál es criterio de internación?","SatO2 ≤ 90 % aire ambiente, disnea severa o alteración de la conciencia","Fiebre de 38 °C","Tos seca","Anosmia","COVID-19: internar si disnea severa, SatO2 ≤ 90 %, alteración de conciencia, hipoperfusión o condiciones sociales que impidan seguimiento.","Su esposa tiene COVID-19 confirmado, con tos y fiebre, SatO2 97 %.")
]);
// Nuevos casos — tanda 2 (secciones 3 a 6)
C(3,"Bianca, 3 semanas",
"Bianca tiene 3 semanas de vida, nació a término. Desde hace 5 días tiene tos en accesos, cada vez más intensa, que la pone colorada y luego morada; después de los accesos a veces vomita. Hoy, durante un acceso, \"dejó de respirar unos segundos\". Afebril. Su hermano de 8 años tiene tos de 3 semanas. La madre no recibió dTpa en el embarazo.\n\nExamen: entre accesos está bien, SatO2 96 %, sin dificultad respiratoria. Durante un acceso: tos paroxística con cianosis peribucal.\n\nHemograma: leucocitosis 28.000 con linfocitosis.",
[
Q("T","¿Cuál es el diagnóstico presuntivo?","Coqueluche (tos convulsa)","Bronquiolitis","Reflujo gastroesofágico","Neumonía bacteriana","Tos paroxística con cianosis, vómitos postusígenos, apneas, linfocitosis y contacto con tos prolongada: coqueluche."),
Q("P","¿Qué hacés con la notificación y el tratamiento?","Notificación inmediata e iniciar ATB sin esperar la confirmación","Esperar la PCR para tratar","Sólo notificar si se confirma","No notificar en lactantes","Notificación inmediata; no demorar el tratamiento por la confirmación.","Tomás las muestras."),
Q("P","Por su edad (< 1 mes), ¿qué ATB corresponde?","Azitromicina 1 dosis diaria; no claritromicina ni eritromicina","Eritromicina","Claritromicina","Amoxicilina","< 1 mes: azitromicina; no claritromicina ni eritromicina (estenosis hipertrófica de píloro). El cuadernillo no consigna dosis ni duración.","Hay que elegir el macrólido."),
Q("P","Por haber tenido una apnea, ¿dónde la manejás?","Internación: lactante con forma apneica","Ambulatorio con control a las 48 h","Domicilio con oxímetro","Guardia 2 h y alta","Lactantes con forma apneica → internar; sostén, O2 y kinesiología según clínica.","Recordás la apnea que describió la madre."),
Q("T","¿Qué hacés con los convivientes?","Profilaxis ATB a todos los convivientes y contactos cercanos, cualquier edad o estado vacunal","Sólo al hermano con tos","Nada si están vacunados","Sólo vacunarlos","Contactos: profilaxis ATB a todos (en general eritromicina); alejarlos de lactantes; aislamiento hasta 5 días de ATB.","La madre, el padre y el hermano viven con Bianca.")
]);

C(3,"Mónica, 50 años",
"Mónica tiene 50 años, empleada de limpieza. Desde hace 3 meses tiene tos seca, peor a la noche y al acostarse, con sensación de \"algo que le cae por la garganta\" y carraspeo frecuente. Tiene rinitis crónica con secreción posterior. No fuma, nunca fumó. No toma IECA. Sin fiebre, pérdida de peso ni hemoptisis. Sin pirosis.\n\nExamen: mucosa nasal congestiva, secreción en la pared posterior de la faringe con aspecto empedrado. Auscultación normal. SatO2 98 %.\n\nRx de tórax normal. Espirometría normal.",
[
Q("T","¿Cuál es la causa más probable de la tos?","Goteo nasal posterior","Cáncer de pulmón","Tuberculosis","Insuficiencia cardíaca","Rinitis con secreción posterior, carraspeo y faringe empedrada, con Rx y espirometría normales: goteo nasal posterior."),
Q("P","¿Qué prueba terapéutica propone el cuadernillo?","Descongestivo nasal + antihistamínico de 1ª generación por 1 semana","Corticoide oral 1 mes","Antibiótico 10 días","IBP 8 semanas","Prueba terapéutica: descongestivo nasal + antihistamínico de 1ª generación por 1 semana → si cede, goteo nasal posterior.","Decidís hacer una prueba terapéutica."),
Q("T","Si la tos cede con la prueba, ¿qué confirma?","Goteo nasal posterior","Asma","ERGE","Tos psicógena","Si cede → goteo nasal posterior.","A la semana la tos mejoró mucho."),
Q("T","¿Qué tos cede habitualmente sola?","La tos postinfecciosa","La tos por cáncer","La tos por TBC","La tos por IC","Tos postinfecciosa: suele ceder espontáneamente. Bronquitis eosinofílica: cede con corticoides.","Su compañera tiene tos desde que tuvo gripe hace 4 semanas."),
Q("T","¿Qué entidad responde a los corticoides?","Bronquitis eosinofílica","Goteo nasal posterior","Tos postinfecciosa","Tos por IECA","Bronquitis eosinofílica: cede con corticoides.","Otra paciente con tos crónica tiene eosinófilos en esputo y espirometría normal.")
]);

C(3,"Ezequiel, 30 años",
"Ezequiel tiene 30 años, oficinista, no fuma. Desde hace 6 días tiene tos con expectoración blanquecina, que empezó con un resfrío. Febrícula los primeros 2 días. Le molesta la tos para dormir. Pide antibiótico \"porque siempre que tengo flema me dan\". Sin comorbilidades. Sin alergias.\n\nExamen: T 36,8 °C, FC 78, FR 16, SatO2 98 %. Auscultación: roncus aislados que se modifican con la tos, sin rales crepitantes ni soplo. Sin taquipnea.",
[
Q("T","¿Qué dice el cuadernillo sobre los antibióticos en la bronquitis aguda?","Tienen pocos beneficios: es un cuadro autolimitado y viral","Siempre se indican si hay expectoración","Son obligatorios en > 30 años","Se indican si la tos dura > 3 días","Bronquitis aguda: ATB con pocos beneficios (autolimitado y viral)."),
Q("P","¿Qué analgésico/antitérmico indicás?","Paracetamol 500-1000 mg c/6-8 h (máx. 4 g/día)","Aspirina 1 g c/4 h","Corticoide oral","Morfina","Paracetamol 500-1000 mg c/6-8 h (máx. 4 g/día).","Ezequiel acepta no tomar antibiótico, pero quiere aliviar el malestar."),
Q("P","La tos no lo deja dormir. ¿Qué podés indicar?","Antitusivo (dextrometorfano 15 mg c/6 h), sabiendo que no acorta el cuadro","Mucolítico de rutina","Salbutamol regular","Antibiótico","Antitusivos si la tos genera malestar significativo (no acortan el cuadro).","Pide algo para la noche."),
Q("T","¿Qué evidencia tienen los beta-2 y los mucolíticos?","Beta-2: poca evidencia; mucolíticos: sin indicación clara","Ambos son de 1ª línea","Ambos acortan el cuadro","Están contraindicados","Beta-2: poca evidencia. Mucolíticos: sin indicación clara.","Su madre le recomendó un jarabe expectorante y un aerosol."),
Q("T","¿Qué otras medidas recomienda el cuadernillo?","Caramelos o pastillas, té caliente y no fumar","Reposo absoluto 2 semanas","Nebulizaciones con antibiótico","Dieta líquida","Medidas: caramelos/pastillas, té caliente, no fumar.","Le das las indicaciones generales.")
]);

C(3,"Daniela, 30 años",
"Daniela cursa un embarazo de 20 semanas. Tiene asma desde la infancia, bien controlada con budesonida-formoterol 160/4,5 como mantenimiento y rescate (MART a dosis baja). Al confirmarse el embarazo, dejó el inhalador por miedo a que \"le haga mal al bebé\". Desde entonces tiene síntomas casi diarios y se despierta 2 noches por semana. Usa salbutamol que le prestó su hermana.\n\nExamen: FR 18, SatO2 97 %, sibilancias espiratorias aisladas. PEF 75 % de su mejor valor. Embarazo normoevolutivo.",
[
Q("T","¿Qué le explicás sobre el ICS en el embarazo?","Todas las embarazadas con asma deben recibir ICS: reduce parto pretérmino, bajo peso y mortalidad perinatal","Hay que suspenderlo en el 1er trimestre","Es teratogénico","Sólo se usa si está internada","GINA 2026: todas con ICS; ICS y β2 no se asocian a anomalías fetales; no suspender el tratamiento habitual."),
Q("P","¿Qué indicás?","Retomar el MART con budesonida-formoterol que la controlaba","Sólo salbutamol a demanda","Corticoide oral por 3 meses","Montelukast exclusivo","No suspender el tratamiento habitual; retomar el ICS-formoterol.","Daniela acepta retomar el inhalador."),
Q("T","¿Cada cuánto la controlás durante el embarazo?","Cada 4-6 semanas","Cada 6 meses","Sólo en el parto","Cada 3 días","Embarazo: control c/4-6 semanas.","Hay que planificar el seguimiento."),
Q("P","A las 32 semanas tiene una exacerbación moderada. ¿Cómo se trata?","Igual que fuera del embarazo (SABA, ipratropio y corticoide oral)","Sin corticoides por el embarazo","Sólo oxígeno","Adelantar el parto","Tratar las exacerbaciones igual que fuera del embarazo.","Consulta con disnea, habla en frases, SatO2 93 %."),
Q("T","¿Qué vacunas recomienda GINA 2026 entre las medidas?","Neumococo, tos convulsa, COVID-19, influenza y VSR","Sólo BCG","Ninguna en el embarazo","Fiebre amarilla","Vacunación: neumococo, tos convulsa, COVID-19, influenza, VSR.","Revisás su calendario de vacunación.")
]);

C(4,"Santino, 5 años",
"Santino tiene 5 años. Desde hace 4 días tiene lesiones alrededor de la nariz y la boca que empezaron como granitos y ahora tienen costras amarillentas \"como miel\". Se rasca. Afebril, buen estado. Va al jardín, donde hay otro chico con lo mismo. Sin alergias.\n\nExamen: 3 placas pequeñas con costras melicéricas en región perinasal y peribucal, sin celulitis, sin adenopatías dolorosas importantes. Resto de la piel normal.",
[
Q("T","¿Cuál es el diagnóstico?","Impétigo","Herpes simple","Dermatitis de contacto","Escabiosis","Costras melicéricas peribucales y perinasales: impétigo."),
Q("P","Por ser localizado, ¿qué tratamiento indicás?","Ácido fusídico 2 % (de preferencia) o mupirocina 2 %, 3 veces/día por 5 días","Cefalexina VO 10 días","Corticoide tópico","Amoxicilina VO","Guía SADI de IPPB 2025: impétigo localizado → tratamiento local con ácido fusídico 2 % 3 veces/día por 5 días (preferido, para reservar la mupirocina para descolonización) o mupirocina 2 %; la mupirocina no se aplica en áreas extensas. Descostrar con agua blanca del Códex o agua D'Alibour diluidas.","Las lesiones son pocas y sin compromiso general."),
Q("P","¿Qué medidas generales das?","Lavado de manos, uñas cortas y evitar el rascado","Bañarlo con agua caliente y frotar las costras","Cubrir con nylon","Nada","Lavado de manos, uñas cortas, evitar rascado.","La madre pregunta cómo evitar que se contagien los hermanos."),
Q("P","Si fuera extenso, ¿qué ATB VO es de elección?","Cefalexina 25-50 mg/kg/día c/6 h por 5-7 días, reevaluando a las 72 h","Ciprofloxacina","TMS 3 días","Azitromicina 1 dosis","Guía SADI de IPPB 2025: impétigo bulloso, extenso o sin respuesta → cefalexina o cefadroxilo (cefalexina 25-50 mg/kg/día c/6 h; 50-100 en infecciones graves), 5-7 días, con reevaluación a las 72 h; si no mejora, amoxicilina + TMS. Alergia: clindamicina (o doxiciclina/minociclina en > 8 años). (El cuadernillo indicaba 50-100 mg/kg/día por 7-10 días.)","A los 4 días aparecen lesiones nuevas en brazos y piernas."),
Q("T","Si tuviera un forúnculo único < 5 cm sin celulitis ni compromiso sistémico, ¿qué corresponde?","Drenaje, sin ATB sistémico","ATB IV","TMS por 14 días","Corticoide","Forúnculo pequeño → tratamiento local (agua y jabón, fomentos tibios); grande y fluctuante → drenaje. Guía SADI de IPPB 2025: ATB sólo con celulitis circundante, lesiones múltiples, localización en la cara, inmunodeficiencia o compromiso sistémico, y entonces TMS 5-7 días (por la alta prevalencia de SAMR de la comunidad; alternativa doxiciclina/minociclina en > 8 años).","Su padre tiene un forúnculo de 2 cm en el muslo, afebril.")
]);

C(4,"Esteban, 40 años",
"Esteban tiene 40 años, mecánico. Desde hace años tiene placas rojas con escamas blanquecinas gruesas en codos, rodillas y cuero cabelludo, que empeoran en invierno y con el estrés. Le pican poco. Fuma y toma alcohol los fines de semana. IMC 30. Sin dolor articular. Las lesiones cubren menos del 5 % de la superficie corporal.\n\nExamen: placas eritematoescamosas bien delimitadas en codos, rodillas y cuero cabelludo; pitting ungueal leve. Sin artritis.",
[
Q("T","¿Cuál es el objetivo del tratamiento que le explicás?","Control de la enfermedad, no la curación: curso crónico-recurrente","Curarla en 1 mes","Prevenir el contagio","Eliminar las uñas afectadas","Educación: curso crónico-recurrente, objetivo de control (no curación)."),
Q("P","¿Qué tratamiento tópico es de base para las placas de codos y rodillas?","Corticoide tópico de potencia según zona, asociado a calcipotriol, más emolientes","Antibiótico tópico","Antimicótico","Corticoide oral","Tópico: corticoides según zona, calcipotriol asociado a corticoides, emolientes.","La psoriasis es leve, localizada."),
Q("P","Para el cuero cabelludo, ¿qué agregás?","Alquitranes (champú de coaltar)","Corticoide oral","Tacrolimus en todo el cuerpo","Nada","Alquitranes (coaltar champú, antralina): cuero cabelludo.","Le molesta mucho la descamación en el pelo."),
Q("T","¿Qué hábitos se relacionan con los brotes?","Estrés, infecciones, algunos fármacos y obesidad","Comer chocolate","Ducharse","Usar ropa de algodón","Evitar desencadenantes: estrés, infecciones, fármacos, obesidad.","Esteban pregunta qué puede hacer él para tener menos brotes."),
Q("T","¿Cuándo lo derivás a dermatología?","Moderada-severa, artropatía, falta de respuesta a 6-8 semanas de tópico o compromiso de uñas, cara, genitales o palmas","Siempre al diagnóstico","Nunca","Sólo si quiere fototerapia estética","Derivar: moderada-severa, artropatía, sin respuesta a 6-8 semanas, uñas/genitales/cara/palmas/plantas, impacto psicosocial.","A los 2 meses empieza con dolor e hinchazón en dedos de la mano.")
]);

C(4,"Valeria, 30 años",
"Valeria tiene 30 años. Desde hace 3 días tiene ronchas que pican mucho, que aparecen y desaparecen en distintas partes del cuerpo en menos de 24 h. No tiene edema de labios ni lengua, ni dificultad para respirar o tragar. Hace 5 días empezó con un resfrío. No tomó medicamentos nuevos salvo ibuprofeno. Trabaja como cajera.\n\nExamen: habones eritematosos, evanescentes, en tronco y miembros. Sin angioedema. TA 118/74, FC 80, SatO2 99 %, auscultación normal.",
[
Q("T","¿Qué tratamiento de base indicás?","Antihistamínico no sedante (cetirizina 10 mg/día o loratadina 10 mg/día)","Difenhidramina 50 mg c/8 h como 1ª opción","Corticoide IM","Adrenalina","Antihistamínicos no sedantes: cetirizina o loratadina 10 mg/día (preferidos a difenhidramina)."),
Q("P","¿Qué le advertís?","Que puede rebrotar pese al tratamiento","Que se cura en 1 hora","Que es contagiosa","Que tiene que dejar de trabajar","Advertir que puede rebrotar pese al tratamiento.","Valeria pregunta si con la pastilla se le van las ronchas para siempre."),
Q("T","¿Por qué se prefiere un antihistamínico no sedante para ella?","Trabaja y necesita estar alerta; los de 1ª generación son sedantes","Son más baratos","Son más potentes","No hay diferencia","Se prefieren no sedantes frente a difenhidramina (sedante). (Principio farmacológico general.)","Trabaja manejando dinero y atiende público."),
Q("P","¿Qué consejo das sobre el ibuprofeno?","Evitarlo mientras dure el cuadro, ya que los AINE pueden agravar la urticaria","Tomarlo cada 6 h","Duplicar la dosis","No tiene relación","Los AINE pueden desencadenar o agravar urticaria. (Concepto clínico general.)","Valeria toma ibuprofeno por el resfrío."),
Q("T","¿Cuál de estos signos haría cambiar la conducta a una urgencia?","Edema de labios o lengua, disfonía o dificultad respiratoria","Ronchas que cambian de lugar","Picazón nocturna","Habones en los brazos","Angioedema o compromiso respiratorio sugieren anafilaxia y requieren manejo urgente. (Criterio clínico general.)","Le das pautas de alarma.")
]);

C(4,"Estela, 48 años",
"Estela tiene 48 años, peluquera. Desde hace 3 semanas tiene las manos rojas, secas, con fisuras y picazón, sobre todo en el dorso y entre los dedos. Trabaja muchas horas con champú, tinturas y agua caliente, sin guantes, y usa anillos todo el día. Mejora cuando se toma vacaciones. Sin antecedentes de atopia.\n\nExamen: eritema, descamación, xerosis y fisuras en dorso de manos y espacios interdigitales, sin vesículas ni pústulas. Sin lesiones en otras zonas.",
[
Q("T","¿Cuál es el diagnóstico más probable?","Dermatitis de contacto irritativa","Psoriasis","Escabiosis","Tiña de las manos","Exposición a irritantes (champú, tinturas, agua) que mejora al suspender: dermatitis de contacto irritativa."),
Q("P","¿Cuál es la medida principal?","Identificar y reducir la exposición: guantes, sacarse los anillos, no trabajar con las manos mojadas","Corticoide oral","Antimicóticos","Antibióticos","Identificar y eliminar el agente; no trabajar con manos mojadas; sacarse anillos; guantes dobles; evitar agua muy caliente.","Estela no puede dejar de trabajar."),
Q("P","¿Qué cuidado de la piel indicás?","Emolientes (± urea 5 %) después de lavarse","Alcohol en gel frecuente","Jabones perfumados","Nada","Emolientes (± urea 5 % o ácido láctico 2 %) después del baño.","Pregunta qué crema usar."),
Q("P","Las lesiones están muy inflamadas. ¿Cómo usás el corticoide tópico?","Hasta 1 semana, evitando cara, genitales y pliegues","Por meses","Corticoide fluorado en la cara","No se usa","Corticoides tópicos ≤ 1 semana; evitar cara, genitales y pliegues.","Tiene mucha picazón y eritema."),
Q("P","Si se sobreinfectan las fisuras, ¿qué indicás?","Cefalexina VO","Corticoide oral","Clotrimazol","Aciclovir","Impetiginización: cefalexina VO. Prurito: hidroxicina.","Dos semanas después aparecen costras amarillentas en las fisuras.")
]);

C(5,"Rubén, 67 años",
"Rubén tiene 67 años, diabético tipo 2 de 15 años, con neuropatía periférica. Consulta para control. Camina descalzo en el patio, se corta las uñas con tijera \"bien cortitas en las puntas\" y se saca los callos con una hojita. Se lava los pies con agua muy caliente porque \"no siente bien la temperatura\".\n\nExamen: pies secos con hiperqueratosis plantar, uñas engrosadas, fisuras en talones. Sensibilidad con monofilamento disminuida en ambos pies, pulsos pedios débiles. Sin úlceras ni signos de infección. Descamación interdigital.",
[
Q("P","¿Cómo indicás el baño de pies?","Baño de pies templado 20 min a la noche y secado suave completo, entre los dedos","Agua muy caliente para ablandar","Sin secar entre los dedos","No lavarlos","Baño templado 20 min todas las noches y secado suave completo (entre los dedos)."),
Q("P","¿Cómo deben cortarse las uñas?","Rectas, rasando el extremo del dedo, nunca los ángulos","Bien cortas y redondeadas en las puntas","Con alicate en los ángulos","No cortarlas","Uñas rectas, rasando el extremo del dedo (nunca los ángulos).","Rubén te muestra cómo se las corta."),
Q("P","¿Qué le indicás sobre los callos?","Que los trate personal competente; no usar callicidas, ácidos ni hojitas","Que use callicida","Que los corte con hojita","Que los queme","Callosidades por personal competente; no irritantes, yodo, ácidos ni callicidas.","Pregunta qué hace con los callos."),
Q("T","¿Qué cuidado corresponde para la piel seca?","Vaselina 1-3 veces/semana post baño y talco 1 vez/semana","Alcohol diario","Nada","Corticoide","Vaselina 1-3 veces/semana post baño (alcohol si se ablanda demasiado); talco 1 vez/semana.","Tiene fisuras en los talones."),
Q("P","¿Qué indicás sobre el calzado?","Cómodo, blando, no ajustado; el nuevo de a 1 h/día; nunca andar descalzo","Ojotas todo el día","Descalzo en casa","Zapatos ajustados para sostener","Calzado cómodo y blando; el nuevo de a 1 h/día; no andar descalzo; medias sin costuras; revisión periódica y tratar tiña pedis.","Rubén usa ojotas o anda descalzo.")
]);

C(5,"Daniel, 50 años",
"Daniel tiene 50 años, diabético tipo 2 con metformina. En el control, el laboratorio muestra triglicéridos 520 mg/dl, LDL 110 mg/dl, HDL 32. Toma 1 litro de cerveza por día y mucha gaseosa. IMC 31. Sedentario. No tiene dolor abdominal. Sin enfermedad coronaria conocida.\n\nExamen: TA 136/86, cintura 108 cm, sin xantomas.",
[
Q("T","¿Por qué hay que tratar ya la hipertrigliceridemia?","TG > 500 mg/dl: riesgo de pancreatitis","Porque siempre se trata con TG > 150","Por el LDL","No hay que tratarla","Tratar si coronariopatía, múltiples FRCV o TG > 500 (inmediato por riesgo de pancreatitis); en la práctica desde > 350."),
Q("P","¿Qué medidas no farmacológicas indicás?","Suspender el alcohol, ↓ HC simples, ↓ peso 5-10 %, más actividad física y omega 3 ≥ 2 g/día","Sólo bajar las grasas","Dieta hiperproteica","Nada","No farmacológico: ↑ AF, ↓ peso 5-10 %, ↓ HC simples, sin alcohol, omega 3 ≥ 2 g/día, cese tabáquico.","Daniel pregunta qué tiene que cambiar."),
Q("T","¿Qué fármaco prioriza el cuadernillo?","Estatinas","Fibratos solos siempre","Ezetimibe","Omega 3 únicamente","Farmacológico: priorizar estatinas.","Es diabético de 50 años."),
Q("P","Si necesitara un fibrato combinado con estatina, ¿cuál es el preferido?","Fenofibrato 200 mg/día (100 mg post almuerzo + 100 mg post cena)","Gemfibrozil 1200 mg/día","Cualquiera","Ninguno","Fenofibrato: fibrato preferido para combinar con estatinas.","A los 3 meses los TG siguen en 400 pese a la estatina."),
Q("T","¿Qué dosis de gemfibrozil figura en el cuadernillo?","1200 mg/día (600 mg post almuerzo + 600 mg post cena)","300 mg/día","2400 mg/día","600 mg/semana","Gemfibrozil 1200 mg/día. (Combinado con estatina aumenta el riesgo de miopatía: por eso se prefiere fenofibrato.)","Su hermano toma gemfibrozil.")
]);

C(5,"Omar, 55 años",
"Omar tiene 55 años, remisero. Su esposa lo trae porque \"toma mucho\": vino todos los días, unos 2 litros, y más los fines de semana. AUDIT 22. Tiene insomnio, irritabilidad y dispepsia. Dice que \"puede dejar cuando quiera\". Hace 2 días no toma porque se quedó sin plata: está tembloroso, sudoroso, ansioso, sin alucinaciones ni confusión. Sin convulsiones previas.\n\nExamen: TA 150/95, FC 104, temblor fino, lúcido y orientado. Hígado palpable, sin ascitis ni ictericia. Ecografía previa: hígado de aspecto cirrótico, sin ascitis.",
[
Q("T","¿Qué intervención inicial corresponde en la consulta?","Intervención breve: devolución sobre el patrón de riesgo, información sobre daños y metas de cambio","Retarlo","Derivarlo a la policía","Nada si no quiere","Intervención breve: feedback, información sobre daños, metas, límites, reforzar que puede cambiar, vincular con síntomas."),
Q("P","Para la abstinencia leve, ¿qué indicás?","Diazepam 10-40 mg/día con descenso ~20 %/día en 5-7 días + tiamina 100 mg/día","Haloperidol","Sólo hidratación","Clonazepam de por vida","Abstinencia leve: diazepam 10-40 mg/día → bajar ~20 %/día (5-7 días) + tiamina 100 mg/día VO por 5 días.","Tiene un síndrome de abstinencia leve."),
Q("T","¿Para qué se da la tiamina?","Para prevenir la encefalopatía de Wernicke","Para dormir","Para el hígado","Para la presión","Tiamina 100 mg/día para prevenir Wernicke.","Su esposa pregunta para qué es la vitamina."),
Q("T","¿Cuándo hay que internarlo?","Alucinaciones, delirium tremens o convulsiones","Temblor fino","TA 150/95","Insomnio","Internar si alucinaciones, delirium tremens o convulsiones.","Le das pautas de alarma a la esposa."),
Q("P","Por la cirrosis, ¿qué medidas indicás?","Abstinencia de alcohol, vacunas hepatitis A y B y antigripal, y ecografía c/6 meses","Restringir líquidos sin ascitis","Diuréticos preventivos","Paracetamol en altas dosis","Cirrosis: abstinencia (mejora la supervivencia), vacunas HA/HB y antigripal, evitar hepatotóxicos, endoscopia de várices, ecografía c/6 meses; sin ascitis no restringir sodio ni usar diuréticos preventivos.","Pasada la abstinencia, planificás el seguimiento de la cirrosis.")
]);

C(6,"Julián, 28 años",
"Julián tiene 28 años, estudiante de posgrado. Desde hace 2 meses siente palpitaciones \"como golpes\" en el pecho, sobre todo de noche y después de tomar café. Toma 6 tazas de café y mate todo el día, fuma 10 cigarrillos y los fines de semana toma alcohol. Está muy estresado por la tesis. Sin síncope, dolor torácico ni disnea. Sin antecedentes familiares de muerte súbita.\n\nExamen: FC 82 regular, TA 120/78, sin soplos. ECG: ritmo sinusal con extrasístoles supraventriculares aisladas, sin preexcitación ni QT largo. Laboratorio con TSH, hemograma y electrolitos normales. Ecocardiograma normal.",
[
Q("T","Sin enfermedad estructural, ¿qué es lo primero?","Tranquilizar, después de responder sus dudas","Indicar amiodarona","Derivar a electrofisiología urgente","Internarlo","Sin enfermedad: tranquilizar (después de responder dudas)."),
Q("P","¿Qué cambios de hábitos indicás?","Suspender alcohol y tabaco, ↓ mate, café y té, ↑ actividad física","Más café para estar alerta","Reposo absoluto","Ninguno","Suspender alcohol y tabaco; ↓ mate, café y té; ↑ actividad física; suspender fármacos no esenciales que las provoquen.","Repasás con él su consumo diario."),
Q("P","Si persisten y son muy molestas, ¿qué fármaco figura?","Atenolol 50 mg/día","Digoxina","Verapamilo IV","Flecainida","Persistentes y molestas: atenolol 50 mg/día.","A los 2 meses, con cambios de hábitos, siguen molestándolo bastante."),
Q("T","Si la ansiedad fuera la causa, ¿qué considerar?","BZD o antidepresivos","Antiarrítmicos","Anticoagulación","Marcapasos","Ansiedad/depresión como causa: considerar BZD o antidepresivos.","Julián reconoce que tiene ataques de angustia."),
Q("T","¿Qué tipo de palpitaciones requieren otro enfoque y derivación?","Las asociadas a síncope, dolor torácico o cardiopatía","Las que aparecen con café","Las nocturnas aisladas","Las extrasístoles aisladas con eco normal","Causa cardíaca o síntomas de alarma → derivar. (Criterio clínico; ver síncope.)","Le das pautas de alarma.")
]);

C(6,"Haydée, 72 años",
"Haydée tiene 72 años, fue costurera, trabajó de pie muchos años. Tiene várices en ambas piernas desde hace décadas. Desde hace 2 meses tiene una herida en la cara interna del tobillo derecho que no cicatriza. Se la cura con iodopovidona y un apósito. Sin fiebre. No es diabética. Tiene sobrepeso.\n\nExamen: úlcera de 3 × 2 cm en maléolo interno derecho, poco profunda, con fondo granulante y exudado seroso, sin pus, celulitis ni olor. Piel circundante hiperpigmentada y endurecida. Edema maleolar. Pulsos pedios y tibiales posteriores presentes.",
[
Q("P","¿Cómo indicás la curación de la úlcera?","Lavado sin presión con agua segura o SF (no iodopovidona) y vendaje compresivo","Iodopovidona diaria","Alcohol y dejar al aire","Pomada con corticoide","Úlcera: lavado sin presión con agua segura o SF (no iodopovidona) y vendaje compresivo; curación con enfermería."),
Q("T","¿Corresponde antibiótico?","No: sin signos de infección no se indica ATB","Sí, siempre en úlceras","Sí, tópico","Sí, por la edad","No ATB sin signos de infección.","Haydée pide \"un antibiótico para que cierre\"."),
Q("P","¿Qué fármacos figuran como coadyuvantes?","Pentoxifilina 400 mg 2-3 veces/día + flavonoides (diosmina-hesperidina)","Corticoides orales","Anticoagulantes","Diuréticos","Pentoxifilina 400 mg 2-3 veces/día + flavonoides (diosmina-hesperidina).","Pregunta si hay pastillas que ayuden."),
Q("P","¿Qué medidas generales indicás para la insuficiencia venosa?","Elevar las piernas por encima del corazón 30 min, 3-4 veces/día, caminar y medias elásticas desde que se levanta","Estar de pie todo el día","Ropa ajustada","Reposo absoluto sin moverse","Elevar las piernas 30 min 3-4 veces/día, caminata diaria, flexión de tobillos, medias elásticas todo el día, evitar bipedestación prolongada.","Una vez cicatrizada, hay que prevenir recidivas."),
Q("T","Si no tolerara las medias, ¿qué alternativa figura?","Extracto de semilla de castaño de Indias","Vendas de yeso","Nada","Diuréticos","Intolerancia o CI a medias: extracto de semilla de castaño de Indias 300 mg/día o 50 mg c/12 h.","Haydée dice que las medias le dan mucho calor y no puede ponérselas.")
]);

C(6,"Nahuel, 19 años",
"Nahuel tiene 19 años, estudiante. Ayer, en un acto escolar al aire libre, estuvo de pie mucho tiempo en ayunas; sintió calor, náuseas, visión borrosa y se desmayó unos segundos. Recuperó la conciencia enseguida, sin confusión. Sin convulsiones, relajación de esfínteres, dolor torácico ni palpitaciones. No hace ejercicio cuando ocurre. Sin antecedentes familiares de muerte súbita. Primer episodio.\n\nExamen: TA 112/70 acostado y 110/70 de pie, FC 72, sin soplos, examen neurológico normal. ECG normal (sin preexcitación, QT normal, sin bloqueos).",
[
Q("T","¿Qué tipo de síncope es el más probable?","Neurocardiogénico (vasovagal)","Cardíaco arrítmico","Ortostático por fármacos","Convulsión","Bipedestación prolongada, ayuno, pródromo vegetativo, recuperación rápida y ECG normal: vasovagal."),
Q("P","Por ser un episodio único neurocardiogénico, ¿qué hacés?","Nada específico: tranquilizar y explicar desencadenantes","Holter y ecocardiograma de urgencia","Internar","Indicar betabloqueante","Episodio único neurocardiogénico: no se hace nada.","Los estudios iniciales son normales."),
Q("P","Si tuviera hipotensión ortostática, ¿qué medidas no farmacológicas figuran?","Medias elásticas, evitar ayuno y bipedestación prolongada, cabecera elevada > 10°","Reposo en cama","Restricción de sal y líquidos","Diuréticos","Hipotensión ortostática: medias elásticas, evitar ayuno y bipedestación prolongada, dormir con cabecera elevada > 10°.","Su abuela de 80 años se marea al levantarse y tiene caída de TA de pie."),
Q("T","¿Cuál de estos obliga a internar?","Síncope post ejercicio o con cardiopatía, angor, arritmia o > 70 años","Pródromo de calor y náuseas","Episodio en un acto escolar","Edad 19 años","Internar si: enfermedad coronaria, IC, arritmia ventricular, angor, valvulopatía, bloqueo AV, foco neurológico, traumatismo, post ejercicio, > 70 años.","Su compañero se desmayó mientras corría en educación física."),
Q("T","Si el síncope fuera de causa cardíaca, ¿qué corresponde?","Derivar","Sólo medias elásticas","Fluoxetina","Tranquilizar","Causa cardíaca → derivar.","Le das pautas de alarma.")
]);
// Nuevos casos — tanda 2 (secciones 7 a 9)
C(7,"Fernando, 50 años",
"Fernando tiene 50 años, chofer de larga distancia. Desde hace 6 meses tiene ardor retroesternal después de comer, regurgitación ácida y tos nocturna, unas 4-5 veces por semana. Empeora al acostarse después de cenar tarde. Toma mate todo el día y café, fuma 20 cigarrillos y tomó peso: IMC 31. Sin disfagia, pérdida de peso, vómitos ni sangrado. Hb normal.\n\nExamen: abdomen blando, sin masas. Resto normal.\n\nVEDA: esofagitis erosiva grado B de Los Ángeles, sin Barrett.",
[
Q("P","¿Qué medidas generales indicás?","Descenso de peso, elevar la cabecera y evitar desencadenantes (ácidos, cafeína, alcohol, tabaco)","Comer abundante a la noche","Acostarse después de cenar","Sólo medicación","ERGE: descenso de peso, elevar la cabecera, evitar desencadenantes."),
Q("P","¿Cómo indicás el IBP?","En ayunas, 30 min antes de comer, por 8 semanas (omeprazol 20-40 mg/día)","Después de cenar, por 1 semana","A demanda sólo con ardor","Con el mate","IBP en ayunas, 30 min antes de comer, por 8 semanas.","Iniciás tratamiento farmacológico."),
Q("T","Con síntomas frecuentes y esofagitis erosiva, ¿qué estrategia corresponde?","Step down: empezar con antisecretor potente y bajar hasta la mínima dosis eficaz","Step up: empezar con antiácidos","No tratar","Sólo cirugía","Step down para síntomas frecuentes/severos o esofagitis erosiva; step up para síntomas leves/intermitentes.","Por la esofagitis, elegís la estrategia."),
Q("T","¿Cuándo se pide VEDA de control?","En esofagitis grado C-D, a las 8 semanas","En toda esofagitis grado A","Nunca","Cada 6 meses","Esofagitis C-D: VEDA de control a las 8 semanas.","Fernando pregunta si tiene que repetir la endoscopía."),
Q("T","¿Cuándo se plantea cirugía antirreflujo?","Refractarios, sobre todo jóvenes o con altas dosis crónicas de IBP","Al diagnóstico","Nunca","Si fuma","Cirugía laparoscópica: refractarios, sobre todo jóvenes o con altas dosis crónicas de IBP.","Su hermano de 35 años necesita IBP a doble dosis desde hace años.")
]);

C(7,"Silvina, 42 años",
"Silvina tiene 42 años, 3 hijos. Anoche, después de una cena con frituras, tuvo dolor intenso en el epigastrio e hipocondrio derecho, irradiado a la escápula, con náuseas, que duró 3 horas y cedió solo. Tuvo dos episodios parecidos en el último año. Sin fiebre, ictericia ni coluria. IMC 30.\n\nExamen: afebril, Murphy negativo, sin ictericia, abdomen blando.\n\nLaboratorio: hemograma, bilirrubina, transaminasas, FAL y amilasa normales. Ecografía: múltiples litiasis en vesícula, pared normal, vía biliar no dilatada.",
[
Q("P","Durante un cólico, ¿qué analgesia indicás?","AINE (ibuprofeno 400 mg c/6 h o diclofenac 75 mg IM única) ± antiespasmódico","Morfina en dosis altas","Sólo dieta","Antibiótico","Cólico: hidratación + analgesia + dieta; AINE ± antiespasmódico; no opiáceos potentes (espasmo del Oddi)."),
Q("T","¿Qué analgésicos evita el cuadernillo y por qué?","Opiáceos potentes, por el espasmo del Oddi","Paracetamol, por el hígado","AINE, por la úlcera","Ninguno","No opiáceos potentes (espasmo del Oddi).","El esposo pregunta si no le pueden dar \"morfina para que no sufra\"."),
Q("P","¿Qué dieta indicás?","Evitar alimentos colecistoquinéticos (grasas, ciertas frutas), rica en fibra, 4 comidas","Dieta rica en grasas","Ayuno prolongado","Dieta líquida permanente","Dieta: evitar colecistoquinéticos (grasas, ciertas frutas), rica en fibra, 4 comidas.","Pregunta qué puede comer."),
Q("T","Con cólicos recurrentes, ¿qué conducta corresponde?","Cirugía (colecistectomía) electiva","Litotricia de rutina","Esperar sin hacer nada","Ácido ursodesoxicólico de por vida","Cirugía electiva: cólicos recurrentes moderados-severos o un episodio aislado severo; también ante complicaciones.","Ya tuvo 3 episodios en un año."),
Q("T","Si presentara fiebre, Murphy positivo y dolor persistente > 6 h, ¿qué corresponde?","Internación con hidratación IV, corrección electrolítica y analgesia (colecistitis aguda)","Ambulatorio con AINE","Sólo dieta","Antiespasmódico VO","Colecistitis aguda: internación, hidratación IV, corrección electrolítica y analgesia.","Dos semanas después vuelve con fiebre de 38,5 °C y Murphy positivo.")
]);

C(7,"Alfredo, 68 años",
"Alfredo tiene 68 años, hipertenso, con artrosis; toma ibuprofeno 600 mg c/8 h desde hace 2 meses y AAS 100 mg. Desde ayer tiene deposiciones negras, pastosas y malolientes, mareos al pararse y debilidad. Sin dolor abdominal ni vómitos con sangre.\n\nExamen: pálido, sudoroso, TA 95/60 acostado, FC 112, con caída de TA de pie. Tacto rectal: melena.\n\nLaboratorio: Hb 8,2 g/dl, urea elevada.",
[
Q("T","¿Cuál es el origen más probable del sangrado?","Digestivo alto (úlcera por AINE)","Hemorroides","Diverticulosis","Cáncer de recto","Melena con urea elevada en usuario de AINE + AAS: HDA, probablemente úlcera péptica."),
Q("P","¿Qué es prioritario antes de la endoscopía?","Estabilización hemodinámica","VEDA inmediata sin estabilizar","Colonoscopia","Alta con hierro","HDA: estabilización hemodinámica antes de la VEDA (diagnóstica y terapéutica).","Está taquicárdico e hipotenso."),
Q("T","¿Cada cuánto se controla la Hb?","Cada 2-8 h según gravedad","Una vez al día","Cada semana","No hace falta","Hb c/2-8 h según gravedad.","Ya está internado y con accesos venosos."),
Q("T","Si la VEDA fuera normal y siguiera con melena, ¿qué estudio sigue?","Colonoscopia","Ninguno","Rx de abdomen","Ecografía","Melena con VEDA negativa → colonoscopia.","Imaginá que la VEDA no mostrara lesión."),
Q("P","Al alta, si necesita antiinflamatorio a largo plazo por la artrosis, ¿qué recomendás?","Asociarlo con omeprazol 20 mg/día, y reconsiderar su necesidad","Seguir con ibuprofeno solo","Duplicar el AAS","Agregar corticoides","Úlcera por AINE que necesita antiinflamatorio: corto plazo ibuprofeno; prolongado con omeprazol 20 mg/día. Gastroprotección si antecedente de úlcera/HDA o ancianos.","La VEDA mostró una úlcera duodenal tratada endoscópicamente.")
]);

C(7,"Ramiro, 35 años",
"Ramiro tiene 35 años, trabajador rural en el sur de la provincia. Faena ovejas y les da las vísceras crudas a los perros, que no están desparasitados. En una ecografía por dolor leve en hipocondrio derecho se encontró un quiste hepático de 4 cm, de pared fina, univesicular, compatible con hidatidosis. Serología positiva. Sin fiebre, ictericia ni complicaciones. Hemograma y hepatograma normales. No está considerando cirugía de inmediato.",
[
Q("T","¿Qué opciones terapéuticas existen según el tipo de quiste?","Farmacológico, quirúrgico o PAIR, según tipo, tamaño y localización","Sólo antibióticos","Sólo observación siempre","Sólo radioterapia","Según tipo de quiste: farmacológico, quirúrgico (abierta o laparoscópica) o PAIR; mejor respuesta farmacológica: quistes pequeños, pared fina y pacientes jóvenes."),
Q("P","¿Qué esquema de albendazol indica el cuadernillo?","10-15 mg/kg/día c/8-12 h (máx. 400 mg c/12 h), 4 ciclos de 30 días continuos","400 mg única","200 mg/semana por 1 año","Albendazol sólo si se rompe el quiste","Albendazol 10-15 mg/kg/día c/8-12 h (máx. 400 mg c/12 h), 4 ciclos de 30 días continuos.","Se decide tratamiento farmacológico."),
Q("T","¿Qué controles pide el albendazol?","Hemograma, urea, creatinina, coagulograma y hepatograma previos y c/30 días antes de cada ciclo","Ninguno","ECG semanal","Sólo glucemia","Laboratorio (hemograma, urea, creatinina, coagulograma, hepatograma) previo y c/30 días antes de cada ciclo; ante intolerancia o laboratorio alterado, suspender 15 días.","Ramiro pregunta si necesita análisis durante el tratamiento."),
Q("T","¿En qué situaciones está contraindicado el albendazol?","Embarazo, lactancia, epilepsia, hepatopatía crónica e hipersensibilidad","HTA","Edad > 30 años","Tabaquismo","CI: embarazo, lactancia, epilepsia, hepatopatía crónica, hipersensibilidad. EA: hepatotoxicidad reversible, citopenias, alopecia.","Su esposa, que amamanta, también tiene serología positiva."),
Q("P","¿Qué medida de prevención indicás en el campo?","Desparasitar a los perros con praziquantel 5 mg/kg c/45 días y no darles vísceras crudas","Vacunar a la familia","Antibióticos a los perros","Nada","Prevención: desparasitar perros con praziquantel 5 mg/kg c/45 días en zonas endémicas, controlar la faena y eliminar las vísceras.","Ramiro pregunta cómo evitar que su familia se enferme.")
]);

C(8,"Leandro, 27 años",
"Leandro tiene 27 años, sexualmente activo con parejas ocasionales, sin preservativo. Desde hace 3 días tiene dolor en el testículo derecho, de instalación progresiva, con disuria y secreción uretral escasa. Fiebre de 37,8 °C. Sin traumatismo.\n\nExamen: hemiescroto derecho eritematoso, epidídimo engrosado y doloroso; el dolor alivia al elevar el testículo (Prehn positivo). Reflejo cremastérico presente. Testículo en posición normal.\n\nEcografía Doppler: aumento de flujo en el epidídimo, flujo testicular conservado.",
[
Q("T","¿Cuál es el diagnóstico?","Epididimitis (probable clamidia/gonococo)","Torsión testicular","Hernia inguinal","Varicocele","Inicio progresivo, uretritis, Prehn positivo, cremastérico presente y aumento de flujo: epididimitis."),
Q("P","¿Qué tratamiento indica el cuadernillo?","Ceftriaxona IM única + doxiciclina 100 mg c/12 h VO por 10 días","Ciprofloxacina 3 días","Amoxicilina 7 días","Cirugía","Epididimitis: ceftriaxona 250 mg IM única + doxiciclina 10 días (CDC 2021: ceftriaxona 500 mg).","Confirmaste el diagnóstico."),
Q("T","¿Cuándo debe reconsultar?","Si no mejora en 1 semana","A los 6 meses","Sólo si tiene fiebre de 40 °C","Nunca","Reconsultar si no mejora en 1 semana.","Le das las indicaciones."),
Q("P","¿Qué más corresponde?","Notificar y tratar a la pareja, preservativos y rastreo de VIH","Nada más","Sólo reposo","Ecografía mensual","Notificar y tratar a la pareja; educación, preservativos, rastreo de VIH.","Leandro pregunta qué hace con sus parejas."),
Q("T","Si el dolor hubiera sido brusco, con testículo alto y reflejo cremastérico ausente, ¿qué corresponde?","Sospecha de torsión: remitir de inmediato para exploración quirúrgica","Antibióticos y control","Esperar la ecografía al día siguiente","Analgésicos y reposo","Torsión testicular: exploración quirúrgica → orquidopexia u orquiectomía + fijación contralateral; ante sospecha, remitir de inmediato.","Un adolescente de 14 años llega con dolor testicular brusco que lo despertó, testículo horizontalizado y cremastérico ausente.")
]);

C(8,"Osvaldo, 60 años",
"Osvaldo tiene 60 años. Desde ayer tiene fiebre de 39 °C, escalofríos, disuria intensa, polaquiuria, dolor perineal y dificultad para orinar. Sin antecedentes de instrumentación urológica. HTA controlada. Sin alergias.\n\nExamen: T 39 °C, FC 104, TA 125/80, lúcido, buen estado general, sin signos de sepsis. Globo vesical no palpable. Tacto rectal suave: próstata caliente, edematosa y muy dolorosa (no se masajea).\n\nOrina: piuria y bacteriuria; urocultivo enviado. Tolera la VO.",
[
Q("T","¿Cuál es el diagnóstico?","Prostatitis aguda","Cistitis simple","Hiperplasia prostática","Pielonefritis izquierda","Fiebre, síntomas urinarios, dolor perineal y próstata caliente y dolorosa: prostatitis aguda."),
Q("P","¿Qué ATB empírico VO indica el cuadernillo?","Ciprofloxacina 500 mg c/12 h por 14 días (o TMS 160/800 c/12 h 14 días)","Nitrofurantoína 5 días","Fosfomicina única","Amoxicilina 7 días","Prostatitis aguda: ATB empírico VO hasta el antibiograma; ciprofloxacina o TMS por 14 días + hidratación + analgesia + reposo.","Decidís manejo ambulatorio."),
Q("T","¿Qué hay que evitar?","La instrumentación uretral","La hidratación","Los analgésicos","El reposo","Evitar instrumentación uretral.","El residente propone pasar una sonda para sacar orina."),
Q("P","Si tuviera retención urinaria completa, ¿qué se hace?","Catéter suprapúbico","Sonda vesical transuretral","Esperar","Diuréticos","Retención urinaria completa: catéter suprapúbico.","Al día siguiente no puede orinar y tiene globo vesical."),
Q("T","Si estuviera grave o inmunodeprimido, ¿qué corresponde?","Internar con ATB IV y rotar a VO al mejorar (total 4 semanas)","Ambulatorio con 7 días VO","Sólo analgesia","Cirugía","Compromiso del estado general, anciano, grave, comorbilidades o inmunodepresión → internar con ATB IV y rotar a VO al mejorar (total 4 semanas).","Su vecino de 82 años, diabético mal controlado, tiene el mismo cuadro con hipotensión.")
]);

C(8,"Norberto, 68 años",
"Norberto tiene 68 años, diabético tipo 2 de 20 años e hipertenso. Toma metformina 850 mg c/12 h, enalapril 10 mg/día y diclofenac \"cuando le duele la rodilla\", casi a diario. Controles irregulares.\n\nExamen: TA 152/92, edemas maleolares leves, IMC 29.\n\nLaboratorio: creatinina 1,7 mg/dl, FGe 40 ml/min (estable hace 6 meses), proteinuria 900 mg/día, K 4,9, Hb 11,8, HbA1c 7,8 %. Ecografía: riñones de tamaño normal, sin obstrucción.",
[
Q("P","¿Qué fármaco de su medicación debe suspender primero?","El diclofenac (AINE)","El enalapril","La metformina, siempre","Ninguno","ERC: corregir factores reversibles; evitar AINE y nefrotóxicos."),
Q("P","Con proteinuria > 500 mg/día, ¿cuál es la 1ª línea para la TA?","IECA o ARA II (enalapril o losartán)","Bloqueante cálcico dihidropiridínico solo","Betabloqueante","Furosemida sola","Con proteinuria > 500 mg/día: 1ª línea IECA o ARA II; con edema, agregar furosemida; si hace falta otra droga, preferir BC no dihidropiridínicos. Guía ESC 2026 de ECV y ERC: controlar potasio y FGe 1 a 4 semanas después de iniciar el IECA o ARA II; una caída del FGe < 30 % es esperable y no obliga a suspenderlo.","Ya suspendió el diclofenac. La TA sigue alta y tiene proteinuria."),
Q("T","¿Qué dice el cuadernillo sobre la metformina?","No usar con FG < 60 (cuadernillo); la guía SAD 2025 permite seguirla con FG 30-44 hasta 1000 mg/día, sin iniciarla","Se puede usar con cualquier FG","Está contraindicada en toda ERC","Hay que duplicarla","Cuadernillo: no metformina con FG < 60. Guía SAD de DM2 2025: dosis plena con FGe > 60; con 45-59 se continúa (si se inicia, hasta 1000 mg/día); con 30-44 no se inicia, y quien ya la toma sigue con ≤ 1000 mg/día; < 30 contraindicada. Norberto (FGe 40, 1700 mg/día) debería bajar a 1000 mg/día y sumar un iSGLT-2 (ERC con FG > 20).","Hay que revisar su tratamiento de la diabetes con FG 40."),
Q("T","¿Cuál es criterio de derivación a nefrología?","FG < 30, proteinuria > 1 g/día, hiperkalemia o acidosis persistentes, HTA resistente","FG 60 estable","Creatinina 1,0","Edad > 65","Derivar: FG < 30, proteinuria > 1 g/día, hematuria persistente sin causa, HTA resistente, hiperkalemia o acidosis persistentes, anemia sin respuesta a hierro, sospecha de glomerulopatía. La guía ESC 2026 agrega, en G3-G5, estimar el riesgo de requerir diálisis con la ecuación KFRE para derivar a tiempo.","Seis meses después: FG 28, proteinuria 1,4 g/día."),
Q("P","¿Qué medidas generales le indicás?","Dieta hiposódica, evitar nefrotóxicos, ajustar fármacos al FGe y vacunas HB, gripe y neumococo","Dieta hiperproteica","Contraste IV para controlar","Nada","General: dieta hiposódica, hidratación adecuada, actividad física, evitar AINE y nefrotóxicos, ajustar fármacos al FGe, vacunas HB, gripe y neumococo. Además, la guía ESC 2026 de ECV y ERC recomienda para la mayoría de los pacientes con ERC: IECA o ARA II + iSGLT2 (se puede iniciar con FGe ≥ 20), estatina independientemente del colesterol (si no está en diálisis) y, en DBT2 con albuminuria como Norberto, finerenona o semaglutida.","Norberto pregunta qué puede hacer él para cuidar los riñones.")
]);

C(8,"Federico, 35 años",
"Federico tiene 35 años. Desde hace 3 semanas tiene hinchazón en los párpados a la mañana y en las piernas a la tarde; aumentó 6 kg. Orina espumosa. Sin hematuria macroscópica, fiebre ni artralgias. Sin antecedentes.\n\nExamen: TA 138/86, edemas con fóvea hasta las rodillas, edema palpebral. Sin derrames clínicos.\n\nLaboratorio: proteinuria 6 g/24 h, albúmina 1,8 g/dl, colesterol 320 mg/dl, creatinina 0,9. Sedimento sin cilindros hemáticos. Serologías negativas. En estudio por nefrología.",
[
Q("T","¿Qué síndrome presenta?","Síndrome nefrótico","Síndrome nefrítico","IRA prerrenal","ITU","Proteinuria > 3,5 g/día, hipoalbuminemia, edemas e hiperlipemia: síndrome nefrótico."),
Q("P","¿Qué medidas indicás para el edema?","Dieta estricta sin sal y diuréticos","Restricción hídrica severa sola","Reposo absoluto prolongado","Corticoides sin estudio","Síndrome nefrótico: dieta estricta sin sal; diuréticos para el edema; albúmina IV en resistentes; reposo en cama 1-2 h, 1-2 veces/día.","Iniciás el manejo sintomático."),
Q("P","¿Qué fármacos usás para bajar la proteinuria?","IECA, ARA II y antialdosterónicos, vigilando FRA e hiperkalemia","AINE","Antibióticos","Corticoides en todos sin biopsia","Antiproteinúricos no inmunosupresores: IECA, ARA II, antialdosterónicos; aumentar o combinar vigilando fracaso renal agudo e hiperkalemia.","Hay que reducir la proteinuria."),
Q("T","Con albúmina de 1,8 g/dl, ¿qué prevención considerar?","HBPM preventiva por riesgo trombótico","Antibiótico profiláctico","Transfusión","Nada","HBPM preventiva si riesgo trombótico (albúmina < 1,5-2 g/dl, obesidad, encamamiento).","Federico pasa mucho tiempo en cama por los edemas."),
Q("T","¿Cuál es la meta de TA del cuadernillo para GN con proteinuria > 1 g/día?","< 125/75","< 140/90","< 150/90","< 160/100","GN primarias: TA < 135/80 (proteinuria < 1 g/día) o < 125/75 (> 1 g/día); LDL < 100.","Revisás las metas de control.")
]);

C(9,"Elsa, 64 años",
"Elsa tiene 64 años, diabética tipo 2 de 18 años. Desde hace 6 meses tiene ardor y \"pinchazos\" en ambos pies, peor de noche, que no la dejan dormir. El paracetamol no le sirve. Función renal normal, sin glaucoma ni trastornos de la conducción cardíaca (ECG normal). Vive sola.\n\nExamen: hipoestesia en \"calcetín\" bilateral, monofilamento alterado, reflejos aquilianos abolidos. Pulsos presentes. Sin úlceras.",
[
Q("T","¿Qué tipo de dolor tiene?","Neuropático (polineuropatía diabética)","Nociceptivo inflamatorio","Isquémico","Psicógeno","Ardor, pinchazos, peor de noche, con hipoestesia distal en una diabética: dolor neuropático."),
Q("P","¿Qué coadyuvante es de 1ª línea en dolor neuropático según el cuadernillo?","Amitriptilina 10-25 mg antes de acostarse, aumentando c/4-7 días","Morfina","Diclofenac","Clorzoxazona","Amitriptilina: 1ª línea en dolor neuropático, 10-25 mg antes de acostarse.","Elegís el tratamiento del dolor."),
Q("T","¿Qué efectos adversos de la amitriptilina advertís?","Anticolinérgicos, sedación, arritmias; rebote si se suspende bruscamente","Diarrea","Hipertensión severa","Ninguno","EA: anticolinérgicos, sedación, arritmias; rebote si se suspende bruscamente.","Elsa pregunta qué puede sentir con la pastilla."),
Q("P","Si no tolera la amitriptilina, ¿cómo indicás gabapentín?","100 mg c/8 h, aumentando 100 mg c/1-2 días (máx. 3600 mg/día)","3600 mg desde el inicio","300 mg/semana","100 mg única","Gabapentín: 100 mg c/8 h, aumentar 100 mg c/1-2 días (máx. 3600 mg/día).","A las 2 semanas tiene mucha boca seca y mareos."),
Q("T","¿En qué escalón pueden usarse los coadyuvantes?","En cualquier escalón de la escalera analgésica","Sólo en el 3er escalón","Sólo sin otros analgésicos","Nunca con opioides","Coadyuvantes: en cualquier escalón.","Elsa pregunta si puede combinarlo con paracetamol.")
]);

C(9,"Rosa, 22 años",
"Rosa cursa un embarazo de 12 semanas, su primer control. Come poca carne por razones económicas y toma mate con las comidas. No tiene sangrados. Toma ácido fólico desde hace 2 semanas.\n\nExamen: TA 105/65, leve palidez.\n\nLaboratorio: Hb 10,4 g/dl, VCM 76, ferritina baja. Grupo 0 Rh positivo. VDRL, VIH y HBsAg no reactivos.",
[
Q("P","Con Hb < 11 en el embarazo, ¿qué dosis de hierro indica el cuadernillo?","Sulfato ferroso 200 mg (120 mg de hierro elemental), 2 comp/día + dieta","1 comp de 100 mg/día como profilaxis","Hierro EV de entrada","Sólo dieta","Anemia en el embarazo (Hb 11): 2 comp/día de sulfato ferroso 200 mg + dieta; control c/4-6 semanas."),
Q("P","¿Cómo le indicás tomarlo?","Con el estómago vacío y con cítricos; lejos de mate, té, café y calcio","Con el mate de la mañana","Con leche","Con el almuerzo y café","Tomar con estómago vacío y con cítricos (vit. C); evitar fitatos, calcio, café, té.","Rosa pregunta cómo tomarlo."),
Q("T","¿Cada cuánto controlás la Hb?","Cada 4-6 semanas","Cada semana","Al final del embarazo","No hace falta","Control c/4-6 semanas.","Planificás el seguimiento."),
Q("T","¿Hasta cuándo continúa el hierro?","En el posparto, 120 mg por 3 meses","Hasta el parto y se suspende","Sólo 1 mes","De por vida","Continuar posparto 120 mg por 3 meses.","Rosa pregunta qué pasa después del parto."),
Q("T","¿Qué medida en el parto ayuda a prevenir la anemia del bebé?","Ligadura tardía del cordón (1-3 min)","Ligadura inmediata","Hierro IM al RN","Cesárea","Profilaxis: ligadura tardía del cordón (1-3 min), LME 6 meses, alimentación complementaria oportuna.","Rosa pregunta si se puede hacer algo por el bebé.")
]);
// Nuevos casos — tanda 2 (secciones 10 a 14)
C(10,"Marcela, 38 años",
"Marcela tiene 38 años, trabaja 9 horas frente a la computadora con la pantalla baja. Desde hace 10 días tiene dolor en la nuca y los trapecios, sin irradiación a los brazos, que empeora al final del día. Duerme con dos almohadas altas. Sin trauma, fiebre, pérdida de peso ni síntomas neurológicos. Está preocupada porque leyó que podría ser \"una hernia\".\n\nExamen: contractura de trapecios con puntos dolorosos, rotación cervical algo limitada por dolor, fuerza, sensibilidad y reflejos normales en miembros superiores. Spurling negativo.",
[
Q("T","¿Qué le explicás sobre el pronóstico?","Es benigno y suele ceder en 4-6 semanas; no medicalizar","Requiere resonancia urgente","Es una hernia de disco segura","Va a durar años","Cervicalgia: no medicalizar; explicar benignidad (cede en 4-6 semanas)."),
Q("P","¿Qué indicás respecto de la actividad?","Tratamiento activo temprano, movilización precoz y elongación; evitar el reposo en cama","Reposo en cama 2 semanas","Collar cervical permanente","Inmovilización total","Tratamiento activo temprano, evitar el reposo en cama; movilización precoz y elongación asistida.","Marcela pregunta si tiene que quedarse en cama."),
Q("P","¿Qué educación postural das?","Almohada baja, sentarse con el mentón hacia atrás y no levantar peso por encima de la cabeza","Dos almohadas altas","Pantalla baja","Dormir boca abajo","Educación postural: no levantar peso por encima de la cabeza, almohada baja, sentado con el mentón hacia atrás.","Repasás su puesto de trabajo y cómo duerme."),
Q("P","Cuando mejora el dolor, ¿cómo indica los ejercicios el cuadernillo?","Bajo la ducha caliente 5-10 min, 2 veces/día: rotación, flexoextensión e inclinación lateral","En el gimnasio con pesas","Sólo masajes","No hacer ejercicios","Ejercicios al mejorar el dolor, bajo ducha caliente 5-10 min, 2 veces/día.","A la semana el dolor bajó."),
Q("T","Si tuviera compromiso radicular, ¿qué cambia?","Limitar la actividad y collar cervical ≤ 2 semanas","Cirugía inmediata","Collar por 6 meses","Nada","Compromiso radicular: limitar la actividad y collar cervical ≤ 2 semanas. Alarma: empeoramiento súbito, fiebre, signos de SCA.","Su compañero tiene dolor cervical irradiado al brazo con parestesias en el pulgar.")
]);

C(10,"Cristina, 60 años",
"Cristina tiene 60 años. Desde hace 2 meses tiene dolor en la cara lateral de la cadera derecha, que empeora al acostarse sobre ese lado, al subir escaleras y al levantarse de una silla. Camina mucho por trabajo. Sin traumatismo, fiebre ni dolor inguinal.\n\nExamen: dolor a la palpación del trocánter mayor derecho, movilidad de la cadera conservada y sin dolor en rotaciones, sin dolor inguinal. Marcha normal. Rx de cadera sin artrosis significativa.",
[
Q("T","¿Cuál es el diagnóstico más probable?","Disfunción trocantérea (bursitis/tendinopatía del glúteo medio)","Artrosis coxofemoral avanzada","Sacroileítis","Fractura de cuello femoral","Dolor lateral a la palpación del trocánter con movilidad articular conservada: disfunción trocantérea."),
Q("P","Si no mejora con medidas y AINE, ¿qué procedimiento figura?","Infiltración en abanico en la inserción del glúteo medio con lidocaína 1 % + corticoide de depósito","Reemplazo protésico","Infiltración intraarticular guiada siempre","Inmovilización","Disfunción trocantérea: infiltración en abanico en la inserción del glúteo medio con lidocaína 1 % + corticoide de depósito.","Tras 4 semanas de AINE y medidas, sigue con dolor."),
Q("T","Para el dolor sacroilíaco, ¿cuál es la secuencia?","AINE VO (o gel/parche) → si no resuelve, infiltración con corticoide + lidocaína 2 %; reposo relativo 48 h","Cirugía","Opioides","Nada","Sacroilíaco: AINE VO (o gel/parche) → infiltración con corticoide de depósito + lidocaína 2 %; reposo relativo 48 h.","Su hermana tiene dolor glúteo con maniobras sacroilíacas positivas."),
Q("P","Si tuviera artrosis de cadera, ¿qué medidas indicás?","Evitar sobrecarga y presión lateral, almohada entre las piernas, movilidad y elongación; paracetamol hasta 3 g/día","Reposo absoluto","Corticoide oral crónico","Caminar con peso extra","Artrosis de cadera: evitar sobrecarga y presión lateral, almohada entre las piernas, movilidad y elongación; paracetamol hasta 3 g/día, AINE si no alcanza.","Años después aparece dolor inguinal mecánico y la Rx muestra artrosis."),
Q("T","¿Cuándo se plantea reemplazo protésico?","Dolor limitante pese a la analgesia","Al diagnóstico de artrosis","Nunca","Con dolor leve","Dolor limitante pese a analgesia → reemplazo protésico.","El dolor ya no la deja caminar 2 cuadras pese al tratamiento.")
]);

C(10,"Felipe, 4 años",
"Felipe tiene 4 años. Su abuela lo trae porque \"tiene los pies planos\" y quiere que le hagan plantillas y zapatos ortopédicos. Camina y corre bien, no se queja de dolor ni se cansa más que otros chicos. Sobrepeso leve.\n\nExamen: arco plantar ausente al apoyar, que se forma al ponerse en puntas de pie (test de Jack positivo). Movilidad subastragalina conservada. Sin dolor. Talón en leve valgo que corrige en puntas de pie.",
[
Q("T","¿Qué tipo de pie plano es?","Flexible","Rígido","Congénito vertical","Neurológico","El arco se forma en puntas de pie con movilidad conservada: pie plano flexible."),
Q("T","¿Requiere tratamiento?","No: el flexible no requiere tratamiento; hasta los 4-5 años no se trata","Sí, plantillas siempre","Sí, cirugía","Sí, yeso","Flexible: no requiere tratamiento (puede usarse arco de soporte para menor fatiga). Hasta los 4-5 años no se trata.","La abuela insiste en las plantillas."),
Q("P","¿Qué indicás?","Control de peso y ejercicios: puntas de pie, talones, levantar objetos con los dedos, caminar en arena o césped","Zapatos ortopédicos rígidos","Reposo","Nada en absoluto","Recomendar control de peso, ejercicios (puntas, talones, levantar objetos con los dedos), caminar en arena o césped.","La abuela pregunta qué pueden hacer en casa."),
Q("T","¿Qué calzado recomienda el cuadernillo?","Adecuado, no ortopédico: contrafuerte firme, suela flexible, talón vertical (\"rígido pero bajo\")","Ortopédico con cuña","Ojotas","Botas altas rígidas","Calzado adecuado (no ortopédico): contrafuerte firme, suela flexible, libera tobillo y dedos, talón vertical.","La abuela va a comprarle zapatillas."),
Q("T","¿Qué dice el cuadernillo sobre plantillas y calzado modificado?","No corrigen el pie plano","Lo corrigen en 1 año","Son obligatorios","Previenen la artrosis","Plantillas y calzado modificado no corrigen el pie plano. Rígido: Rx para definir tratamiento.","La abuela leyó que las plantillas \"forman el arco\".")
]);

C(11,"Gisela, 35 años",
"Gisela tiene 35 años, contadora, en época de cierre de balances. Desde hace 1 mes tiene cefalea opresiva bilateral \"como un casco\", leve a moderada, que aparece a la tarde y dura varias horas. Sin náuseas, vómitos, fotofobia ni aura. No empeora con la actividad. Duerme 5 horas. Toma paracetamol algunos días.\n\nExamen neurológico y fondo de ojo normales. TA 118/76. Contractura de trapecios.",
[
Q("T","¿Cuál es el diagnóstico?","Cefalea tipo tensión","Migraña con aura","Cefalea en racimos","Hipertensión endocraneana","Opresiva, bilateral, leve-moderada, sin náuseas ni fotofobia y sin empeorar con la actividad: cefalea tipo tensión."),
Q("P","¿Qué analgésicos indicás?","Paracetamol (leve-moderado) o AINE (ibuprofeno, naproxeno)","Opioides","Triptanes","Ergotamina","Paracetamol o AINE a dosis como en migraña; evitar opioides.","Hay que elegir el tratamiento sintomático."),
Q("T","¿Qué aumenta la eficacia del analgésico?","Asociar cafeína","Asociar BZD","Asociar codeína","Tomarlo con leche","Asociar cafeína aumenta la eficacia. Evitar opioides.","Gisela pregunta si hay algo que potencie el efecto."),
Q("P","¿Qué medidas no farmacológicas sugerís?","Relajación, elongación, ejercicio habitual, masajes y cambiar hábitos que perpetúan el dolor","Reposo absoluto","Ayuno","Lentes oscuros todo el día","No farmacológico (poca evidencia): relajación, elongación, ejercicio, masajes; cambiar hábitos.","Gisela reconoce que duerme poco y no hace pausas."),
Q("P","Si llegara a la guardia con dolor intenso, ¿qué figura?","Ketorolac 60 mg IM o 10 mg SL","Morfina IV","Sumatriptán SC","Dexametasona IV","Guardia con dolor intenso: ketorolac 60 mg IM o 10 mg SL.","Un viernes llega a la guardia con dolor intenso que no cede con ibuprofeno.")
]);

C(11,"Martín, 33 años",
"Martín tiene 33 años, fumador de 20 cigarrillos. Desde hace 2 semanas tiene, todas las noches a la misma hora, un dolor intensísimo alrededor del ojo derecho, \"como un puñal\", que dura 45 minutos, con lagrimeo, ojo rojo y congestión nasal del mismo lado. No puede quedarse quieto, camina por la casa. El año pasado tuvo un período similar de 6 semanas.\n\nExamen neurológico normal entre crisis. Sin HTA ni enfermedad coronaria.",
[
Q("T","¿Cuál es el diagnóstico?","Cefalea en racimos","Migraña","Neuralgia del trigémino","Glaucoma agudo","Dolor periorbitario unilateral intenso, 15-180 min, con síntomas autonómicos homolaterales, inquietud y patrón en racimos."),
Q("P","¿Cuál es el tratamiento abortivo?","O2 100 % a 12 L/min por 10-15 min + sumatriptán SC o nasal 6 mg","Ibuprofeno VO","Paracetamol","Ergotamina VO","Abortivo: O2 100 % a 12 L/min 10-15 min + sumatriptán SC o nasal 6 mg.","Hay que tratar la próxima crisis."),
Q("P","¿Qué preventivo indica el cuadernillo?","Verapamilo 240-480 mg/día VO en 3 tomas","Propranolol","Amitriptilina","Topiramato","Preventivo: verapamilo 240-480 mg/día VO en 3 tomas.","Las crisis son diarias."),
Q("T","Antes de indicar sumatriptán, ¿qué verificás?","Ausencia de HTA no controlada y enfermedad vascular","Función tiroidea","Glucemia","Nada","CI de triptanes: HTA no controlada, enfermedad vascular, angina de Prinzmetal, embarazo.","Revisás sus antecedentes cardiovasculares."),
Q("T","¿Por qué el AINE oral no es útil como abortivo en este cuadro?","Las crisis son muy intensas y breves; requieren un tratamiento de acción rápida","Porque es caro","Porque produce úlcera","Sí es de 1ª línea","El cuadernillo indica O2 + sumatriptán SC/nasal por la rapidez requerida. (Razonamiento clínico.)","Martín pregunta si puede tomar ibuprofeno cuando empieza.")
]);

C(11,"Ester, 66 años",
"Ester tiene 66 años. Desde hace 2 meses tiene crisis de dolor muy intenso, como descargas eléctricas, de segundos, en la mejilla y la mandíbula derechas. Se desencadenan al masticar, hablar, cepillarse los dientes o con el viento. Entre crisis no tiene dolor. Dejó de comer bien por miedo. Sin déficit sensitivo.\n\nExamen neurológico normal, sensibilidad facial conservada, reflejo corneal presente. Sin lesiones dentarias que expliquen el dolor.",
[
Q("T","¿Cuál es el diagnóstico?","Neuralgia del trigémino","Migraña","Cefalea tensional","Sinusitis","Dolor paroxístico tipo descarga en territorio V2-V3 con zonas gatillo y examen normal."),
Q("P","¿Qué fármaco indica el cuadernillo?","Carbamazepina 100-200 mg 2-3 veces/día","Paracetamol","Sumatriptán","Ibuprofeno","Neuralgia del trigémino: carbamazepina 100-200 mg 2-3 veces/día.","Hay que elegir el tratamiento."),
Q("T","¿Cuándo se espera la mejoría?","En 24-72 h; si no, replantear el diagnóstico","En 2 meses","Nunca mejora","En 1 hora","Mejoría en 24-72 h; si no, replantear diagnóstico.","Ester pregunta cuándo va a notar el efecto."),
Q("T","¿Cuál es la dosis de mantenimiento?","400-800 mg/día","50 mg/día","2000 mg/día","1200 mg/semana","Mantenimiento 400-800 mg/día.","A la semana está mucho mejor."),
Q("T","¿Qué control se pide?","Niveles plasmáticos (5-12 µg/ml)","TSH","Glucemia","Ninguno","Monitorear niveles de carbamazepina (5-12 µg/ml).","Ester pregunta si necesita análisis.")
]);

C(12,"Ricardo, 52 años",
"Ricardo tiene 52 años, gerente de una empresa, sedentario. En el examen preocupacional: cintura 110 cm, TA 138/88, glucemia en ayunas 112 mg/dl, TG 230 mg/dl, HDL 34 mg/dl. IMC 32. No fuma. Sin DBT ni ECV. Framingham 14 %. Pide \"una pastilla para prevenir la diabetes\".",
[
Q("T","¿Cuál es la terapia principal del síndrome metabólico?","Cambio intensivo del estilo de vida: descenso de peso con dieta y ejercicio","Metformina a todos","Estatina y AAS a todos","Orlistat solo","Cambio intensivo del estilo de vida (terapia principal): descenso de peso con dieta + ejercicio ≥ 30 min/día moderado."),
Q("P","¿Qué indicás sobre la metformina para prevenir DBT?","No como farmacoprevención de rutina; su rol no está establecido","Indicarla siempre","Sólo si IMC > 25","Darla en dosis altas","Metformina/tiazolidinedionas: rol no establecido; no farmacoprevención de rutina.","Ricardo vuelve a pedir la pastilla."),
Q("P","¿Qué fármaco puede agregarse al plan de descenso de peso en adherentes?","Orlistat (beneficio adicional de 5-10 %)","Anfetaminas","Diuréticos","Hormona tiroidea","± orlistat (beneficio adicional 5-10 % en adherentes).","A los 3 meses bajó 3 kg con buena adherencia."),
Q("T","Si se trata la TA, ¿qué grupo se menciona como promisorio?","IECA/ARA II","Betabloqueantes","Diuréticos de asa","Alfabloqueantes","El cuadernillo menciona IECA/ARA II como promisorios en el síndrome metabólico. Con la GPC Nacional de HTA 2026, primero se confirma la HTA (≥ 140/90 en 2 consultas) y, si se confirma, se inicia con dos fármacos a dosis bajas: IECA o ARA II + amlodipina o tiazida.","A los meses la TA sigue en 145/92."),
Q("T","¿Le corresponde aspirina?","No: sin ECV establecida no se indica; AAS 100 mg/día sólo en prevención secundaria","Sí, a todos con síndrome metabólico","Sí, si el Framingham supera el 20 %","Sólo con TG altos","GPC Nacional de HTA 2026 y vía clínica: AAS 100 mg/día + estatina de alta intensidad sólo con ECV establecida; sin ECV, estatina según RCV. El cuadernillo indicaba AAS 75-150 mg/día si Framingham > 20 %; USPSTF 2022 tampoco la recomienda de rutina en prevención primaria.","Ricardo leyó que la aspirina \"previene infartos\".")
]);

C(12,"Elvira, 78 años",
"Elvira tiene 78 años, con enfermedad coronaria (angina estable) y FA anticoagulada. Desde hace meses está más lenta, con frío, constipación y piel seca. Toma calcio con el desayuno y omeprazol.\n\nExamen: FC 58, piel seca, reflejos lentos. Sin bocio.\n\nLaboratorio: TSH 32 mUI/l, T4L baja.",
[
Q("T","¿Hay que tratar?","Sí: hipotiroidismo clínico con TSH elevada y T4L baja","No, por la edad","Sólo si TSH > 50","Sólo si tiene bocio","Hipotiroidismo clínico: tratar con levotiroxina."),
Q("P","Por su cardiopatía y edad, ¿cómo iniciás la levotiroxina?","Dosis baja (25 µg) y aumentos de 25 µg c/6-8 semanas","Dosis plena desde el inicio","200 µg/día","No se trata en coronarios","Inicio 25 µg, aumentar 25 µg c/6-8 semanas (en ancianos y coronarios, empezar bajo).","Hay que elegir la dosis inicial."),
Q("P","¿Cómo la toma respecto del calcio y el omeprazol?","≥ 1 h antes del desayuno y separada 4 h del calcio y del IBP","Con el calcio","Después de cenar con todo","Da lo mismo","Levotiroxina ≥ 1 h antes del desayuno; separar 4 h de ferroso, colestiramina, IBP, sucralfato y antiácidos.","Elvira toma todas las pastillas juntas en el desayuno."),
Q("T","¿Cuál es una contraindicación para iniciar levotiroxina?","IAM agudo o insuficiencia suprarrenal no corregida","Angina estable controlada","FA anticoagulada","Edad > 75","CI: tirotoxicosis, IAM agudo, insuficiencia suprarrenal no corregida.","Repasás contraindicaciones."),
Q("T","¿Cuándo pedís TSH de control?","A las 4-6 semanas de iniciar o ajustar","Al día siguiente","A los 2 años","Nunca","TSH a las 4-6 semanas de iniciar, luego c/6-12 meses.","Inicia el tratamiento sin efectos adversos.")
]);

C(13,"Josefina, 16 años",
"Josefina tiene 16 años; la traen sus padres porque bajó 10 kg en 6 meses, come muy poco, cuenta calorías, hace 2 horas de ejercicio por día y no menstrúa hace 4 meses. Se ve \"gorda\". Niega vómitos o laxantes. Está irritable y se aísla.\n\nExamen: IMC 15,8 (peso 72 % del adecuado), FC 46, TA 88/56, hipotermia leve, lanugo, piel seca.\n\nLaboratorio: K 3,2 mEq/l. ECG: bradicardia sinusal con QTc límite.",
[
Q("T","¿Cuál es el abordaje de base de los TCA?","Vínculo de confianza, involucrar a la familia desde el inicio y abordaje interdisciplinario","Dieta estricta sin la familia","Sólo antidepresivos","Hospitalización psiquiátrica siempre","TCA: vínculo terapéutico de confianza; involucrar a la familia; abordaje interdisciplinario y derivación en casos graves."),
Q("T","¿Tiene criterios de internación?","Sí: peso < 75 % del adecuado, bradicardia, hipotensión y alteración hidroelectrolítica","No, se maneja ambulatorio","Sólo si vomita","Sólo si lo pide","Internación: desnutrición severa (< 75 % del peso adecuado), deshidratación, alteraciones hidroelectrolíticas, arritmia, inestabilidad fisiológica, etc.","Revisás sus signos vitales y laboratorio."),
Q("P","Durante la internación, ¿cómo se controla el laboratorio?","Cada 24 h","Semanal","Mensual","Sólo al ingreso","Internado: VO estricta o SNG; laboratorio c/24 h.","Ingresa a sala."),
Q("P","Para la osteoporosis asociada, ¿qué indica el cuadernillo?","Recuperar peso y ciclos + calcio 1200-1500 mg/día y vitamina D 400 UI/día","Bifosfonatos de rutina","Estrógenos siempre","Nada","Osteoporosis: recuperar peso y ciclos; calcio 1200-1500 mg/día + vitamina D 400 UI/día (bifosfonatos discutidos).","La densitometría muestra baja masa ósea."),
Q("T","¿Qué se espera de la amenorrea?","Se corrige con la recuperación nutricional; hormonas si persiste 6-12 meses","Se trata con ACO de inmediato","Es irreversible","Requiere cirugía","Amenorrea: se corrige con la recuperación nutricional; considerar tratamiento hormonal si persiste 6-12 meses.","La madre pregunta si le tienen que dar pastillas para que menstrúe.")
]);

C(13,"Milena, 15 años",
"Milena tiene 15 años. La trae la preceptora porque en clase de educación física le vieron cortes superficiales en los antebrazos, algunos recientes. Milena dice que lo hace \"para descargar\" cuando se pelea con su madre, desde hace 3 meses. Niega intención de morir, planes o intentos previos. No consume sustancias. Tiene una amiga con quien habla. Vive con su madre y un hermano.\n\nExamen: cortes lineales superficiales en cara anterior de antebrazo izquierdo, sin signos de infección. Resto normal.",
[
Q("T","¿Cómo te vinculás inicialmente?","Escucha activa y contención emocional, sin juzgar","Retarla","Llamar a la policía","Ignorar los cortes","Escucha activa y contención emocional; trabajo con familia y referentes con consentimiento."),
Q("P","Sin ideación suicida, sin planes ni intentos, con red de apoyo, ¿qué nivel de riesgo y conducta?","Riesgo bajo: contención, consejería en regulación emocional, derivación programada a salud mental y control quincenal","Riesgo alto: guardia de salud mental inmediata","No requiere seguimiento","Internación psiquiátrica","Riesgo bajo: contención emocional, consejería en regulación emocional, derivación programada, control quincenal, registro y plan de acción.","Evaluaste el riesgo con cuidado."),
Q("T","Si tuviera riesgo moderado, ¿qué cambia?","Abordaje conjunto médico-psicológico en APS con seguimiento semanal","Nada","Sólo medicación","Alta sin control","Riesgo moderado: abordaje conjunto médico-psicológico en APS, plan de seguimiento semanal; derivar a 2° nivel si faltan recursos.","Al mes los cortes son más frecuentes y profundos, sin ideación suicida."),
Q("T","Si hubiera ideación con plan o un intento reciente, ¿qué corresponde?","Derivación inmediata a guardia de salud mental, acompañada por un adulto responsable","Control en 15 días","Sólo hablar con la madre","Nada","Riesgo alto: derivación inmediata a guardia de salud mental u hospital con psiquiatría; acompañamiento de adulto responsable; protocolo de urgencia.","Imaginá que Milena contara que pensó en tomarse todas las pastillas de la madre."),
Q("T","¿Qué intervenciones complementarias figuran?","Trabajo con familia y escuela, redes comunitarias y grupos de jóvenes","Aislarla de sus amigos","Prohibirle el celular","Ninguna","Complementarias: escucha activa, trabajo con familia/referentes (con consentimiento), articulación con escuela y redes, grupos de jóvenes.","La preceptora pregunta cómo puede ayudar la escuela.")
]);

C(13,"Tamara, 29 años",
"Tamara cursa un embarazo de 18 semanas. Desde hace 2 meses está triste, llora todos los días, no disfruta nada, duerme mal y siente culpa. Le cuesta trabajar. Niega ideación suicida. Tuvo un episodio depresivo a los 24 años que respondió a sertralina. Sin manía previa. No consume sustancias. PHQ-9: 18.\n\nExamen normal. TSH normal.",
[
Q("T","Con depresión moderada-severa en el embarazo, ¿qué indica el cuadernillo?","IRS (luego ATC), además de psicoterapia","Sólo psicoterapia siempre","Ningún fármaco en el embarazo","Litio","Embarazo: leve → psicoterapia; moderada-severa → IRS (luego ATC)."),
Q("P","¿Qué IRS evitás en el 1er trimestre?","Paroxetina","Sertralina","Citalopram","Fluoxetina","Evitar paroxetina en el 1er trimestre.","Repasás opciones; ya respondió antes a sertralina."),
Q("P","¿Qué se recomienda cerca del parto?","Reducir progresivamente 10-14 días antes del parto y reinstaurar después si hay riesgo de recaída","Duplicar la dosis","Suspender bruscamente en el 1er trimestre","Nada","Reducir progresivamente 10-14 días antes del parto y reinstaurar después si hay riesgo de recaída.","Está bien a las 34 semanas con sertralina."),
Q("T","En la lactancia, ¿qué dice el cuadernillo?","Evitar antidepresivos; si hacen falta, usar IRS","Siempre ATC","Suspender la lactancia","Usar litio","Lactancia: evitar; si hace falta, IRS.","Tamara quiere amamantar."),
Q("T","¿Cuánto dura como mínimo el tratamiento antidepresivo?","6 meses","1 mes","2 semanas","Hasta el parto","Duración mínima 6 meses.","Tamara pregunta cuánto tiempo va a tomarlo.")
]);

C(14,"Cristian, 30 años",
"Cristian tiene 30 años, voluntario de Defensa Civil. Hace 2 días se cortó la pierna con una chapa mientras sacaba escombros en agua de inundación. La herida ahora está roja, caliente y dolorosa. Sin fiebre. No recuerda cuándo se vacunó contra el tétanos; cree que de chico. Sin alergias.\n\nExamen: herida de 4 cm en la pantorrilla izquierda con eritema perilesional de 3 cm, sin necrosis, ampollas, crepitación ni linfangitis. T 37,2 °C, FC 84.",
[
Q("P","¿Qué hacés primero con la herida?","Limpieza con SF o antiséptico y evaluar profundidad, infección y cuerpos extraños","Sutura cerrada inmediata","Sólo vendar","Nada","Evaluación inicial: limpieza con SF o antiséptico (iodopovidona, clorhexidina); evaluar profundidad, infección, cuerpos extraños; estado antitetánico."),
Q("P","Para una infección leve, ¿qué ATB indicás?","Cefalexina 500 mg c/6 h por 5-7 días, reevaluando a las 48-72 h","Ciprofloxacina 3 días","Amoxicilina 1 dosis","Metronidazol","Guía SADI de IPPB 2025: celulitis leve → cefalexina o cefadroxilo, 5-7 días, con reevaluación a las 48-72 h; agregar TMS o doxiciclina si hay riesgo de SAMR o no responde. (El cuadernillo: cefalexina 500 mg c/8 h 7-10 días, alt. TMS 160/800 c/12 h.)","La herida está limpia; hay celulitis leve."),
